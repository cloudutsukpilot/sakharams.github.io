# US Healthcare learning path (pages/domains/healthcare.md → _includes/domain-path.html).
#
# levels: shown in order, basic → advanced. topics: grouped under their `level`, in order.
# A post joins a topic through its front matter: `domain: healthcare`, `domain_topic: <topic id>` and
# `domain_order: <n>` (sort order within the topic). The topic id is also the post's folder under
# _posts/domains/healthcare/ and its last `categories` entry. `coming_soon: true` marks a placeholder.

levels:
  - id: basic
    title: "Level 1 · Foundations"
    blurb: Who the players are, how insurance plans work and what patients pay. Start here if US healthcare is new to you.
  - id: intermediate
    title: "Level 2 · Core workflows"
    blurb: The business processes that turn a visit into a payment, and the rules that govern patient data.
  - id: advanced
    title: "Level 3 · Health data exchange"
    blurb: The standards that carry those workflows between systems, from EDI X12 to HL7, FHIR and DICOM.
  - id: expert
    title: "Level 4 · Health tech engineering & strategy"
    blurb: Building compliant systems on these standards, and the payment models changing the industry.

