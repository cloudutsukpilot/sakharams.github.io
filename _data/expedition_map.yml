# Expedition Map (/posts/sitemap/map/ and the "Map" tab).
#
# Countries are the map's top-level regions. Posts are placed by their `categories:` list:
# the longest matching prefix in `routes` decides the country (and optionally the state).
#
#   routes:
#     devops: devops              # country only: the next category becomes the state
#                                 #   [devops, cicd, github-actions] -> DevOps › CI/CD (district: Github Actions)
#     azure: cloud/azure          # country and state: the next category becomes the district
#                                 #   [azure, networking] -> Cloud › Microsoft Azure (district: Networking)
#
# Keys are lowercase category paths joined with "/". A post whose top category has no route lands
# in "Uncharted Territory" and test/expedition_map_test.rb fails until you add one.
# A single post can also be placed explicitly with `map: country/state` in its front matter.
# Changing this file never changes post URLs.

countries:
  - id: cloud
    name: Cloud
    icon: fas fa-cloud
    color: "#3b82f6"
  - id: devops
    name: DevOps
    icon: fas fa-infinity
    color: "#f97316"
  - id: security
    name: Security
    icon: fas fa-shield-halved
    color: "#ef4444"
  - id: ai
    name: AI & ML
    icon: fas fa-robot
    color: "#a855f7"
  - id: architecture
    name: Architecture
    icon: fas fa-landmark
    color: "#14b8a6"
  - id: infrastructure
    name: Infrastructure
    icon: fas fa-server
    color: "#eab308"
  - id: programming
    name: Programming
    icon: fas fa-code
    color: "#22c55e"
  - id: homelab
    name: Homelab & Projects
    icon: fas fa-campground
    color: "#ec4899"
  - id: career
    name: Career & Field Notes
    icon: fas fa-compass
    color: "#06b6d4"
  - id: domains
    name: Domain Knowledge
    icon: fas fa-briefcase
    color: "#84cc16"

# Category paths that are not placed on the map at all.
