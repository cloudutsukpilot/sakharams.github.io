# Feature catalog for the OnePlatform project playbook (/tags/oneplatform/).
# Rendered by _includes/project-features.html in
# _posts/projects/oneplatform/2026-10-05-03-product-planning.md (#feature-catalog).
#
# Kept OUT of _data/projects/ on purpose: the Projects tab lists every file in that folder as a project.
# Company, product, business-unit, host, vault, subscription and ticket names are deliberately left out
# (public repo). Internal names were replaced with generic ones.
#
# Field meanings
#   id          stable kebab-case key; use it as the anchor / file name of a future deep-dive post
#   name        feature name as users see it (generic where the internal name was identifying)
#   category    one of the `categories` keys below
#   kind        Scaffolder template | Portal page | Plugin | Catalog ingestion | Backend job | Platform capability
#   shipped     YYYY-MM of the first commit on main (from git history), not a confirmed production date
#   status      Live = merged to main and in the release train; In progress = plan still open
#   repos       portal = Backstage monorepo, middleware = .NET API/Functions solution
#   docs        which planning docs exist in the source repo to draw on when expanding this feature
#   summary     one sentence, what it does for the user
#   lifecycle   EMPTY on purpose: fill these in when you write the feature's deep dive
#               (requirements -> design -> implementation -> testing -> release -> benefits)
#   post        URL of the deep-dive post once it exists

categories:
  foundation: Portal foundation
  catalog: Software catalog and ownership
  infra: Self-service Azure infrastructure
  access: Developer access and licensing
  insights: Engineering insights and reporting
  operations: Operations and monitoring
  identity: Identity, audit and compliance
  finops: FinOps and cost
  apps: Business workflows hosted in the portal
  devex: Developer experience of the portal team

