brief: >-
  The author asked for this playbook to be written from the platform-wardens repo (2026-11-09), with no
  company or team names. Source of truth: the repo's README, docs/project-goal.md, docs/phases,
  docs/decisions (published as the ADR log), framework/README.md and the agents' manifests and
  READMEs. Platform Wardens is a multi-agent framework for operations work: its agents do day-to-day
  DevOps, SRE and DBA work, and the three teams build, govern and run the framework. v1 agents only
  observe (L0) and recommend (L1). Three layers: Pydantic AI inside a stage, Temporal for durable
  execution, and the wardens package for coordination and the rules every agent follows. First
  deployment: the wardens k3d cluster of the Cloudutsuk Platform homelab.
