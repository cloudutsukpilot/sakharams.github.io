brief: |
  Source material: the project's own docs (README, architecture, cronjobs, deployment, storage, ui,
  tech-stack), a read-only look at the repo, and the author's answers below. People, company and
  environment identifiers are redacted.

  Why it was built: to provide a daily summary for managers, stakeholders, etc., and weekly and monthly
  summaries for C-level executives. Each person works in different tools and has a manual dependency
  on updating their status; this system automates the collection and summarization of their activities.

  Who reads what: open to all to read what is currently being done. It provides accurate data as it
  pulls from Jira and GitHub. Sensitive information like private repos or Jira comments is excluded
  (author's statement; see the code finding below).

  People data: people know their activity is summarized and can see their own summaries. The
  summaries are used in performance reviews. HR, legal and privacy reviewed it. Nothing is kept out of
  the AI prompts specifically; there is no PHI in GitHub or Jira.

  AI: Azure OpenAI in production. Accuracy is an ongoing process of tuning prompts and models.

  Team and timeline: solo for 5 months, then a team.

  Results: time saved for every individual contributor, who get daily, weekly and monthly updates for
  standups and weekly updates; time saved for managers giving updates to stakeholders; monthly updates
  for C-level executives.

  Standalone project; no cross-links to other playbooks.

  Code findings (repo, read-only): the Jira collector's default config collects comment bodies
  (search_types.comments: true, comment_fields includes body) and the daily prompt asks the AI to
  summarize them; the GitHub collector has no private-repo filter (it sees what the GitHub App
  installations can see). The frontend is Vite 5 + Tailwind + react-markdown; the POD generator is
  prod-pod-summary-generator; productivity-ui runs 1 replica with an unused autoscaling block.
