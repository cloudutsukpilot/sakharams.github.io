brief: |
  Author's request (2026-10-05): "Please refer to the 2 repos under /home/sakharam/gitrepos/backstage
  and understand the project which is based on the Spotify's backstage open source projects. I need to
  create a project based on the implementation (what is implemented in the 2 repos) and create
  architecture, documentation, etc based on skill. I also need a list of features that are added to the
  [portal name redacted]/backstage portal, which I can later expand to show how each feature has requirements gathered,
  designed, implemented and tested before it was released and any benefits."

  Author's answers (2026-10-05):
  - Disclosure: anonymize. Remove all company names, hostnames, etc. Name the portal "OnePlatform".
  - Role: team member / lead on the platform team ("we" for the team's work).
  - Feature list: a data file plus a catalog section in Product Planning, expandable per feature.
  - Status: Live.

  Facts taken from the two repositories (portal monorepo and .NET middleware), not from the author:
  - Portal: Backstage 1.5x on the new backend and frontend systems, Node 24, React 18, TypeScript,
    PostgreSQL 16, Yarn 4 monorepo; ~45 custom frontend/backend plugins, ~50 custom scaffolder actions,
    45+ software templates. Repo history starts Jan 2024; ~1,600 commits; ~100 commits a month in 2026.
  - Middleware: .NET 10 ASP.NET Core API (container on AKS) + Azure Functions v4 timer/HTTP jobs +
    shared services library; EF Core on PostgreSQL (and read-only/dynamic SQL Server); JWT client auth.
  - Identity: Entra ID SSO (primary) and GitHub App auth (secondary); 13 role groups in Entra; custom
    permission policy with environment scoping and hard blocks; backend PHI redaction by usage location.
  - Integrations: Azure ARM/Graph/Monitor/Cost, GitHub REST/GraphQL, Jira Cloud, SonarQube, Artifactory,
    Datadog, Statuspage, Ansible, Zscaler, SMTP, Temporal, Terraform via GitHub Actions.
  - Delivery: Docker image -> registry, Argo CD auto-deploys dev from a charts repo; promote workflows
    bump staging/prod values; middleware via Helm + manual-dispatch workflows; EF migrations applied manually.
  - Tests (portal, at one recorded green run): 2,693 unit, 356 integration (Testcontainers PostgreSQL),
    30 Playwright E2E; SonarQube gate. Middleware: ~1,850 xUnit tests, Testcontainers integration lane.
  - Every non-trivial feature has PLAN / DESIGN / IMPLEMENTATION / ARCHITECTURE docs produced through
    repository AI prompts (feature-planner, feature-implement, change-request).
  - Not in the repos (left as open questions in the posts): user counts, adoption numbers, SLOs, DR targets, budget, team
    size and structure, sponsor names, original business case.
