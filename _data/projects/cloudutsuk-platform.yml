brief: |
  Author's request (2026-10-10): "I am loving the way that labs are being generated for the blog
  cloudutusk.com. I have a repo for the blog sakharams.github.io, I have shared module of terragrunt and
  terraform with consumables repo starting with infra-* in the same folder. I need to create a dashboard
  if possible within cloudutsuk.com which will have a user login associated with the google sso/entra id.
  Once login, i should see a dashboard which would have details of the resources that I have created
  locally on dgx, in any of the cloud providers, etc. The dashboard should also show the cost that is
  being incurred for each of those resources. Please note that this website is hosted on github.io and is
  a static website. If a dashboard is not possible there, we can have a separate repo with the code for
  the dashboard running locally and show all these details. Along with all the resources, I also need a
  lab section which shows the different labs that are added to the blog and a way to deploy or destroy
  with one click. This app can run locally on a k3d cluster. I also need to setup a central k3d cluster
  which will just be used for collecting and storing OTEL signals. The plan is to have multiple k3d
  cluster running locally for different lab scenarios and then have a single cluster as a monitoring
  platform to collect all the OTEL signals, have dashboards, setup alerts, etc. The dashboard will also
  have a chatbot feature which I ask questions about my setup and it can answer based on the data from
  all these repos. The data from all these repos needs to collected into a RAG system using vector
  databases along with semantic caching which the chatbot can query and answer. The chatbot should be
  able to use local model as we have a dgx spark and can use a model running on a k3d cluster served by
  vLLM or similar technology. Once all these are done, I need to create a agent which gets invoked
  whenever an alerts is triggered for any of the kubernetes cluster and perform the required
  troubleshooting using the LLM as well as the knowledge from vector databases. Also, we keep on adding
  new blogs/labs to the blog, the RAG pipeline should be running continuously on a schedule to pull data
  and update the vector databases."

