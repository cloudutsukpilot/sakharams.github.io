  Decisions taken while planning (same session):
  - Portal: extend the existing Backstage app (self-service-portal); it needs a custom image.
  - Hosting: everything on the DGX Spark, $0. Public at portal.cloudutsuk.com via Cloudflare Tunnel +
    Access; cloudutsuk.com DNS moves from GoDaddy to Cloudflare; the blog stays on GitHub Pages.
  - Alert agent: extend the existing sre-agent (k8s subagents, HITL approvals, Slack).
  - Inventory and cost scope for v1: Azure, AWS, GCP and the DGX itself (k3d/docker, power cost).
  - Local CI/CD: GitHub Actions self-hosted runners (ARC) on the DGX, BuildKit, Zot registry in the core cluster (Harbor has no arm64 images), one
    central Argo CD for all clusters (hub and spoke).
  - Schedules: inventory and RAG ingest every 6 hours, with manual "Sync now" / "Re-index now".
  - New repos (created through infra-github on 2026-10-11, private): infra-local, homelab-gitops, homelab-services.
  - ADRs: MADR files in homelab-gitops/docs/adr, full text synced to the blog.
  - Non-functional review: single host by design (optimise recovery, RTO 1 h / RPO 24 h), dead-man's
    switch, backups of Postgres and secrets only, lab admission control and cloud-lab TTL, graceful
    degradation, self-hosted runners only on private repos.
  - RAG visualization: Arize Phoenix (self-hosted, OpenTelemetry/OpenInference traces), user's preference.
  - AI scaling: model serving in its own `ai` k3d cluster behind a LiteLLM gateway (ADR 0022);
    one GB10 can't scale out, so capacity grows by adding gateway backends (2nd box, hosted overflow).
  - Secrets and DNS: a dedicated `core` k3d cluster (boots first) runs OpenBao and PowerDNS; External
    Secrets in every cluster; internal zone home.cloudutsuk.com with ExternalDNS and Let's Encrypt (ADRs 0023-0025).
  - Identity: Keycloak in `core` brokers Google/Entra for people, tools and kubectl; services use
    client-credentials JWTs and short-lived Kubernetes tokens from OpenBao (ADRs 0028-0029).
  - "Keep updating the posts in the project as we move forward."

  Hardware: NVIDIA DGX Spark (GB10, 20 cores, ~121 GB unified memory, 3.7 TB disk).
