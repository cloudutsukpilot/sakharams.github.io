brief: >-
  From the blog tracker (B-010, 2026-11-18), in the author's words: To deploy a Retrieval-Augmented
  Generation (RAG) system on Azure, provision your core AI and data services in the same region, index and
  embed your source documents, and connect an orchestrator or agent to a chat model. 1. Provision Core Azure
  Resources: create a resource group in your chosen region and set up the required services (via the Azure
  portal, Microsoft Foundry, or Infrastructure-as-Code like Terraform or azd): Microsoft Foundry / Azure
  OpenAI (deploy an embedding model for vectorizing text/queries and a chat/reasoning model for generating
  responses); Azure AI Search (the retrieval layer and vector index); Storage (Azure Blob Storage or Azure
  Files) for the raw source documents (PDFs, text files, CSVs); App Hosting (optional): Azure App Service or
  Azure Container Apps for a web frontend, API backend, or custom orchestrator. 2. Ingest, Chunk, and Index
  Your Data: upload your knowledge files to your storage container or file share; use Azure AI Search (or an
  ingestion pipeline) to extract text, split documents into smaller chunks, generate vector embeddings via
  your embedding model, and store them in a search index; enable hybrid or semantic search/ranking where
  helpful. 3. Connect Retrieval, Orchestration, and Generation: Standard RAG, where an orchestrator (Microsoft
  Agent Framework, Semantic Kernel, LangChain, or custom API code) takes a user query, searches the Azure AI
  Search index, injects the top matching chunks into the prompt as context, and calls the chat model;
  Foundry / Agentic RAG, where for multi-step reasoning or managed web app integration you connect your app
  to Foundry Agent Service or a knowledge base so retrieval and grounding are handled alongside agent
  orchestration. 4. Test, Secure, and Deploy: test grounding and prompt behavior in the playground or local
  dev environment before exposing endpoints; configure Microsoft Entra ID authentication, Azure RBAC roles,
  and access controls for sensitive data; deploy your application code and index configuration, then
  monitor query quality and latency. For architectural patterns and trade-offs between standard and agentic
  pipelines, see Design and Develop a RAG Solution on Azure.
  Author's answers (2026-11-18): deliverable is this playbook plus a plan with a progress table in a new
  repo; code, index-as-code and evals in a new lab repo, Azure resources in the platform's infra-azure
  Terraform; scope is standard RAG, agentic RAG, evaluation and monitoring, and a comparison with the
  homelab RAG; network posture is public endpoints with keyless Entra ID and RBAC first, the lowest Search
  tier that supports it, torn down between sessions, private endpoints in a later phase; corpus is the
  blog's own public posts.
  Author (2026-11-19): implement a similar RAG system on AWS and GCP using the same repo, multiple folders if
  required or the same code if it is independent of the cloud provider; start with Azure.
  Author (2026-11-23): set a decent budget cap considering this as POC and then use a basic chat model which
  would suffice for example terraform-drift agent chat agent. Asked the same day how the playbook should describe
  where the stack runs (a sandbox subscription in a separate tenant since 2026-11-22), the author chose a generic
  description with no names.
  Author (2026-11-23), on the playbook's open questions: select the recommended and sensible choices for these
  questions (pace and M1 date, public demo, Phase 5 access, the sandbox subscription, quota, Infracost, a required
  reviewer, p95 targets).
