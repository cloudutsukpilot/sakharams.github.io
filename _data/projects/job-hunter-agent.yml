brief: |
  Author's request (2026-10-21): read Mindy Jen's three dev.to articles on a LinkedIn job-application
  agent ("HunterAgent") and plan an implementation; then build it.

  Author's decisions:
  - LLM: the local model behind the homelab's LiteLLM gateway (qwen3.5-35b-a3b), not a cloud API.
  - Approval: manual approve only. The agent never submits an application, sends a connection request
    or a message.
  - Repo: a new private repo in the cloudutsukpilot org (job-hunter-agent). API in FastAPI.
  - Database: Supabase, as in the articles (the cloud free tier).
  - Deployment: the homelab platform cluster; the LinkedIn MCP server as a sidecar in the app pod;
    sign-in for platform-admins only (Keycloak); hostname jobs.platform.home.cloudutsuk.com.
  - Resumes: the author's real platform-architect resume, plus cloud-architect and devops-architect
    versions derived from it truthfully.

  Built 2026-10-21 to 2026-10-22, then extended on request the same week: several search profiles
  with their own resume, mode, tone and schedule; per-profile scheduled runs spread through the day;
  a review page with skills required vs. yours, a shortlist confidence and collapsible drafts; an
  Evaluate / Re-evaluate button per job; editable resumes; run history and totals; company research
  with financials, headcount and news from public sources; Slack messages when a run finishes.

  Key facts from the code (job-hunter-agent):
  - Agents (one base class, every run stored with OpenTelemetry spans): job scorer, resume optimizer
    (returns line edits the app applies, so a 28k-character resume is never regenerated), cover letter
    (4 tones), job facts (LLM fallback only), company research (cached per company), contacts (links
    only from scraped references).
  - Deterministic truthfulness checks: numbers, quoted originals and posting terms the output adds that
    the original resume doesn't have; capitalised phrases with their acronym count as one term. Any flag
    blocks approval until accepted.
  - Status flow: pending_review -> approved -> applied, or rejected (and reopen).
  - Structured output via JSON schema, thinking disabled, one repair retry, 300 s timeout.
  - Discovery filters: duplicates, excluded companies, reposts. (An applicant-count filter was removed
    at the author's request.)
  - Evaluation of 6 real postings: skills mode was cleanest; keyword mode added tools; tailor from the
    master resume.
  - Lessons from the build: a LinkedIn session-copy test hit a redirect loop and HTTP 429 and
    invalidated the session; the sidecar's Chromium was OOMKilled at 2 GiB (now 3 GiB); the in-cluster
    LinkedIn sign-in needed --chrome-path, a pwuser-owned HOME on the volume and an exec-based login;
    cert-manager DNS-01 needed public resolvers because of split DNS; Wikidata refuses requests without
    a descriptive User-Agent.
