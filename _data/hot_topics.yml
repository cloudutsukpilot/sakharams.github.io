# Hot topics explorer on the home page (_includes/hot-topics.html, assets/js/hot-topics.js).
# One tab per topic, in the order listed. Each tab lists the newest posts carrying ANY of the
# topic's `tags` or `categories` (exact names as used in post front matter; case matters).
#   name:       tab label
#   icon:       Font Awesome classes (https://fontawesome.com/search?ic=free)
#   blurb:      one line shown above the posts
#   tags / categories: where the posts come from (either or both)
#   link:       optional "View all" target; defaults to the first tag's page, else the first category's
# `limit` is how many posts each tab shows.
limit: 6
topics:
