# Cloud service comparison shown on the Cloud tab (_tabs/cloud.md via _includes/cloud-compare.html).
#
# One entry per service category (`overview:` is its cross-provider overview post); under each, the services each provider offers for it.
#   name:  service name as the provider brands it
#   what:  a few words on what it is (tile subtitle, and the placeholder post's description)
#   post:  source path of the post the tile links to (resolved to its URL at build time, so
#          folders with spaces or odd categories still link correctly)
#   icon:  official service icon at assets/img/icons/cloud/<provider>/services/<icon>.svg
# A provider with no service for a category gets `<provider>_note:` instead of a list.
# Posts with `placeholder: true` in their front matter get a "Soon" badge on their tile.

providers:
  - id: aws
    title: AWS
    name: Amazon Web Services
    logo: /assets/img/icons/cloud/aws/amazonwebservices-18.svg
    overview: _posts/cloud/aws/2024-07-08-aws.md
