# Layout of the Projects tab (_tabs/projects.md → _includes/projects-catalog.html).
#
# categories: the tile groups, in display order. A project joins a group through its `category`:
#   - project playbooks: `category:` and `clouds:` in _data/projects/<slug>.yml
#   - hands-on labs: `category:` and `clouds:` in _data/labs/<slug>.yml (normally hands-on-labs)
#   - older projects that aren't playbooks: the `extra:` list below
# A project whose category is missing or unknown still shows, under "More projects".
#
# clouds: the filter buttons. Each project lists the clouds it targets (`clouds: [azure, aws]`);
# a project with more than one also matches "Multi-cloud".

categories:
  - id: platform-engineering
    title: Platform Engineering & Developer Experience
    icon: fas fa-cubes
    blurb: Internal platforms, self-service and infrastructure as code that make other teams faster.
  - id: ai-automation
    title: AI & Intelligent Automation
    icon: fas fa-robot
    blurb: LLMs and agents put to work on operations and reporting, with humans kept in the loop.
  - id: devops-kubernetes
    title: DevOps, CI/CD & Kubernetes
    icon: fas fa-infinity
    blurb: Pipelines, containers, Kubernetes and the metrics that show whether DevOps is working.
  - id: solution-architecture
    title: Cloud Solution Architecture
    icon: fas fa-sitemap
    blurb: End-to-end designs for business problems, from requirements to cost, on one cloud or three.
  - id: hands-on-labs
    title: Hands-on Labs
    icon: fas fa-flask
    blurb: Build it, deploy it, poke it, and read the dashboards. Each lab has runnable code and real screenshots.

clouds:
  - { id: azure, title: Azure, icon: fab fa-microsoft }
  - { id: aws, title: AWS, icon: fab fa-aws }
  - { id: gcp, title: GCP, icon: fab fa-google }
  - { id: agnostic, title: Cloud-agnostic, icon: fas fa-cloud }

