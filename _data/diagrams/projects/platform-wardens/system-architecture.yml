# Ported from platform-wardens diagrams/wardens-platform/diagram.yml (2026-11-20); icons mapped to the blog's logos,
# links to private repositories and their PR numbers removed. Edit the source in platform-wardens and port again, so the two stay the same.
# platform-wardens as built on the homelab (checked 2026-11-20 against platform-wardens main, wardens-deploy main,
# homelab-gitops clusters/wardens, apps/wardens-console, apps/wardens-router, charts/wardens-agent, agent-ci.yaml,
# .github/actions/image-gates and image-build-finish, ADRs 0104, 0111, 0112 and 0113, and infra-local
# host/cloudflared/routes.yaml). Since 2026-11-19 every agent lives in its own warden-<agent> repository, is built only
# by homelab-gitops agent-ci.yaml and is read by the pods from wardens-deploy's registry. The use cases follow
# docs/how-docs/, the agent lifecycle (docs/framework/17-agent-lifecycle.md) and the release flow (framework/README.md).
# Certificates: Let's Encrypt through cert-manager (cluster issuer `letsencrypt`, DNS-01 via Cloudflare) on every
# Traefik ingress; in-cluster hops are plaintext behind NetworkPolicies. Not checked with openssl.
# Updated on the blog 2026-11-25 (not yet in the source): level 2 approve-then-act through Slack buttons (decision 0047),
# registry approvals asked by CI and committed by wardens-deploy's approvals sync (decisions 0048, 0049), the console's
# Home and Approvals pages, the agents' current versions, and cluster-upgrade-readiness deployed.
# Build: PLUGIN=<interactive-diagrams plugin folder> ./build.sh
title: wardens platform
description: "How platform-wardens runs on the homelab today: entry points, the ingress bus, the router, one Temporal task queue per agent, models and MCP through LiteLLM, the registry from wardens-deploy, and the whole agent life cycle from a pull request's security scans to a signed, admitted worker."
level: 1
lock: true
levels: [Context, Homelab, Clusters, Namespaces, Inside]
accent: "#2563EB"
accent2: "#8B5CF6"

views:
  - {id: cicd, label: CI/CD & SDLC, icon: rocket}
  - {id: scans, label: Security scans, icon: shield}
  - {id: security, label: Identity & secrets, icon: lock}
  - {id: state, label: State & audit, icon: database}
  - {id: observability, label: Observability, icon: chart}

certs:
  le-home:
    label: "<app>.<cluster>.home.cloudutsuk.com"
    type: public
    by: "Traefik, the ingress controller of each k3d cluster (TLS ends there)"
    issuer: "Let's Encrypt → ISRG Root X1; ACME DNS-01 through Cloudflare by cert-manager (cluster issuer `letsencrypt`)"
    valid: "90 days; cert-manager renews it before expiry"
    stored: "A Secret per Ingress in the app's namespace (for example `wardens-console/wardens-alerts-tls`)"
    trust: "Public chain: Python's and Go's CA bundles and every browser trust ISRG Root X1"
  le-hooks:
    label: hooks.cloudutsuk.com (origin)
    type: public
    by: "Traefik on the wardens load balancer 172.30.0.6, for the tunnel's origin request"
    issuer: "Let's Encrypt → ISRG Root X1; cert-manager, cluster issuer `letsencrypt`"
    valid: "90 days; cert-manager renews it"
    stored: "Secret `wardens-console/wardens-hooks-tls` (the Slack relay shares the host and its certificate)"
    trust: "cloudflared checks it against `originServerName: hooks.cloudutsuk.com`"
  cf-edge:
    label: "*.cloudutsuk.com at Cloudflare's edge"
    type: public
    by: "Cloudflare's edge (TLS ends there, then the tunnel carries the request)"
    issuer: "Cloudflare Universal SSL, issued and renewed by Cloudflare"
    valid: "Managed by Cloudflare"
    trust: "Public chain: GitHub's and Slack's webhook senders and browsers trust it"
  cf-tunnel:
    label: Cloudflare Tunnel connection
    type: public
    by: "Cloudflare's tunnel endpoint; cloudflared opens the connection outbound from the host"
    issuer: "Cloudflare's own CA for tunnel endpoints; cloudflared authenticates with the tunnel's credentials file"
    valid: "Managed by Cloudflare"
    trust: "cloudflared pins Cloudflare's tunnel CA"
  github-pub:
    label: "api.github.com / github.com"
    type: public
    by: "GitHub"
    issuer: "GitHub's public CA chain, managed by GitHub"
    valid: "Managed by GitHub"
    trust: "Public chain in the image's or runner's CA bundle"
  slack-pub:
    label: "slack.com / hooks.slack.com"
    type: public
    by: "Slack"
    issuer: "Slack's public CA chain, managed by Slack"
    valid: "Managed by Slack"
    trust: "Public chain in the image's CA bundle"
  azure-pub:
    label: "management.azure.com / login.microsoftonline.com"
    type: public
    by: "Azure Resource Manager and Entra ID"
    issuer: "Microsoft Azure TLS issuing CAs → DigiCert Global Root G2; managed by Microsoft"
    valid: "Managed by Microsoft"
    trust: "Public chain in the image's CA bundle"
  k3s-ca:
    label: wardens cluster API (172.30.0.1:6446)
    type: cluster
    by: "The k3s API server of the wardens cluster"
    issuer: "The cluster's own CA, created by k3s when infra-local made the cluster"
    valid: "k3s rotates serving certificates; the CA lasts 10 years"
    trust: "Argo CD holds the CA in its cluster Secret for `wardens`; the API server calls Kyverno's webhook with the CA Kyverno registers"

nodes:
  - id: engineer
    label: Platform engineer
    sub: "operator · agent owner"
    icon: user
    status: external
    facts:
      summary: "Builds and ships agents in their own repositories, sends tasks from the operator console, asks in the cell channels and holds the kill switch."
      how: "Browser on the tailnet (or console.cloudutsuk.com through Cloudflare Access), `git push` to GitHub, Slack for findings and questions."
      api: "None of their own: the console, GitHub and Slack"

  - id: approver
    label: Cell reviewer
    sub: "wardens-<cell>-reviewers"
    icon: users
    status: built
    views: [cicd, security]
    facts:
      summary: "Approves a registry entry that raises an agent's risk, and an agent's level 2 action (a drift merge or apply). Never the requester, unless the request allows the owner's self-approval."
      how: "Registry entries on the console's Approvals page (\"Waiting for you\"); level 2 actions with Approve or Deny on the Slack card, from a linked account in an approver group, or on the console."
      api: "None of their own: the Approvals page and the Slack card"

  - id: github
    label: GitHub
    sub: "cloudutsukpilot org"
    icon: devops/cicd/github-18.svg
    status: external
    facts:
      summary: "Holds every repository of the life cycle: the agents, the framework, the deploy config and registry, homelab-gitops, and the IaC repositories the agents read."
      how: "Each agent has its own GitHub App; the homelab-gitops writer App commits digests and registry entries; ARC runners take the Actions jobs."
      url: {Org: "https://github.com/cloudutsukpilot"}
      api: "`https://api.github.com`"
    children:
      - id: gh_agents
        label: warden-<agent> repos
        sub: "6 agents · copier template"
        icon: git
        status: external
        facts:
          summary: "One repository per agent: manifest.yaml, workflow.py, activities, stages, evals, gates/ and a CHANGELOG, made by `wardens new-agent` from the template."
          how: "`ci.yaml` calls homelab-gitops agent-ci.yaml@main on every pull request and main push; pins a `wardens` release (0.5.1, or 0.6.0 since 2026-11-20)."
          api: "`uses: cloudutsukpilot/homelab-gitops/.github/workflows/agent-ci.yaml@main`"
      - id: gh_pw
        label: platform-wardens
        sub: "framework · services"
        icon: git
        status: external
        facts:
          summary: "The `wardens` library, `wardens-services` (router, console, webhooks, ingress), mcp-guard, the agent template and the design docs."
          how: "`pr.yaml` runs one checks job; on main the component workflows build their images, `wardens-py.yaml` releases the wheel and `evals-nightly.yaml` runs every agent's evals."
          api: "Workflows `pr.yaml`, `wardens-py.yaml`, `evals-nightly.yaml`"
      - id: gh_deploy
        label: wardens-deploy
        sub: "registry · config"
        icon: package
        status: external
        facts:
          summary: "The versioned agent registry (`registry/<agent>/<version>/`, never changed once published), the deploy config and the mcp-guard allow lists."
          how: "Written by agent-ci (a commit, or a pull request when an entry raises risk); its CI runs `wardens registry check` and `verify-approval`; Argo CD renders it as ConfigMaps."
          api: "`wardens registry check --deploy .`"
      - id: gh_gitops
        label: homelab-gitops
        sub: "apps/<agent> · agent-ci"
        icon: git
        status: external
        facts:
          summary: "What runs where: `apps/<agent>/values.yaml` (the image digest), the shared `wardens-agent` chart, and the reusable agent-ci.yaml and build-image.yaml."
          how: "A push to main is a deploy: Argo CD tracks it. agent-ci is the only publish path for agent images (ADR 0111)."
          api: "`apps/<agent>/values.yaml` `.wardens-agent.image.digest`"
      - id: gh_iac
        label: IaC repositories
        sub: "infra-azure · infra-*"
        icon: git
        status: external
        facts:
          summary: "The Terragrunt repositories whose drift scans start terraform-drift and where agents open draft PRs."
          how: "The drift App sends signed `workflow_job` deliveries for the scan's Agent Trigger job, and change events (settings, teams, rulesets) the change log records."
          api: "`https://api.github.com/repos/cloudutsukpilot/infra-*`"

  - id: cloudflare
    label: Cloudflare edge
    sub: "Tunnel · Access"
    icon: miscellaneous/cloudflare-18.svg
    status: external
    facts:
      summary: "The only public way in: `hooks.cloudutsuk.com/github` and `/slack/*` for webhooks, and `console.cloudutsuk.com` behind Access."
      how: "TLS ends at the edge; the request goes down the `homelab` tunnel to cloudflared on the host. Access bypasses the hooks paths (the HMAC or Slack signature is the authentication)."
      url: {Webhooks: "https://hooks.cloudutsuk.com/github", Console: "https://console.cloudutsuk.com"}

  - id: slack
    label: Slack
    sub: "#wardens-<cell> channels"
    icon: miscellaneous/slack-18.svg
    status: external
    facts:
      summary: "Team chat: the four cell channels (#wardens-devops, -sre, -dba, -common) where incidents get a thread, people mention @wardens or use /wardens ask, and level 2 actions get an Approve and Deny card."
      how: "Events, interactions and commands go to hooks.cloudutsuk.com/slack/*; posts come only from the chat egress worker, the only holder of the bot token."
      api: "`https://slack.com/api/chat.postMessage`"

  - id: azure
    label: Azure
    sub: "ARM · Resource Graph · Entra"
    icon: cloud
    status: external
    facts:
      summary: "change-correlator reads who changed or deleted a resource from the Activity Log and Resource Graph."
      how: "Its own Entra app with a federated credential for its service account (workload identity), Reader on every subscription."
      api: "`https://management.azure.com`"

  - id: homelab
    label: Homelab
    sub: "k3d clusters on the homelab PC"
    icon: server
    status: built
    facts:
      summary: "The k3d clusters and host services the platform runs on; wardens has its own cluster, CI runs on platform."
      how: "k3d on the Docker bridge `homelab` 172.30.0.0/24 (gpu on 172.31.0.0/24), created by infra-local, apps by Argo CD from homelab-gitops."
      api: "None of its own: each cluster's API"
    children:
      - id: cloudflared
        label: cloudflared
        sub: "host service"
        icon: router
        status: built
        facts:
          summary: "The `homelab` tunnel's connector on the host: brings public requests in without an open port."
          how: "Routes `hooks.cloudutsuk.com` paths `^/github$` and `/slack/{events,interactions,commands}` to `https://172.30.0.6:443`; any other path gets 404 (infra-local host/cloudflared/routes.yaml)."
          where: "homelab host"
          api: "None of its own: the tunnel"

      - id: c_wardens
        label: wardens cluster
        sub: "k3d · 172.30.0.6"
        icon: cluster
        status: built
        facts:
          summary: "The cluster that runs only platform-wardens: entry points, the router, Temporal and its task queues, one worker per agent, MCP and the state store."
          how: "Kyverno admits only digests agent-ci attested and restricted pods; each agent has its own namespace, service account and identity (ADR 0069, 0071, 0111)."
          where: "API 172.30.0.1:6446"
          url: {Console: "https://console.wardens.home.cloudutsuk.com", Temporal UI: "https://temporal.wardens.home.cloudutsuk.com"}
        children:
          - id: w_traefik
            label: Traefik
            sub: "ingress · 172.30.0.6:443"
            icon: balancer
            status: built
            facts:
              summary: "The cluster's ingress: ends TLS for the console, the alert webhook, the GitHub and Slack webhooks and the MCP server."
              how: "k3s's Traefik with cert-manager certificates; only the exact webhook paths are routed for hooks."
              api: "`https://<app>.wardens.home.cloudutsuk.com`"
          - id: w_api
            label: k3s API
            icon: cluster
            status: built
            views: [cicd, scans]
            facts:
              summary: "The cluster's Kubernetes API, which Argo CD applies the agents' manifests to; every pod passes Kyverno's admission webhook."
              how: "k3s API server; Argo CD in `platform` holds its CA and a token in a cluster Secret."
              api: "`https://172.30.0.1:6446`"
          - id: w_kyverno
            label: Kyverno
            sub: "admission · verifyImages"
            icon: shield
            status: built
            views: [cicd, scans]
            facts:
              summary: "Admits an agent pod only if its image is pinned by digest and carries agent-ci's attestation, signed with the agent-ci key; restricted security context, read-only root, limits."
              how: "Policies from homelab-gitops apps/kyverno-policies (`agent-ci.pub`); a refused pod never starts, Argo CD shows the sync as failed."
              api: "Admission webhook on the k3s API"
          - id: w_registry
            label: Registry ConfigMaps
            sub: "wardens-registry-<agent>"
            icon: file
            status: built
            views: [cicd]
            facts:
              summary: "wardens-deploy's registry and config, rendered by Argo CD into each consuming namespace (sync wave -1) and copied to `/etc/wardens/registry` by an init container."
              how: "`WARDENS_REGISTRY_DIR` and `WARDENS_CONFIG_DIR`; read once at start, so a new version comes with the next rollout. The router refuses a risk-raising version without a signed approval record."
              api: "ConfigMaps `wardens-registry-<agent>`, `wardens-config`"
          - id: w_collector
            label: Agent collector
            sub: "monitoring pack"
            icon: chart
            status: built
            views: [observability]
            facts:
              summary: "The node's OpenTelemetry collector: every wardens pod sends OTLP here."
              how: "OTLP gRPC in, forwarded to the gateway on `mon` (ADR 0026). Without an endpoint the framework exports nothing."
              api: "`http://agent-collector.monitoring.svc:4317`"
          - id: w_eso
            label: External Secrets
            icon: key
            status: built
            views: [security]
            facts:
              summary: "Turns OpenBao `kv/wardens/*` entries into the Secrets the pods read: LiteLLM keys, GitHub App keys, the Slack secrets, DB passwords."
              how: "ExternalSecret per app (`secretEnv` in the agent chart), seeded by infra-local host/wardens/configure.sh."
              api: "None of its own: the ExternalSecret CRD"

          - id: ns_entry
            label: wardens-console ns
            sub: "entry points · bus · chat"
            icon: browser
            status: built
            facts:
              summary: "Every way work gets in and every chat post goes out: the console and its approval page, three webhooks, the bus, the ingress consumer and the chat egress."
              how: "One image with different commands (charts/wardens-web plus templates in apps/wardens-console)."
              api: "None of its own: see the children"
            children:
              - id: console
                label: Operator console
                sub: "oauth2-proxy :4180"
                icon: browser
                status: built
                facts:
                  summary: "Opens on a Home tab of agent metrics and recent executions; sends a root task exactly as a trigger does (through the bus), hosts the stack-author chat and installs on a phone as an app."
                  how: "oauth2-proxy sidecar with Keycloak; roles from groups; Home reads the Fleet dashboards' PromQL; machine routes (eval feedback, registry approvals) accept only their own workflow's GitHub OIDC token."
                  url: {Console: "https://console.wardens.home.cloudutsuk.com"}
                  api: "`python -m wardens_services.console.app`"
              - id: approve
                label: Approvals
                sub: "/approvals"
                icon: check
                status: built
                facts:
                  summary: "Lists what waits for a decision: registry entries agent-ci asked for and level 2 actions waiting in their approve-then-act workflow, with those the person may decide first."
                  how: "Signs a registry record with the OpenBao transit key `wardens-approval` and starts wardens-deploy's approvals sync; a level 2 decision becomes the workflow's approval signal. Every decision is audited."
                  api: "`/approvals`, `/approvals/<id>`, `POST /api/registry-approvals`, `GET /api/registry-approvals/decided`"
              - id: alerts
                label: wardens-alerts
                sub: "relay · :8080"
                icon: bell
                status: built
                facts:
                  summary: "Alertmanager's webhook: checks the bearer token, cuts a firing group to its bus form and publishes it."
                  how: "Relay mode since 2026-11-06 (direct is the rollback); answers 202 published, 200 ignored, 503 hub unavailable."
                  url: {Webhook: "https://alerts.wardens.home.cloudutsuk.com/alert"}
                  api: "`python -m wardens_services.webhooks.alerts --mode relay`"
              - id: hooks
                label: wardens-hooks
                sub: "relay · :8080"
                icon: git
                status: built
                facts:
                  summary: "The drift GitHub App's webhook: checks the HMAC, filters by the deploy config's webhooks.yaml and publishes a match; records GitHub change events (decision 0034)."
                  how: "Relay mode; the delivery id is the event id, so a redelivery starts nothing new. A daily CronJob asks GitHub to redeliver failed deliveries of the last 26 hours."
                  url: {Webhook: "https://hooks.cloudutsuk.com/github"}
                  api: "`python -m wardens_services.webhooks.github.receiver --mode relay`"
              - id: slack_relay
                label: wardens-slack
                sub: "relay · :8080"
                icon: message
                status: built
                facts:
                  summary: "Slack's Events API, interactions and the /wardens command: checks Slack's signature and the workspace, drops the app's own posts and publishes the rest to the bus."
                  how: "Team-chat C4, on since 2026-11-19; needs no Temporal, database or HTTPS out. Secret `kv/wardens/slack` `signing_secret`."
                  url: {Events: "https://hooks.cloudutsuk.com/slack/events"}
                  api: "`/slack/events`, `/slack/interactions`, `/slack/commands`"
              - id: eventhubs
                label: Event Hubs emulator
                sub: "+ Azurite · AMQP :5672"
                icon: queue
                status: built
                facts:
                  summary: "The ingress bus: hub `wardens-ingress` (4 partitions) and dead-letter hub `wardens-ingress-dlq` (decision 0030, ADR 0088)."
                  how: "Microsoft's emulator and Azurite in one pod, no volume; Azurite keeps the consumer's checkpoints. Only the relays, the console and the consumer reach it."
                  api: "`amqp://wardens-eventhubs:5672` · checkpoints `:10000`"
              - id: ingress
                label: Ingress consumer
                sub: "wardens-ingress"
                icon: queue
                status: built
                facts:
                  summary: "Reads the hub one event at a time per partition, runs the channel rules and builds the root task, then starts the workflow on the router's queue; chat messages go to the thread workflow."
                  how: "Checkpoints after the handler; refused → dead-letter, Temporal down → wait (backpressure). For chat it checks the person's link and account in Keycloak at use time."
                  api: "`python -m wardens_services.ingress.consumer` · `/healthz`"
              - id: chat_egress
                label: Chat egress
                sub: "worker · bot token"
                icon: message
                status: built
                facts:
                  summary: "The only holder of the Slack bot token: posts incident threads, answers, follow-ups and level 2 approval cards to the cell channels, one claim per key so nothing posts twice."
                  how: "A Temporal worker on queue `wardens-chat-egress` (team-chat C2, C3); its daily membership CronJob compares each cell channel with the account links and Keycloak groups and audits differences."
                  api: "Temporal queue `wardens-chat-egress`"

          - id: router
            label: wardens-router
            sub: "ns wardens-router · 2 workers"
            icon: router
            status: built
            facts:
              summary: "The only host of the incident and approve-then-act workflows: every entry point starts incidents here; it routes by capability and starts each agent's task as a child on its queue."
              how: "Two workers poll `wardens-router` with a PodDisruptionBudget (ADR 0104); the classifier (`wardens.route`) only for chat Auto and alerts no rule knows; reads every agent's registry entries."
              api: "`python -m wardens_services.router.worker run`"

          - id: ns_temporal
            label: Temporal
            sub: "ns temporal · wardens-db"
            icon: clock
            status: built
            facts:
              summary: "Durable execution: every incident, agent run, conversation and chat thread is a workflow here, and each worker pulls its work from its own task queue."
              how: "Temporal 1.32 (chart 1.7.0) on Postgres `wardens-db`, Temporal namespace `wardens` with 30 days of retention."
              url: {Temporal UI: "https://temporal.wardens.home.cloudutsuk.com"}
            children:
              - id: temporal
                label: Temporal frontend
                sub: ":7233 · history"
                icon: clock
                status: built
                facts:
                  summary: "The gRPC front door: workflow history, timers, signals and queries; starts and signals land here before the matching service queues the task."
                  how: "Reachable only from namespaces labelled `homelab/wardens-agent=true`; 64 history shards, fixed."
                  api: "`temporal-frontend.temporal.svc:7233`"
              - id: queues
                label: Task queues
                sub: "one per worker"
                icon: queue
                status: built
                facts:
                  summary: "Temporal's matching service holds one task queue per worker: workflow and activity tasks wait here until a worker long-polls for them, so nothing is lost while a worker is down."
                  how: "An agent's queue is its name (charts/wardens-agent `temporal.taskQueue` default). Pollers and backlog show in the Temporal UI (Task Queues) and in Mimir as `pending_polls{taskqueue=…}`."
                  api: "Served through `temporal-frontend:7233`"
                children:
                  - id: q_router
                    label: wardens-router
                    sub: "incidents · routing"
                    icon: queue
                    status: built
                    facts:
                      summary: "The incident workflow `wardens.incident`, the classifier `wardens.route`, chat threads and one `wardens.approve_act` per level 2 action; every entry point starts work here."
                      how: "Polled by the router's two workers; SLO 99% of tasks start within 5 s (alerts/wardens/wardens-router.yaml). Never rename it: open incidents would be stranded."
                      api: "`WARDENS_ROUTER_QUEUE=wardens-router`"
                  - id: q_drift
                    label: terraform-drift
                    sub: "child · chat ask"
                    icon: queue
                    status: built
                    facts:
                      summary: "terraform-drift's task workflows (children of an incident) and their activities, plus its chat `ask` turns."
                      how: "One worker polls both the workflow and the activity side; activities retry on any worker."
                      api: "`TASK_QUEUE=terraform-drift`"
                  - id: q_cc
                    label: change-correlator
                    sub: "handoffs"
                    icon: queue
                    status: built
                    facts:
                      summary: "change.correlate tasks: handoffs from terraform-drift's incidents."
                      how: "Deterministic agent, no model on the path; the handoff's hop budget is 1."
                      api: "`TASK_QUEUE=change-correlator`"
                  - id: q_author
                    label: stack-author
                    sub: "conversations"
                    icon: queue
                    status: built
                    facts:
                      summary: "One conversation workflow per Author-tab chat; each message arrives as a signal, the page polls a view query."
                      how: "Closed after 30 idle minutes; messages wait in order in the workflow."
                      api: "`TASK_QUEUE=stack-author`"
                  - id: q_triage
                    label: incident-triage
                    sub: "alert.triage"
                    icon: queue
                    status: built
                    facts:
                      summary: "Alerts a routing rule sends to SRE's triage agent."
                      how: "Only the test alert `WardensRoutingTest` routes here so far (rule `routing-test`)."
                      api: "`TASK_QUEUE=incident-triage`"
                  - id: q_egress
                    label: wardens-chat-egress
                    sub: "Slack posts"
                    icon: queue
                    status: built
                    facts:
                      summary: "Every post to Slack: incident threads, chat answers, follow-ups; a slow or limited Slack only makes the queue longer."
                      how: "Polled by the chat egress worker; keep equal to `wardens.config.CHAT_EGRESS_QUEUE`."
                      api: "`wardens-chat-egress`"
                  - id: q_cur
                    label: cluster-upgrade-readiness
                    sub: "assessments"
                    icon: queue
                    status: built
                    facts:
                      summary: "The weekly schedule's and the console's requests for cluster-upgrade-readiness's worker."
                      how: "Polled by its worker since 0.3.0 was deployed (its registry entry approved, then its homelab-gitops app)."
                      api: "`TASK_QUEUE=cluster-upgrade-readiness`"
              - id: wardens_db
                label: wardens-db
                sub: "Postgres 17"
                icon: databases/postgresql-18.svg
                status: built
                facts:
                  summary: "Temporal's own databases `temporal` and `temporal_visibility`, kept apart so Temporal can be reset alone."
                  how: "Postgres 17, data on `/srv/homelab/pg/wardens-db` (ADR 0070)."
                  api: "`wardens-db.wardens-db.svc:5432`"

          - id: ns_agents
            label: Agent workers
            sub: "one namespace each"
            icon: users
            status: built
            facts:
              summary: "One Temporal worker per agent, from its own repository's image and the shared chart charts/wardens-agent (ADR 0072); all six are deployed, five in shadow (cicd-triage, not drawn, is in build)."
              how: "No ingress: a worker only polls its queue. Egress to Temporal, DNS, OTLP, the state DB and HTTPS; registry and config from wardens-deploy."
              api: "None of its own: Temporal task queues"
            children:
              - id: drift
                label: terraform-drift
                sub: "0.3.4 · shadow · L2 on dev"
                icon: git
                status: built
                facts:
                  summary: "Explains drift and opens a draft PR or recommends a revert; on development stacks it merges the PR or runs the revert's apply after a Slack approval (decision 0047)."
                  how: "Started when a drift scan finds resource drift (webhook rule drift-scan), under the incident workflow. No schedule (decision 0032)."
                  where: "ns terraform-drift"
                  api: "Temporal queue `terraform-drift`"
                children:
                  - id: td_wf
                    label: workflow.py
                    sub: "via wardens.durable"
                    icon: code
                    status: built
                    facts:
                      summary: "Decides what happens next: kill switch, scope, scan run, stacks, analyse, emit, draft PR."
                      how: "Deterministic Temporal workflow code: no I/O, clocks or LLM calls; every effect is an activity through the Activities protocol."
                      api: "`run(task, acts)`"
                  - id: td_acts
                    label: activities.py
                    icon: function
                    status: built
                    facts:
                      summary: "Does all the I/O: GitHub reads, plan analysis, emitting artifacts, the draft PR, plus the framework's record and notify activities."
                      how: "Polls the queue for activity tasks; reads retry, acts run once unless idempotent (`open_draft_pr` is)."
                      api: "`DriftActivities`"
                  - id: td_llm
                    label: LLM stages
                    sub: "Pydantic AI · GuardedToolset"
                    icon: cpu
                    status: built
                    facts:
                      summary: "Classify and recommend: the model writes only the classification and rationale; deterministic code decides the action."
                      how: "Validated output, usage limits from prices.yaml, read tools only through GuardedToolset (guardrail point 2), fallback to `unknown`."
                      api: "`stages/classify.py`, `stages/recommend.py`"
                  - id: td_guard
                    label: Guardrails
                    sub: "point 4 · kill switch"
                    icon: shield
                    status: built
                    facts:
                      summary: "`check_action` on every proposed action and the kill switch before the run, each stack and each act, applied by the binding (how-docs: guardrails)."
                      how: "Pure checks against the manifest and ownership map; the switch is the ConfigMap or the DB row, and fails closed."
                      api: "`wardens.guardrails.check_action`, `is_engaged`"
              - id: correlator
                label: change-correlator
                sub: "0.3.1 · shadow · L0"
                icon: search
                status: built
                facts:
                  summary: "Answers who changed or deleted an Azure or GitHub resource, when, with which client and which Jira ticket covers it, when terraform-drift hands off `change.correlate`."
                  how: "Azure: Activity Log and Resource Graph with its own Entra identity. GitHub: the events feed and the recorded change log (decision 0034). Jira: rule candidates a model ranks (0036). AWS CloudTrail is built, not live."
                  where: "ns change-correlator"
                  api: "Temporal queue `change-correlator`"
              - id: author
                label: stack-author
                sub: "0.2.1 · shadow · L1"
                icon: message
                status: built
                facts:
                  summary: "A chat in the console's Author tab: shows the exact resources.yaml diff and opens a draft PR when the person presses the button."
                  how: "One workflow per conversation (message signal, view query), closed after 30 idle minutes; local model through LiteLLM; targets refreshed weekly by its own workflow."
                  where: "ns stack-author"
                  api: "Temporal queue `stack-author`"
              - id: triage
                label: incident-triage
                sub: "0.2.0 · shadow · L0"
                icon: bell
                status: built
                facts:
                  summary: "Records an alert a routing rule sends it as a finding and tells the SRE cell; no tools, model or identity."
                  how: "The first agent in its own repository (repo-per-agent phase 7)."
                  where: "ns incident-triage"
                  api: "Temporal queue `incident-triage`"
              - id: cur
                label: cluster-upgrade-readiness
                sub: "0.3.0 · shadow · L1"
                icon: cluster
                status: built
                facts:
                  summary: "What blocks the next Kubernetes upgrade, and an ordered upgrade plan. Its worker reads the wardens cluster with its own 15-minute token."
                  how: "Reads the cluster's versions, deprecated APIs and add-ons through the k3s API; deterministic checks, no model. The same code runs as a local CLI."
                  where: "ns cluster-upgrade-readiness"
                  api: "Temporal queue `cluster-upgrade-readiness`"

          - id: ns_mcp
            label: mcp-web-search
            sub: "ns mcp-web-search"
            icon: search
            status: built
            facts:
              summary: "Web search as an MCP server for the agents, reachable only through LiteLLM (decision 0031, ADR 0091)."
              how: "mcp-guard in front of mcp-searxng and its own SearXNG, on the pod's loopback; allow lists from wardens-deploy `mcp/`."
              url: {MCP: "https://mcp-web-search.wardens.home.cloudutsuk.com/mcp"}
            children:
              - id: mcp_guard
                label: mcp-guard
                sub: ":8080"
                icon: shield
                status: built
                facts:
                  summary: "Lets an MCP call through only for an allowed agent and tool, with a run id and trace."
                  how: "Verifies LiteLLM's signed token against its JWKS, takes the agent from `act.sub`, checks the allow list and `scope`, filters tools/list."
                  api: "`mcp-web-search.mcp-web-search.svc:8080`"
              - id: searxng
                label: mcp-searxng
                sub: "2.7.0 · loopback :3000"
                icon: search
                status: built
                facts:
                  summary: "The reviewed MCP server that searches through the pod's own SearXNG."
                  how: "`MCP_HTTP_HARDEN`, a static token from mcp-guard; private URLs refused by `web_url_read`."
                  api: "`http://127.0.0.1:3000/mcp`"

          - id: state_db
            label: wardens-state-db
            sub: "Postgres 17 · schema wardens"
            icon: databases/postgresql-18.svg
            status: built
            facts:
              summary: "The agents' own state: run records, artifacts, dedupe claims, kill switches, the audit chain, memory, chat links and threads, people's verdicts on runs."
              how: "One role per writer (`wardens_agent`, `wardens_console`, `wardens_ingress`, `wardens_eval` read-only, `wardens_owner` for migrations); daily retention and audit anchor jobs."
              api: "`wardens-state-db.wardens-state-db.svc:5432/wardens`"

      - id: c_ai
        label: ai cluster
        sub: "k3d · 172.30.0.4"
        icon: cluster
        status: built
        facts:
          summary: "The model gateway and the AI data services."
          how: "k3d cluster, Traefik with Let's Encrypt certificates."
          api: "None of its own: see LiteLLM"
        children:
          - id: litellm
            label: LiteLLM gateway
            sub: "/v1 · /mcp"
            icon: api
            status: built
            facts:
              summary: "The only way agents, the router and the nightly evals reach models and MCP servers (decision 0018, 0031): OpenAI-compatible `/v1` and MCP `/mcp`."
              how: "Virtual key per agent (a model key and an MCP-only key), its own key for the eval runs; for MCP it signs a short-lived token for the server."
              url: {Gateway: "https://llm.ai.home.cloudutsuk.com"}
              api: "`https://llm.ai.home.cloudutsuk.com/v1`"

      - id: c_gpu
        label: gpu cluster
        sub: "k3d · DGX Spark"
        icon: cluster
        status: built
        facts:
          summary: "The model host: vLLM servers on the GPU."
          how: "k3d cluster on `homelab-gpu` 172.31.0.0/24, KEDA scales the models."
          api: "None of its own: see vLLM"
        children:
          - id: vllm
            label: vllm-chat
            sub: "qwen3.6-35b-a3b"
            icon: cpu
            status: built
            facts:
              summary: "The local chat model the agents and the router use (`WARDENS_LLM_MODEL: qwen3.6-35b-a3b`)."
              how: "vLLM's OpenAI-compatible server; LiteLLM calls it, never an agent."
              api: "`https://vllm-chat.gpu.home.cloudutsuk.com/v1`"

      - id: c_core
        label: core cluster
        sub: "k3d · identity, secrets, registry"
        icon: cluster
        status: built
        facts:
          summary: "Identity, secrets, signing keys and the image registry for every cluster."
          how: "k3d cluster with Keycloak, OpenBao and Zot."
          api: "None of its own: see the children"
        children:
          - id: keycloak
            label: Keycloak
            sub: "realm homelab"
            icon: key
            status: built
            facts:
              summary: "Signs people in to the console, the approval page and the Temporal UI; its groups give console roles, cell membership and reviewer rights."
              how: "OIDC issuer `https://auth.cloudutsuk.com/realms/homelab`; groups `wardens-<cell>-viewers`, `-editors`, `-reviewers`; the chat directory client reads accounts."
              url: {Issuer: "https://auth.cloudutsuk.com/realms/homelab"}
          - id: openbao
            label: OpenBao
            sub: "kv · transit keys"
            icon: lock
            status: built
            facts:
              summary: "The only place secrets live (`kv/wardens/*`), and the signing keys that never leave it: transit `cosign` and `agent-ci` for CI, `wardens-approval` for the console."
              how: "Kubernetes and GitHub OIDC auth: role agent-ci is bound to agent-ci.yaml at refs/heads/main and warden-* repositories; role pr can only pull."
              url: {OpenBao: "https://bao.core.home.cloudutsuk.com"}
          - id: zot
            label: Zot registry
            icon: package
            status: built
            views: [cicd, scans]
            facts:
              summary: "Holds the agent images, the wardens-py wheel image and their signatures, SBOM and agent-ci attestations; pods pull by digest."
              how: "OCI registry; CI pushes with role agent-ci or main, kubelets pull with the read-only puller; release tags never move (ADR 0105, 0109)."
              url: {Registry: "https://registry.core.home.cloudutsuk.com"}

      - id: c_platform
        label: platform cluster
        sub: "k3d · 172.30.0.2 · CI"
        icon: cluster
        status: built
        views: [cicd, scans, state, observability]
        facts:
          summary: "Where the whole life cycle runs: the ARC runners for every repository's CI, BuildKit, Argo CD and Dependency-Track."
          how: "k3d cluster; ten self-hosted `homelab` runners shared by every repository; Argo CD manages every cluster from homelab-gitops `main`."
          api: "None of its own: see the children"
        children:
          - id: arc
            label: agent-ci on ARC
            sub: "runs-on homelab"
            icon: terminal
            status: built
            views: [cicd, scans]
            facts:
              summary: "homelab-gitops agent-ci.yaml, called by each agent repository: six jobs, split so that no agent code runs in a job that can ask for an OIDC token (ADR 0111)."
              how: "Pull request: wheel, test, gates and image (build and scan, nothing pushed). Main: also push, sign, attest, promote and registry."
              api: "`agent-ci.yaml` jobs wheel · test · gates · image · promote · registry"
            children:
              - id: ci_wheel
                label: wheel
                sub: "verify wardens-py"
                icon: package
                status: built
                views: [cicd, scans]
                facts:
                  summary: "Reads the wardens-py digest the Dockerfile pins, verifies its Cosign signature with the platform key and copies the wheel out."
                  how: "OpenBao role pr (Zot pull only); checks pyproject.toml pins the same version; hands the wheel on through the Actions cache under its SHA-256."
                  api: "`.github/actions/wardens-wheel`"
              - id: ci_test
                label: test
                sub: "no id-token"
                icon: check
                status: built
                views: [cicd]
                facts:
                  summary: "The agent's own code: uv sync --frozen, ruff, `wardens check-agent`, unit tests, replay tests on recorded histories, and the deterministic eval gate."
                  how: "`wardens eval run --gate` with the test model, then the recorded model; live-model evals run nightly, not here."
                  api: "`wardens check-agent .` · `wardens eval run --gate`"
              - id: ci_gates
                label: gates
                sub: "source scans"
                icon: shield
                status: built
                views: [cicd, scans]
                facts:
                  summary: "The source security gates of ADR 0032 on the checkout: Gitleaks, Semgrep, Bandit, Trivy (dependencies, IaC), Checkov, Conftest and Hadolint."
                  how: "No id-token (Checkov can load the repository's own Python checks). Each runs even after a failure, so one run shows every finding; a blocking finding fails the job."
                  api: "`.github/actions/image-gates`"
              - id: ci_image
                label: image
                sub: "build · scan · sign"
                icon: container
                status: built
                views: [cicd, scans]
                facts:
                  summary: "Builds the image on BuildKit from the verified wheel, scans it with Trivy, makes a CycloneDX SBOM with Syft; on main pushes it, signs and attests the SBOMs and writes the agent-ci attestation."
                  how: "OpenBao role agent-ci on main (transit keys cosign and agent-ci), role pr on a pull request (build and scan only). SBOMs go to Dependency-Track."
                  api: "`cosign attest --type https://cloudutsuk.com/attestations/agent-ci/v1`"
              - id: ci_promote
                label: promote
                sub: "main only"
                icon: rocket
                status: built
                views: [cicd]
                facts:
                  summary: "Commits the new digest to `homelab-gitops/apps/<agent>/values.yaml` through the writer App."
                  how: "Role agent-ci; a push to homelab-gitops main is the deploy."
                  api: "`.github/actions/gitops-commit`"
              - id: ci_registry
                label: registry
                sub: "main only"
                icon: file
                status: built
                views: [cicd]
                facts:
                  summary: "Publishes the agent's registry entry to wardens-deploy: a commit, or a pull request when the entry raises risk (decision 0040 rule 5, 0042)."
                  how: "`wardens registry publish` with the wardens that wardens-deploy pins, reading the checkout as data; on since 2026-11-19."
                  api: "`.github/actions/wardens-registry-publish`"
          - id: ci_platform
            label: Platform workflows
            sub: "release · evals · deploy CI"
            icon: terminal
            status: built
            views: [cicd, state, observability]
            facts:
              summary: "The other life-cycle workflows on the same runners: the framework release, the nightly evals, wardens-deploy's registry checks and its approvals sync."
              how: "platform-wardens `wardens-py.yaml` and `evals-nightly.yaml`; wardens-deploy `ci.yaml` and `approvals-sync.yaml`."
              api: "None of its own: see the children"
            children:
              - id: ci_release
                label: wardens-py release
                sub: "wheel · tag · bump"
                icon: rocket
                status: built
                views: [cicd]
                facts:
                  summary: "A release PR's merge builds the wheel image through build-image.yaml (gates, signed), tags `wardens-v<version>` and makes the GitHub release; then one bump PR per agent repository."
                  how: "`wardens release check` on every change (contracts, CHANGELOG, check-agent rules). The bump job runs as the bump App once `WARDENS_BUMP_ENABLED` is true; until then the owner runs `wardens bump`."
                  api: "`.github/workflows/wardens-py.yaml`"
              - id: ci_nightly
                label: evals-nightly
                sub: "02:17 UTC · live"
                icon: chart
                status: built
                views: [cicd, state, observability]
                facts:
                  summary: "Every registered agent's eval set through its real workflow with the live model, scored with people's verdicts from production; the gate and the eval gauges go to Mimir."
                  how: "Lists wardens-deploy registry/, checks out each warden-<agent> main with the wheel it pins; feedback from the console's read-only endpoint with a GitHub OIDC token (ADR 0113)."
                  api: "`wardens eval run . --gate --export-metrics`"
              - id: ci_deploy
                label: wardens-deploy CI
                sub: "registry check"
                icon: check
                status: built
                views: [cicd]
                facts:
                  summary: "Checks every registry entry, the consumer-driven contracts of every handoff, the config, `mcp/` and the routing cases, then that each risk-raising version carries a valid signed approval."
                  how: "`wardens registry check` and `wardens registry verify-approval registry/ --keys keys/wardens-approval.pub`, with the wardens that `tools/` pins."
                  api: "wardens-deploy `.github/workflows/ci.yaml`"
              - id: ci_sync
                label: approvals-sync
                sub: "on approval · every 5 min"
                icon: check
                status: built
                views: [cicd]
                facts:
                  summary: "Commits each approved registry record next to its entry and merges the entry's pull request, so the reviewer's press is the last manual step (decisions 0048, 0049)."
                  how: "Reads the decided requests from the console with its own OIDC token, runs registry check and verify-approval on the result; a record that doesn't verify isn't committed. Started by the console, cron as fallback."
                  api: "wardens-deploy `.github/workflows/approvals-sync.yaml`"
          - id: scanners
            label: Security scanners
            sub: "security-tools"
            icon: shield
            status: built
            views: [scans]
            facts:
              summary: "The scanners the gates and image jobs run on the runner; findings go to the job summary and the reports artifact."
              how: "Installed by `.github/actions/security-tools`; exceptions live in each repository (.gitleaksignore, nosemgrep, nosec, .trivyignore, .checkov.yaml, .hadolint.yaml)."
              api: "None of its own: see the children"
            children:
              - id: sc_gitleaks
                label: Gitleaks
                sub: "secrets · full history"
                icon: key
                status: built
                views: [scans]
                facts:
                  summary: "Any secret in the built commit's whole history blocks the build."
                  how: "`gitleaks git --log-opts HEAD`: only the built commit's history, so an open branch's fake test secret can't fail main."
                  api: "`gitleaks git --redact`"
              - id: sc_semgrep
                label: Semgrep · Bandit
                sub: "SAST"
                icon: search
                status: built
                views: [scans]
                facts:
                  summary: "Static analysis of the agent's code: Semgrep's rules and Bandit for Python."
                  how: "Findings are blocking; an accepted one is marked `# nosemgrep` or `# nosec` with the reason."
                  api: "`semgrep scan` · `bandit -r`"
              - id: sc_trivy_src
                label: Trivy (source)
                sub: "deps · IaC · Dockerfile"
                icon: shield
                status: built
                views: [scans]
                facts:
                  summary: "Vulnerable dependencies in uv.lock and misconfigurations in Dockerfiles and IaC."
                  how: "`trivy fs` and `trivy config`; ignores only through .trivyignore."
                  api: "`trivy fs` · `trivy config`"
              - id: sc_policy
                label: Checkov · Conftest
                sub: "+ Hadolint · IaC · policy"
                icon: file
                status: built
                views: [scans]
                facts:
                  summary: "Checkov on IaC, Dockerfiles and workflows; Conftest with homelab-gitops policies/conftest; Hadolint on the Dockerfile."
                  how: "Checkov's default skips only CKV_DOCKER_2 (HEALTHCHECK), replaced by the repository's .checkov.yaml."
                  api: "`checkov` · `conftest test` · `hadolint`"
              - id: sc_trivy_img
                label: Trivy (image) · Syft
                sub: "CVEs · licences · SBOM"
                icon: container
                status: built
                views: [scans]
                facts:
                  summary: "Each platform's built image: vulnerabilities and licences with Trivy, and a CycloneDX SBOM with Syft."
                  how: "Run on the exported OCI directory before anything is pushed, so a blocked image never reaches Zot."
                  api: "`trivy image --input` · `syft scan oci-dir:`"
              - id: sc_cosign
                label: Cosign
                sub: "sign · attest"
                icon: cert
                status: built
                views: [scans, cicd]
                facts:
                  summary: "Signs the image, attests the SBOMs (transit key cosign) and writes the agent-ci attestation (transit key agent-ci) on the index and each platform image."
                  how: "Keys stay in OpenBao (`hashivault://agent-ci`); no transparency log upload. Kyverno verifies with `agent-ci.pub`."
                  api: "`cosign attest --key hashivault://agent-ci`"
          - id: buildkit
            label: BuildKit
            sub: ":1234"
            icon: container
            status: built
            views: [cicd, scans]
            facts:
              summary: "Builds the agent and platform images; the Dockerfile's RUN steps run here, not on the runner."
              how: "Rootless buildkitd (and an amd64 one on the homelab PC for multi-arch builds); the runner drives it with buildx over TCP 1234."
              api: "`tcp://buildkit.buildkit.svc:1234`"
          - id: deptrack
            label: Dependency-Track
            sub: "SBOMs"
            icon: chart
            status: built
            views: [scans]
            facts:
              summary: "Keeps every image's SBOM (project platform/<image>, a child per platform) and watches it against new vulnerabilities after the build."
              how: "Uploaded by the image job with the ci-upload team's key from `kv/ci/dependency-track`; never fails the build (ADR 0099)."
              api: "`/api/v1/bom`"
          - id: argocd
            label: Argo CD
            icon: devops/cicd/argocd-18.svg
            status: built
            views: [cicd]
            facts:
              summary: "Deploys `apps/<agent>` from homelab-gitops, with wardens-deploy's chart as a second source for the registry and config ConfigMaps."
              how: "Tracks homelab-gitops `main`; reads wardens-deploy with its own read-only deploy key; the `wardens` AppProject may deploy only to the wardens cluster."
              api: "None of its own: Applications in homelab-gitops clusters/wardens"

      - id: c_mon
        label: mon cluster
        sub: "k3d · 172.30.0.3"
        icon: cluster
        status: built
        facts:
          summary: "Grafana, Mimir, Loki and Tempo: every cluster sends telemetry here, and Mimir's Alertmanager sends alerts out (router SLO, queue backlog, eval alerts)."
          how: "k3d cluster; dashboards and alert rules are provisioned from homelab-gitops."
          url: {Grafana: "https://grafana.mon.home.cloudutsuk.com"}
        children:
          - id: alertmanager
            label: Alertmanager
            sub: "Mimir"
            icon: bell
            status: built
            facts:
              summary: "Sends each notification group to Slack and, with `continue: true`, to wardens-alerts."
              how: "Mimir's Alertmanager; bearer token for the wardens receiver; group_wait about 30 s."
              api: "`/alertmanager/api/v2/alerts`"
          - id: mon_gw
            label: OTLP gateway
            sub: "Tempo · Mimir · Loki"
            icon: chart
            status: built
            views: [observability]
            facts:
              summary: "Receives spans and metrics from every collector: one trace per incident in Tempo, run, queue and eval metrics in Mimir."
              how: "OTel gateway on mon; the Grafana dashboards and the eval alerts (WardensEvalSafetyFailure, BelowThreshold, Regression, Stale) are provisioned from homelab-gitops."
              url: {Grafana: "https://grafana.mon.home.cloudutsuk.com"}

edges:
  # --- entry: the console ---
  - {id: eng_tr, from: engineer, to: w_traefik, proto: HTTPS, port: 443, label: console,
     why: "Used when the engineer opens the console on the tailnet: to send a task or chat with stack-author.", certs: le-home,
     detail: "From outside the tailnet the same console is at console.cloudutsuk.com through Cloudflare Access and the tunnel."}
  - {id: tr_console, from: w_traefik, to: console, proto: HTTP, port: 4180,
     why: "Always on behind Traefik: oauth2-proxy checks the Keycloak session, then hands the request to the console on 127.0.0.1.",
     certs: {none: "Plain HTTP inside the cluster; TLS ended at Traefik."}}
  - {id: console_kc, from: console, to: keycloak, proto: OIDC, port: 443, view: security,
     why: "Used at sign-in: oauth2-proxy redeems the code and reads the person's groups, which give the console role.", certs: cf-edge}
  - {id: eng_kc, from: engineer, to: keycloak, proto: OIDC, port: 443, view: security,
     why: "Used at sign-in: the browser is sent to Keycloak, the person signs in, and comes back with a code.", certs: cf-edge}
  - {id: console_eh, from: console, to: eventhubs, proto: AMQP, port: 5672, label: send,
     why: "Used when a person presses Send: the console publishes the request to the bus like any other entry point (relay mode, ADR 0102).",
     certs: {none: "Plain AMQP inside the cluster; the NetworkPolicy keeps the bus private."}}
  - {id: console_qa, from: console, to: q_author, proto: gRPC, port: 7233, label: conversation,
     why: "Used in the Author tab: starts the conversation workflow, signals each message and queries the view.",
     certs: {none: "Plain gRPC inside the cluster; a NetworkPolicy admits only labelled namespaces."}}

  # --- entry: alerts, GitHub and Slack through the bus ---
  - {id: am_tr, from: alertmanager, to: w_traefik, proto: HTTPS, port: 443, label: /alert,
     why: "Used for every notification group (route has continue: true), so Slack still gets every alert.", certs: le-home,
     detail: "Bearer token, checked before the body is parsed."}
  - {id: tr_alerts, from: w_traefik, to: alerts, proto: HTTP, port: 8080,
     why: "Always on: Traefik forwards /alert to the relay.", certs: {none: "Plain HTTP inside the cluster; TLS ended at Traefik."}}
  - {id: gh_cf, from: gh_iac, to: cloudflare, proto: Webhook, port: 443, tls: true, label: workflow_job,
