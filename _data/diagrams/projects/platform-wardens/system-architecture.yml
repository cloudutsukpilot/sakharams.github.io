     why: "Every night: lists registry/ to know which agents to evaluate.", certs: github-pub}
  - {id: nightly_agents, from: ci_nightly, to: gh_agents, proto: HTTPS, port: 443, view: cicd, label: checkout,
     why: "Every night: checks out each warden-<agent> main with REPO_READ_TOKEN.", certs: github-pub}
  - {id: nightly_lite, from: ci_nightly, to: litellm, proto: HTTPS, port: 443, view: cicd, label: live model,
     why: "Every night: the eval cases through the agent's real workflow on the live model, with the evals' own virtual key and budget.", certs: le-home}
  - {id: nightly_tr, from: ci_nightly, to: w_traefik, proto: HTTPS, port: 443, view: [cicd, state], label: feedback,
     why: "Every night: GET /api/evals/feedback with a GitHub OIDC token (audience wardens-console-evals); people's verdicts block promotion.", certs: le-home}
  - {id: feedback_db, from: console, to: state_db, proto: PostgreSQL, port: 5432, view: cicd, label: verdicts,
     why: "Used for the nightly read: verdicts as the read-only role wardens_eval (run id, stage, verdict, state, case id only).", certs: {none: "Plain TCP inside the cluster."}}

  # --- security scans: the scanners the jobs run ---
  - {id: gates_gl, from: ci_gates, to: sc_gitleaks, proto: in-process, kind: control, view: scans, label: secrets,
     why: "Every run: Gitleaks on the built commit's history; any secret blocks.", certs: {none: "Runs on the runner."}}
  - {id: gates_sast, from: ci_gates, to: sc_semgrep, proto: in-process, kind: control, view: scans, label: SAST,
     why: "Every run: Semgrep and Bandit on the agent's code.", certs: {none: "Runs on the runner."}}
  - {id: gates_trivy, from: ci_gates, to: sc_trivy_src, proto: in-process, kind: control, view: scans, label: deps · IaC,
     why: "Every run: Trivy on uv.lock, Dockerfiles and IaC.", certs: {none: "Runs on the runner."}}
  - {id: gates_policy, from: ci_gates, to: sc_policy, proto: in-process, kind: control, view: scans, label: policy,
     why: "Every run: Checkov, Conftest with the platform's policies, Hadolint.", certs: {none: "Runs on the runner."}}
  - {id: image_trivy, from: ci_image, to: sc_trivy_img, proto: in-process, kind: control, view: scans, label: scan image,
     why: "Every run, before any push: Trivy for CVEs and licences, Syft for the SBOM, per platform.", certs: {none: "Runs on the runner, on the exported OCI directory."}}
  - {id: image_cosign, from: ci_image, to: sc_cosign, proto: in-process, kind: control, view: scans, label: sign · attest,
     why: "On main only: signs the image, attests the SBOMs and writes the agent-ci attestation.", certs: {none: "Runs on the runner; the keys stay in OpenBao."}}
  - {id: wheel_cosign, from: ci_wheel, to: sc_cosign, proto: in-process, kind: control, view: scans, label: verify,
     why: "Every run: cosign verify on the wardens-py image with the platform key.", certs: {none: "Runs on the runner."}}

scenarios:
  - id: drift-handoff
    title: Drift with a handoff
    summary: "A drift scan that found drift: the router runs the incident, terraform-drift analyses on its own queue, hands off to change-correlator's queue, and one thread goes to the DevOps channel."
    steps:
      - {title: Incident starts, action: "Ingress consumer → wardens-router queue: wardens.incident starts", path: [ing_q],
         text: "The scan's Agent Trigger job came through the bus as in the bus use case; the workflow id comes from the delivery, so a repeat starts nothing."}
      - {title: Router takes it, action: "wardens-router polls its queue and routes terraform.drift.explain", path: [~router_q],
         text: "The router reads the registry from wardens-deploy and picks the agent by capability; stage shadow and not quarantined means routable."}
      - {title: Child on drift's queue, action: "wardens-router → terraform-drift queue: the child task", path: [router_qd],
         text: "The child waits on terraform-drift's own queue until the worker polls; a busy or restarting worker only delays it."}
      - {title: Worker picks it up, action: "terraform-drift queue → workflow.py → activities.py", path: [~td_wf_q, td_wf_q, ~td_acts_q],
         text: "The workflow only decides; each activity task waits on the same queue for the activity poller, so a crash resumes at the next one.",
         detail: "- Workflow tasks: `workflow.py` replays history and returns commands.\n- Activity tasks: `activities.py` does the I/O; Temporal records each result.\n- Both poll the same queue, `terraform-drift`, through `temporal-frontend:7233`.\n- Backlog shows as `pending_polls{taskqueue=\"terraform_drift\"}` in Mimir."}
      - {title: Read the plan, action: "activities.py ↔ IaC repository: drift-scan run and plan artifacts", path: [td_gh, ~td_gh],
         text: "GitHub App read token; plan JSON is redacted before any model sees it."}
      - {title: Classify the drift, action: "LLM stage ↔ LiteLLM ↔ vLLM: classify each attribute", path: [td_acts_llm, td_llm_lite, lite_vllm, ~lite_vllm, ~td_llm_lite, ~td_acts_llm],
         text: "Validated output; on any failure every attribute is unknown, which becomes investigate."}
      - {title: Guardrail and draft PR, action: "activities.py ↔ guardrails, then ↔ IaC repository: draft PR", path: [td_acts_guard, ~td_acts_guard, td_gh, ~td_gh],
         text: "check_action passes the level 1 action and the kill switch is checked again; the tool never opens a second PR."}
      - {title: Hand off, action: "wardens-router → change-correlator queue → change-correlator", path: [router_qcc, ~cc_q],
         text: "The finding suggests change.correlate; wardens.handoff starts it as a child on change-correlator's queue (hop budget 1)."}
      - {title: Who changed it, action: "change-correlator ↔ Azure: Activity Log and Resource Graph", path: [cc_az, ~cc_az],
         text: "Workload identity; the answer is a finding attached to the incident by reference."}
      - {title: One thread, action: "wardens-router → egress queue → chat egress → #wardens-devops", path: [router_qe, ~egress_q, egress_slack, ~egress_slack],
         text: "Every run wrote its run record; the incident posts one thread with the drift and who changed it.",
         result: success, outcome: "Draft PR and one Slack thread"}

  - id: bus
    title: Alert or GitHub event via the bus
    summary: "A webhook relays to the Event Hubs emulator; the consumer starts the incident on the router's queue with an id from the event (how-docs: ingress, routing)."
    modes: [{id: alert, label: Alertmanager alert}, {id: github, label: GitHub drift scan}]
    steps:
      - {title: Alert fires, action: "Alertmanager → Traefik → wardens-alerts: POST /alert (443)", when: alert, path: [am_tr, tr_alerts],
         text: "Bearer token checked before the body is parsed; only allowlisted labels are read, never annotations."}
      - {title: Publish the group, action: "wardens-alerts → Event Hubs: one CloudEvent (AMQP 5672)", when: alert, path: [alerts_eh, ~alerts_eh, ~tr_alerts, ~am_tr],
         text: "The hub accepts it, the relay answers 202; a 503 makes Alertmanager retry."}
      - {title: Drift scan done, action: "IaC repo → Cloudflare → cloudflared → Traefik → wardens-hooks", when: github, path: [gh_cf, cf_cfd, cfd_tr, tr_hooks],
         text: "The only public path; HMAC X-Hub-Signature-256 checked before the body is parsed."}
      - {title: Publish the job, action: "wardens-hooks → Event Hubs: one CloudEvent, id = delivery id", when: github, path: [hooks_eh, ~hooks_eh, ~tr_hooks, ~cfd_tr, ~cf_cfd, ~gh_cf],
         text: "A rule matched (wardens-deploy config/webhooks.yaml); everything else got 200 and went nowhere."}
      - {title: Consume the event, action: "Event Hubs → ingress consumer: next event in the partition", path: [~ing_eh],
         text: "Rules, root task and guardrail point 1, the same as direct mode."}
      - {title: Queue the incident, action: "Ingress consumer → wardens-router queue: start with an id from the event", path: [ing_q],
         text: "A repeat delivery is refused by Temporal; a refused task goes to the dead-letter hub; Temporal down means wait.",
         detail: "- Workflow id from the event: a redelivery is refused by Temporal.\n- The task waits on `wardens-router` until one of the two router workers polls.\n- Router down: nothing is dropped, only late (router SLO alert after 5 s)."}
      - {title: Router routes it, action: "wardens-router polls, then → incident-triage queue", when: alert, path: [~router_q, router_qt],
         text: "Rule routing-test sends WardensRoutingTest to alert.triage."}
      - {title: Triage records it, action: "incident-triage polls its queue and writes the finding", when: alert, path: [~it_q, it_db, ~it_db],
         text: "A finding and a run record; the router's thread tells #wardens-sre.", result: success, outcome: "Alert reached triage"}
      - {title: Drift incident starts, action: "wardens-router polls, then → terraform-drift queue", when: github, path: [~router_q, router_qd],
         text: "Started after startDelaySeconds, so the scan has finished; then it runs as in the drift use case.",
         result: success, outcome: "Drift incident started"}

  - id: approve-l2
    title: Level 2 approval in Slack
    summary: "terraform-drift proposes a merge on a development stack, the router's approve-then-act workflow posts a card, a linked reviewer presses Approve in Slack, and the agent merges (decision 0047)."
    steps:
      - {title: Hand off for approval, action: "terraform-drift → wardens-router queue: approve-then-act workflow", path: [td_handoff],
         text: "The run opened its draft PR and proposed merge_drift_pr at level 2; it hands the action over and ends.",
         detail: "- Only stacks whose environment is development or qa, under the owner's 30-day waiver; every other stack stays level 1.\n- The workflow id comes from the action's idempotency key, so the same action is never asked twice."}
      - {title: Card to the cell channel, action: "wardens-router → egress queue → chat egress → Slack", path: [~router_q, router_qe, ~egress_q, egress_slack, ~egress_slack],
         text: "The card shows the plan summary (what will change), the hashes the approval binds to, Approve and Deny buttons and a console link.",
         detail: "- Prepare checks the action is in the manifest at level 2 with approvers, point 4 says needs-approval and the act tool is granted.\n- The wait is 24 hours at most; expiry is a denial."}
      - {title: Reviewer presses Approve, action: "Slack → Cloudflare → cloudflared → Traefik → wardens-slack → Event Hubs", path: [slack_cf, cf_cfd, cfd_tr, tr_slack, slack_eh, ~slack_eh, ~tr_slack, ~cfd_tr, ~cf_cfd, ~slack_cf],
         text: "The button carries only an opaque id; the relay checks Slack's signature, publishes and answers at once."}
      - {title: Who pressed, action: "Ingress consumer ← Event Hubs, then ↔ Keycloak", path: [~ing_eh, ing_kc, ~ing_kc],
         text: "The press counts only from a person linked to an enabled Keycloak account in the action's approver group, read at the press.",
         detail: "- The decision is built from the request as the workflow holds it, never from the press.\n- A refused press is audited and the presser told why."}
      - {title: Approval signal, action: "Ingress consumer → Temporal: the approval signal", path: [ing_signal],
         text: "The workflow checks the decision again (bound, not expired, a person, an approver) before it counts."}
      - {title: Act on the agent's queue, action: "wardens-router → terraform-drift queue → activities", path: [~router_q, router_qd, ~td_acts_q, td_acts_guard, ~td_acts_guard],
         text: "The act runs once with the ApprovedAction; the binding checks it matches what was approved, then the kill switch.",
         detail: "- The PR's head SHA (or main's and the plan, for a revert) must be unchanged since the request.\n- Any difference: nothing is merged or applied, and the run says why."}
      - {title: Merge the PR, action: "terraform-drift → GitHub: mark ready, squash-merge", path: [td_gh, ~td_gh],
         text: "The merge runs the stack's apply on main through the IaC pipeline; a revert dispatches the apply instead."}
      - {title: Result in the thread, action: "wardens-router → egress → Slack: the outcome", path: [router_qe, ~egress_q, egress_slack, ~egress_slack],
         text: "The card loses its buttons and says who decided; the result goes to its thread and the audit log.",
         result: success, outcome: "Approved and merged"}

  - id: slack-chat
    title: Ask wardens in Slack
    summary: "A person mentions @wardens in an incident thread: Slack → tunnel → relay → bus → consumer → the thread workflow on the router's queue → the agent's queue → answer through the chat egress (team chat C4 to C6)."
    steps:
      - {title: Mention in a thread, action: "Slack → Cloudflare → cloudflared → Traefik → wardens-slack", path: [slack_cf, cf_cfd, cfd_tr, tr_slack],
         text: "Slack signs the event; the relay checks the signature, the workspace and the cell channel, and drops the app's own posts."}
      - {title: Publish and answer 200, action: "wardens-slack → Event Hubs, then 200 back to Slack", path: [slack_eh, ~slack_eh, ~tr_slack, ~cfd_tr, ~cf_cfd, ~slack_cf],
         text: "Slack needs an answer within 3 s, so the relay never waits for an agent."}
      - {title: Who is asking, action: "Ingress consumer ← Event Hubs, then ↔ Keycloak: the linked account", path: [~ing_eh, ing_kc, ~ing_kc],
         text: "The person's Slack link must point at an enabled account in the cell's viewer or editor group; a disabled one revokes the link.",
         detail: "- The link ties a Slack user to a Keycloak account.\n- Viewers may ask, editors may start tasks (`WARDENS_CHAT_CELL_GROUPS`).\n- The daily membership check audits every difference and revokes dead links."}
      - {title: Signal the thread, action: "Ingress consumer → wardens-router queue: the thread workflow", path: [ing_q, ~router_q],
         text: "Replies in an incident thread go to that incident's thread workflow; the router checks the open-thread cap."}
      - {title: Ask the agent, action: "wardens-router → terraform-drift queue: a read-only ask", path: [router_qd, ~td_wf_q],
         text: "interaction.chat stage ask: level 0, budget $0.05, at most 10 turns, tools read_run_record and read_artifact only."}
      - {title: Model answers, action: "LLM stage ↔ LiteLLM ↔ vLLM: the answer from the run's records", path: [td_llm_lite, lite_vllm, ~lite_vllm, ~td_llm_lite],
         text: "The run record and artifacts are data, never instruction; the kill switch and hold still apply."}
      - {title: Post the reply, action: "wardens-router → egress queue → chat egress → Slack thread", path: [router_qe, ~egress_q, egress_slack, ~egress_slack],
         text: "The egress claims the post's key first, so a retried activity never posts twice.",
         result: success, outcome: "Answer in the thread"}

  - id: llm-guardrails
    title: LLM stage with guardrails and MCP
    summary: "One stage asks the model, the model asks for a tool, GuardedToolset decides, web search goes through LiteLLM and mcp-guard (how-docs: model access, guardrails, MCP)."
    modes: [{id: allowed, label: Tool allowed}, {id: refused, label: Undeclared tool refused}]
    steps:
      - {title: Kill switch check, action: "Guardrails ↔ wardens-state-db: is the switch engaged?", path: [td_acts_guard, td_guard_db, ~td_guard_db, ~td_acts_guard],
         text: "The ConfigMap or the DB row for this agent or `all`; unreadable counts as engaged (fail closed)."}
      - {title: Load pinned tools, action: "LLM stage ↔ LiteLLM /mcp: tools/list, hashes checked", path: [td_acts_llm, td_llm_mcp, ~td_llm_mcp],
         text: "A missing or changed definitionSha256 refuses the whole toolset; the stage then runs without MCP tools.",
         detail: "- `tools/list` through LiteLLM `/mcp` with the MCP-only key.\n- Each tool's `definitionSha256` must match the manifest.\n- One mismatch refuses the whole toolset (no partial MCP)."}
      - {title: Ask the model, action: "LLM stage ↔ LiteLLM ↔ vLLM: the model asks for a tool", path: [td_llm_lite, lite_vllm, ~lite_vllm, ~td_llm_lite],
         text: "Usage limits from prices.yaml; only declared read tools are visible."}
      - {title: Point 2 refuses, action: "GuardedToolset: undeclared tool, ModelRetry back to the model", when: refused, lights: [td_llm],
         text: "check_tool_call returns undeclared_tool; the function never runs and a tool.refused audit event is written."}
      - {title: Model falls back, action: "LLM stage → activities.py: deterministic fallback", when: refused, path: [~td_acts_llm],
         text: "Out of retries, the stage takes its fallback: every attribute unknown, recorded in the run record.",
         result: done, outcome: "Refused; fallback used"}
      - {title: Call web search, action: "LiteLLM → Traefik → mcp-guard → mcp-searxng: tools/call", when: allowed, path: [td_llm_mcp, lite_tr, tr_guard, guard_searx],
         text: "LiteLLM signs a short-lived token; mcp-guard checks the agent, the tool, x-wardens-run and traceparent."}
      - {title: Results come back, action: "mcp-searxng → mcp-guard → LiteLLM → LLM stage: results", when: allowed, path: [~guard_searx, ~tr_guard, ~lite_tr, ~td_llm_mcp],
         text: "Capped at 20,000 characters and handed to the model as untrusted data; an execute_tool span is recorded."}
      - {title: Validated answer, action: "LLM stage → activities.py → guardrails: output checked, point 4", when: allowed, path: [~td_acts_llm, td_acts_guard, ~td_acts_guard],
         text: "The output validator checks it against the input; check_action passes the proposed action.",
         result: success, outcome: "Answer within the guardrails"}

  - id: chat
    title: Chat with stack-author
    summary: "A signed-in person chats in the console's Author tab; one workflow per conversation on stack-author's queue; the person presses the button for the PR."
    steps:
      - {title: Sign in, action: "Browser ↔ Keycloak: OIDC sign-in", path: [eng_kc, ~eng_kc],
         text: "A console group; oauth2-proxy keeps the session."}
      - {title: Send a message, action: "Browser → Traefik → console → stack-author queue: message signal", path: [eng_tr, tr_console, console_qa],
         text: "The first message starts the conversation workflow; only its starter may send to it."}
      - {title: Worker takes the turn, action: "stack-author queue → stack-author: next_message", path: [~sa_q],
         text: "Messages wait in order in the workflow, so none is lost during a slow model call."}
      - {title: Read the stack, action: "stack-author ↔ IaC repository: shared module and resources.yaml", path: [sa_gh, ~sa_gh],
         text: "Its own GitHub App, read tools only."}
      - {title: Ask the model, action: "stack-author ↔ LiteLLM ↔ vLLM: draft the change", path: [sa_lite, lite_vllm, ~lite_vllm, ~sa_lite],
         text: "Thinking off; the diff is built and checked in code."}
      - {title: Show the diff, action: "stack-author → queue → console → browser: the view query", path: [sa_q, ~console_qa, ~tr_console, ~eng_tr],
         text: "The page polls the view query, because a model turn can outlast any request timeout.",
         detail: "- Signal: a message in; query: the current view out.\n- The workflow keeps messages in order across worker restarts.\n- The diff is computed in code; the model only proposes."}
      - {title: Press the button, action: "Browser → console → stack-author queue → stack-author", path: [eng_tr, tr_console, console_qa, ~sa_q],
         text: "The person presses Send (L1); the agent never opens a PR on its own words."}
      - {title: Draft PR opened, action: "stack-author ↔ IaC repository: draft PR on an author/ branch", path: [sa_gh, ~sa_gh],
         text: "The kill switch is checked first; the plan's result is posted back into the conversation.",
         result: success, outcome: "Draft PR on author/ branch"}

  - id: pr-checks
    title: "Pull request: checks and scans"
    summary: "An agent pull request through agent-ci: the wheel is verified, the agent's own tests and eval gate run, every source scanner runs, and the image is built and scanned. Nothing is pushed or signed."
    modes: [{id: pass, label: All gates pass}, {id: blocked, label: A scanner blocks}]
    steps:
      - {title: Open a pull request, action: "Engineer → warden-<agent>: PR; ci.yaml calls agent-ci", path: [eng_gh],
         text: "Every change to an agent, from a prompt to the manifest, goes through the same pipeline."}
      - {title: Verify the wheel, action: "wheel job ↔ Zot: pinned wardens-py, Cosign verify", path: [wheel_zot, ~wheel_zot, wheel_cosign, ~wheel_cosign],
         text: "OpenBao role pr can only pull; a wheel with a bad signature or another version than pyproject.toml stops the run."}
      - {title: The agent's own checks, action: "wheel → test job ↔ GitHub: check-agent, tests, replay, eval gate", path: [wheel_test, test_gh, ~test_gh],
         text: "No id-token in this job: the agent's code never runs next to a credential. Evals use the test and recorded models."}
      - {title: Secrets and SAST, action: "gates job → Gitleaks, Semgrep and Bandit", path: [gates_gl, ~gates_gl, gates_sast, ~gates_sast],
         text: "Gitleaks reads the commit's whole history; each scanner runs even after another failed.",
         detail: "- Gitleaks: `--log-opts HEAD`, the built commit's whole history.\n- Semgrep: the platform's rules; Bandit: Python.\n- Exceptions live in the repo: `.gitleaksignore`, `# nosemgrep`, `# nosec`.\n- Every scanner runs even after a failure, so one run lists every finding."}
      - {title: Dependencies and IaC, action: "gates job → Trivy, then Checkov, Conftest and Hadolint", path: [gates_trivy, ~gates_trivy, gates_policy, ~gates_policy],
         text: "uv.lock, Dockerfiles and IaC against the platform's own policies."}
      - {title: Build and scan image, action: "image job → BuildKit, then Trivy and Syft on the result", path: [image_bk, ~image_bk, image_trivy, ~image_trivy],
         when: pass, text: "Role pr: build and scan only. Each platform's image gets a CVE and licence scan and an SBOM."}
      - {title: Ready to merge, action: "Gate summary in the job: every gate green", when: pass, lights: [ci_gates, ci_image],
         text: "The PR shows one table of every gate; the owner reads the run before merging (no required checks on GitHub Free).",
         result: success, outcome: "All gates pass; nothing published"}
      - {title: A finding blocks, action: "Gate summary: a blocking finding fails the gates job", when: blocked, lights: [sc_trivy_src, ci_gates],
         text: "For example a critical CVE in uv.lock: fix it, or accept it in .trivyignore with a reason, in the same PR.",
         result: fail, outcome: "Blocked before merge"}

  - id: sdlc
    title: Agent life cycle to shadow
    summary: "From a merge on warden-<agent> to a worker polling its own queue: signed, attested image, digest promoted, registry entry published (approved when it raises risk), admitted by Kyverno. Stages: qualify, specify, build, shadow, promote, operate, retire."
    modes: [{id: plain, label: No risk raised}, {id: risk, label: Risk raised (approval)}]
    steps:
      - {title: Merge to main, action: "Engineer → warden-<agent>: merge; agent-ci runs on main", path: [eng_gh],
         text: "The agent was scaffolded by wardens new-agent and specified in manifest.yaml (stages 0 to 2); its CHANGELOG names the new version."}
      - {title: Checks again, action: "agent-ci on main: wheel, test, gates and image builds", path: [test_gh, ~test_gh],
         text: "The same wheel, test and gates jobs as on the pull request, on the merged commit."}
      - {title: Push, sign, attest, action: "image job: build, scan, sign (OpenBao), push (Zot), SBOM (Dependency-Track)", path: [image_bk, ~image_bk, image_trivy, ~image_trivy, image_bao, ~image_bao, image_zot, ~image_zot, image_dt, ~image_dt],
         text: "Transit key cosign signs and attests the SBOMs; transit key agent-ci attests the test results, the wardens version and the commit.",
         detail: "- Trivy and Syft scan before any push: a blocked image never reaches Zot.\n- OpenBao role `agent-ci`: bound to agent-ci.yaml at `refs/heads/main` and `warden-*` repos.\n- `cosign` key: image signature and SBOM attestations.\n- `agent-ci` key: attestation of the test results, wardens version, commit and run.\n- SBOMs to Dependency-Track never fail the build."}
      - {title: Promote the digest, action: "promote job → homelab-gitops: apps/<agent>/values.yaml", path: [promote_gh, ~promote_gh],
         text: "The writer App commits the digest; the deploy waits for Argo CD."}
      - {title: Publish the entry, action: "registry job → wardens-deploy: registry/<agent>/<version>/", path: [registry_gh, ~registry_gh],
         text: "wardens registry diff --risk decides: no new risk is a commit on main; a higher level, a new act tool or a wider credential is a pull request."}
      - {title: CI asks for approval, action: "registry job → console: POST /api/registry-approvals", when: risk,
         path: [registry_ask, tr_approve, ~tr_approve, ~registry_ask],
         text: "agent-ci sends the current and new manifests with its OIDC token; the console computes the risk items itself and lists the request for the cell's reviewers."}
      - {title: A reviewer approves, action: "Reviewer → console Approvals → OpenBao sign → dispatch the sync", when: risk,
         path: [appr_tr, tr_approve, approve_bao, ~approve_bao, approve_dispatch, ~approve_dispatch, ~tr_approve, ~appr_tr],
         text: "The requester is the agent-ci workflow, so any reviewer of the cell approves; the console signs the record, then starts approvals-sync (the cron is the fallback)."}
      - {title: Sync commits and merges, action: "approvals-sync ↔ console, then → wardens-deploy PR", when: risk,
         path: [sync_tr, tr_approve, ~tr_approve, ~sync_tr, sync_gh, ~sync_gh],
         text: "It reads the signed record, writes approval.json beside the entry, verifies it and squash-merges the pull request."}
      - {title: wardens-deploy checks, action: "wardens-deploy CI: registry check, verify-approval", path: [deploy_gh, ~deploy_gh],
         text: "Contracts of every handoff, the config, mcp/ and routing cases; a risk-raising version without a valid signature fails."}
      - {title: Argo CD syncs, action: "Argo CD ↔ homelab-gitops and wardens-deploy, then → k3s API", path: [argo_gitops, ~argo_gitops, argo_deploy, ~argo_deploy, argo_api, api_registry, ~api_registry, ~argo_api],
         text: "The registry and config ConfigMaps first (sync wave -1), then the wardens-agent chart with the new digest."}
      - {title: Kyverno admits, action: "k3s API ↔ Kyverno ↔ Zot: digest, context, agent-ci attestation", path: [api_kyverno, kyverno_zot, ~kyverno_zot, ~api_kyverno],
         text: "An image that didn't come from agent-ci on main, or isn't pinned, never starts.",
         detail: "- `verifyImages`: digest pinned, attestation type `https://cloudutsuk.com/attestations/agent-ci/v1`.\n- Key: `apps/kyverno-policies/agent-ci.pub`.\n- Also: restricted security context, read-only root, requests and a memory limit."}
      - {title: Worker polls in shadow, action: "terraform-drift: pull, read its entry, poll its queue", path: [drift_zot, ~drift_zot, drift_registry, ~drift_registry], lights: [q_drift],
         text: "Shadow: people check every run. Nightly evals and their verdicts are the evidence for the promote gate (gates/04-promote-*).",
         result: success, outcome: "New version in shadow"}

  - id: release
    title: Framework release to agents
    summary: "A wardens release reaches every agent: the wheel image is built, scanned and signed, the release is tagged, bump PRs go to the agent repositories, and the nightly evals measure every agent on the live model."
    steps:
      - {title: Release PR merged, action: "Engineer → platform-wardens: version and CHANGELOG", path: [eng_pw],
         text: "wardens release check compared the contracts and check-agent rules with the last release: a tightening ships only in a major."}
      - {title: Build the wheel image, action: "wardens-py.yaml → BuildKit → Zot: platform/wardens-py:<version>", path: [release_bk, ~release_bk, release_zot, ~release_zot],
         text: "Through build-image.yaml: the same security gates, a signed multi-arch image, a release tag that never moves."}
      - {title: Tag and release, action: "wardens-py.yaml → GitHub: wardens-v<version> and the release notes", path: [release_gh, ~release_gh],
         text: "Never pushed by hand; the release carries the CHANGELOG section, the image digest and the API reference."}
      - {title: Bump the agents, action: "Bump job → warden-<agent> repos: one PR each", path: [release_bump, ~release_bump],
         text: "Moves the pin, the Dockerfile digest and uv.lock together, with any migration; off until WARDENS_BUMP_ENABLED, so the owner runs wardens bump today.",
         detail: "- `wardens bump <version>` moves the pin, Dockerfile digest and uv.lock together.\n- `copier update` brings template changes; majors need `--allow-major`.\n- A new check-agent rule ships as a WARN first, or in a major with its migration."}
      - {title: Each bump PR checked, action: "agent-ci on the bump PR: verify wheel, tests, gates", path: [wheel_zot, ~wheel_zot, wheel_test, test_gh, ~test_gh],
         text: "The agent's replay tests catch a workflow the new framework would replay differently (decision 0040 rule 1)."}
      - {title: Nightly evals, action: "evals-nightly → wardens-deploy, agent repos, LiteLLM, console feedback", path: [nightly_deploy, ~nightly_deploy, nightly_agents, ~nightly_agents, nightly_lite, ~nightly_lite, nightly_tr, ~nightly_tr],
         text: "Every registered agent on the live model, scored with people's verdicts; a safety failure or regression fails the gate."}
      - {title: Gauges to Mimir, action: "evals-nightly → OTLP gateway: wardens_eval_* gauges", path: [nightly_gw],
         text: "The eval alerts fire on a safety failure, a measure below threshold, a regression or a stale run.",
         result: success, outcome: "Release measured on every agent"}
