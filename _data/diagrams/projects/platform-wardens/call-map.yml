# Ported from platform-wardens diagrams/wardens-call-map/diagram.yml (2026-11-09); icons mapped to the blog's logos
# and the how-doc references dropped. Edit the source in platform-wardens and port again, so the two stay the same.
# Call map: which Python function in an agent calls which function in the wardens framework, and which checks,
# guardrails and LLM practices run on the way. Traced on platform-wardens main (2026-11-09) for two agents:
# terraform-drift (started on drift by the GitHub webhook, deterministic stages plus two LLM stages) and stack-author (a chat with tools).
# Every component's API line is the file and line of the function; paths under agents/ are short for
# agents/devops/<agent>/src/<package>/, paths under wardens/ for framework/src/wardens/.
# Gaps the code shows today are drawn as stated limits, not as working paths:
# - guardrail point 1 (check_submission) runs only in Console.build, so schedule-started tasks skip it;
# - stack-author's model has no circuit breaker (model_from_env without agent=);
# - stack-author's GuardedToolset gets no manifest or audit log, so tool bounds aren't checked and refusals aren't audited;
# - no agent stage calls mcp_toolset yet (drift's manifest declares web search; the MCP plan's phase 5 is next).
title: wardens call map
description: "Which agent function calls which wardens function, and the checks, guardrails and LLM practices that run on the way, replayed as eight use cases."
level: 1
levels: [Context, Agents & modules, Files, Functions & checks]
accent: "#2563EB"
accent2: "#EC4899"
lock: false
details: true

views:
  - {id: guardrails, label: Guardrails, icon: shield}
  - {id: llm, label: LLM practices, icon: cpu}
  - {id: evidence, label: Evidence, icon: chart}

certs:
  le-home:
    label: "<app>.<cluster>.home.cloudutsuk.com"
    type: public
    by: "Traefik, the ingress controller of each k3d cluster (TLS ends there)"
    issuer: "Let's Encrypt → ISRG Root X1; ACME DNS-01 through Cloudflare by cert-manager (cluster issuer `letsencrypt`)"
    valid: "90 days; cert-manager renews it before expiry"
    stored: "A Secret per Ingress in the app's namespace"
    trust: "Public chain: Python's CA bundle and every browser trust ISRG Root X1"
  cf-edge:
    label: "hooks.cloudutsuk.com at Cloudflare's edge"
    type: public
    by: "Cloudflare's edge (TLS ends there, then the tunnel carries the request)"
    issuer: "Cloudflare Universal SSL, issued and renewed by Cloudflare"
    valid: "Managed by Cloudflare"
    trust: "Public chain: GitHub's webhook sender trusts it"
  github-pub:
    label: api.github.com
    type: public
    by: "GitHub"
    issuer: "GitHub's public CA chain, managed by GitHub"
    valid: "Managed by GitHub"
    trust: "Public chain in the image's CA bundle"
  slack-pub:
    label: hooks.slack.com
    type: public
    by: "Slack"
    issuer: "Slack's public CA chain, managed by Slack"
    valid: "Managed by Slack"
    trust: "Public chain in the image's CA bundle"

nodes:
  - id: engineer
    label: Platform engineer
    icon: user
    status: external
    facts:
      summary: "Chats with stack-author in the console's Author tab and confirms the change that becomes a draft PR."
      how: "Browser on the tailnet; the console signals the conversation workflow in Temporal."
      api: "None of their own: the wardens console"

  - id: agents
    label: Agent code
    sub: "agents/devops/*"
    icon: code
    status: built
    facts:
      summary: "Each agent is a small Python package: a worker, a deterministic workflow, activities, stages and tools."
      how: "Agents never import Temporal or a model SDK directly: they go through wardens.durable and wardens.llm (ADR 0040, 0042)."
      api: "`agents/<domain>/<agent>/src/<package>/`"
    children:
      - id: drift
        label: terraform-drift
        sub: "on drift · L1"
        icon: bolt
        status: built
        facts:
          summary: "Explains Terraform drift found by the daily scan and opens a draft PR that codifies it."
          how: "Deterministic stages decide; two LLM stages only classify and explain. Every write is a draft PR."
          api: "`agents/devops/terraform-drift/src/terraform_drift/`"
        children:
          - id: d_worker
            label: worker.py
            icon: file
            status: built
            facts:
              summary: "Builds the worker process: model, kill switch, sinks, the activity binding and the schedules."
              how: "BINDING sets each activity's timeout and retries; act activities are idempotent with 3 attempts."
              api: "`agents/…/terraform_drift/worker.py`"
            children:
              - id: d_run_worker
                label: run_worker()
                icon: function
                status: built
                facts:
                  summary: "The worker's entry point: wires every wardens piece the agent needs, then polls its queue."
                  how: "configure → DriftActivities(kill_switch=…) → bind_activities(sink, prices, notifier, audit) → connect → sync_schedules → create_worker."
                  api: "`agents/…/terraform_drift/worker.py:356`"
              - id: d_model
                label: _model()
                icon: function
                status: built
                facts:
                  summary: "Builds the model the LLM stages use, through the agent's circuit breaker, and refuses an unpriced one."
                  how: "model_from_env(MANIFEST models[0].primary, agent=NAME), then require_price against prices.yaml."
                  api: "`agents/…/terraform_drift/worker.py:332`"
          - id: d_workflow
            label: workflow.py
            icon: file
            status: built
            facts:
              summary: "The deterministic workflow: decides what to do next and never touches the network itself."
              how: "Every call on `acts` becomes a Temporal activity through wardens.durable's proxy."
              api: "`agents/…/terraform_drift/workflow.py`"
            children:
              - id: d_run
                label: run(task, acts)
                icon: function
                status: built
                facts:
                  summary: "Checks the kill switch, finds the scan run and stacks, then per stack: kill switch, analyse, emit, open the PR."
                  how: "A failure in one stack is caught and recorded; the others go on."
                  api: "`agents/…/terraform_drift/workflow.py:46`"
          - id: d_acts
            label: activities.py
            icon: file
            status: built
            facts:
              summary: "DriftActivities: every side effect the workflow asks for, each one a Temporal activity."
              how: "Runs on the activity poller of the worker; reads GitHub, calls the stages, applies guardrail point 4."
              api: "`agents/…/terraform_drift/activities.py:37`"
            children:
              - id: d_ks
                label: kill_switch_engaged()
                icon: function
                status: built
                facts:
                  summary: "Asks wardens whether this agent's kill switch, or the `all` switch, is engaged."
                  how: "is_engaged(self._switch, manifest()[\"name\"])."
                  api: "`agents/…/terraform_drift/activities.py:48`"
              - id: d_analyse
                label: analyse()
                icon: function
                status: built
                facts:
                  summary: "Analyses one stack: hands the plan's drift to analyse_stack with the model and the gate's context."
                  how: "Reads the redacted plan from the scan run's artifacts and calls stages/analyse.py."
                  api: "`agents/…/terraform_drift/activities.py:84`"
              - id: d_emit
                label: emit()
                icon: function
                status: built
                facts:
                  summary: "Guardrail point 4: turns the analysis into artifacts and checks every proposed action before anything is written."
                  how: "check_action(…, task_max_level=task.max_autonomy_level, ownership=…) per action, then action_decision; refused raises PermissionError."
                  api: "`agents/…/terraform_drift/activities.py:126`"
              - id: d_open_pr
                label: open_draft_pr()
                icon: function
                status: built
                facts:
                  summary: "The only write: hands the request and the kill switch to the GitHub writer."
                  how: "An act activity: idempotent, 3 attempts; DraftPrRefused, ScopeError and NotAnOperator are not retried."
                  api: "`agents/…/terraform_drift/activities.py:212`"
          - id: d_stages
            label: stages/ · policies/
            icon: file
            status: built
            facts:
              summary: "The analysis pipeline: redact, classify (LLM), group, gate (deterministic), explain (LLM)."
              how: "Only the gate decides what is proposed; the model's output is validated and has a fallback."
              api: "`agents/…/terraform_drift/stages/`, `policies/gate.py`"
            children:
              - id: d_analyse_stack
                label: analyse_stack()
                icon: function
                status: built
                facts:
                  summary: "Runs the pipeline for one stack and returns the proposals with their gate decisions."
                  how: "attribute_changes → classify → group → evaluate → rationale, per proposal."
                  api: "`agents/…/terraform_drift/stages/analyse.py:46`"
              - id: d_attr
                label: attribute_changes()
                icon: function
                status: built
                facts:
                  summary: "Turns a drifted resource into attribute changes, with sensitive values replaced before any model sees them."
                  how: "A sensitive attribute becomes \"(sensitive value)\" in the change the prompt is built from."
                  api: "`agents/…/terraform_drift/stages/redact.py:65`"
              - id: d_classify
                label: classify()
                icon: function
                status: built
                facts:
                  summary: "LLM stage: says for each changed attribute whether it is expected, a hotfix or unknown."
                  how: "Agent(output_type=ClassifyOutput, retries=2), usage limits 4 requests and 60,000 tokens, evidence wrapped as untrusted data."
                  api: "`agents/…/terraform_drift/stages/classify.py:87`"
              - id: d_gate
                label: gate.evaluate()
                icon: check
                status: built
                facts:
                  summary: "Deterministic policy: decides investigate, codify (draft PR or patch text) or a revert recommendation."
                  how: "Secrets, scope and the classification decide; no model call. Anything unknown is investigate."
                  api: "`agents/…/terraform_drift/policies/gate.py:76`"
              - id: d_rationale
                label: rationale()
                icon: function
                status: built
                facts:
                  summary: "LLM stage: one short explanation for a proposal the gate already decided."
                  how: "Usage limits 2 requests and 20,000 tokens; on failure a fixed default rationale."
                  api: "`agents/…/terraform_drift/stages/recommend.py:63`"
          - id: d_writer
            label: GitHubWriter.open_draft_pr()
            sub: "tools/draft_pr.py"
            icon: git
            status: built
            facts:
              summary: "Opens the draft PR on a drift/ branch, or returns the one already open for the same key."
              how: "Branch must start with the prefix and never be main; re-checks patchSha256; checks the kill switch right before the write."
              api: "`agents/…/terraform_drift/tools/draft_pr.py:133`"
          - id: d_entry
            label: _suggest_correlation()
            sub: "entrypoint.py"
            icon: function
            status: built
            facts:
              summary: "Adds a suggestedHandoffs entry to a finding so the incident can ask change-correlator who made the change."
              how: "correlate_inputs builds the change.correlate inputs from the drifted resources."
              api: "`agents/…/terraform_drift/entrypoint.py:305`"

      - id: author
        label: stack-author
        sub: "chat · L1"
        icon: message
        status: built
        facts:
          summary: "Chats with an engineer about a new resource and, once they confirm the diff, opens a draft PR."
          how: "One workflow per conversation; the model reads stacks and modules through guarded read tools."
          api: "`agents/devops/stack-author/src/stack_author/`"
        children:
          - id: a_worker
            label: worker.py
            sub: "run_worker() · _model()"
            icon: file
            status: built
            facts:
              summary: "Builds the chat model, the catalog, the GitHub reader and writer, and binds the activities."
              how: "_model calls model_from_env without agent=, so this model has no circuit breaker; require_price still applies."
              api: "`agents/…/stack_author/worker.py:103`, `:125`"
          - id: a_workflow
            label: workflow.py
            icon: file
            status: built
            facts:
              summary: "The conversation loop: waits for the next message, runs a turn, or opens the PR the person confirmed."
              how: "run checks the kill switch, recalls memory, then loops on next_message."
              api: "`agents/…/stack_author/workflow.py:194`"
            children:
              - id: a_turn
                label: _turn()
                icon: function
                status: built
                facts:
                  summary: "One chat turn: sends the message with the remaining budget to the chat_turn activity."
                  how: "remaining_usd = the task's cost limit minus what the conversation has spent."
                  api: "`agents/…/stack_author/workflow.py:93`"
              - id: a_confirm
                label: _confirm()
                icon: function
                status: built
                facts:
                  summary: "Runs when the person presses the button: same diff hash, deletes acknowledged, kill switch, emit, PR, remember."
                  how: "patchSha256 must match what the person saw; nothing is written otherwise."
                  api: "`agents/…/stack_author/workflow.py:122`"
          - id: a_acts
            label: activities.py
            icon: file
            status: built
            facts:
              summary: "StackAuthorActivities: the chat turn, guardrail point 4, the PR and long-term memory."
              how: "Each method is a Temporal activity bound by wardens.durable."
              api: "`agents/…/stack_author/activities.py:45`"
            children:
              - id: a_chat
                label: chat_turn()
                icon: function
                status: built
                facts:
                  summary: "Hands the turn to the chat stage with the model, catalog, reader, manifest and prices."
                  how: "No retries: a model failure becomes a reply, not a failed conversation."
                  api: "`agents/…/stack_author/activities.py:76`"
              - id: a_emit
                label: emit()
                icon: function
                status: built
                facts:
                  summary: "Guardrail point 4 for the confirmed change, at most level 1."
                  how: "check_action(…, task_max_level=1, ownership=…); not allowed raises DraftPrRefused."
                  api: "`agents/…/stack_author/activities.py:79`"
              - id: a_memory
                label: recall() · remember()
                icon: function
                status: built
                facts:
                  summary: "Long-term memory: suggestions from earlier conversations, written only from a confirmed change."
                  how: "Values are taken in code, never from model text, and shown as unreviewed and possibly stale."
                  api: "`agents/…/stack_author/activities.py:64`, `:105`"
          - id: a_stage
            label: stages/chat.py
            icon: file
            status: built
            facts:
              summary: "The chat stage: budget, guarded read tools, the model, and a validator that prepares the diff."
              how: "Agent(output_type=[Ask, Propose], retries=2); REQUEST_LIMIT 14 per turn."
              api: "`agents/…/stack_author/stages/chat.py`"
            children:
              - id: a_chat_turn
                label: chat_turn()
                icon: function
                status: built
                facts:
                  summary: "Sets the turn's usage limits, runs the agent with the guarded toolset and records the model call."
                  how: "CostCeilingReached becomes the reply \"This conversation has used its budget…\"."
                  api: "`agents/…/stack_author/stages/chat.py:164`"
              - id: a_toolset
                label: _toolset()
                icon: function
                status: built
                facts:
                  summary: "The six read tools the model may call, wrapped in GuardedToolset."
                  how: "GuardedToolset(FunctionToolset(…), allowed=read_tools(manifest, …), agent=…); no manifest or audit is passed."
                  api: "`agents/…/stack_author/stages/chat.py:95`"
              - id: a_prepared
                label: _prepared()
                icon: check
                status: built
                facts:
                  summary: "Output validator: a proposal is prepared in code (real stack, real module inputs) before it reaches the person."
                  how: "Errors raise ModelRetry with the reasons, so the model repairs the proposal (2 retries)."
                  api: "`agents/…/stack_author/stages/chat.py:67`"
          - id: a_tools
            label: tools/
            icon: file
            status: built
            facts:
              summary: "Catalog reads and the GitHub writer."
              how: "Reads are limited to the target repositories; the writer re-checks the kill switch."
              api: "`agents/…/stack_author/tools/`"
            children:
              - id: a_read_stack
                label: Catalog.read_stack()
                icon: function
                status: built
                facts:
                  summary: "Reads a stack's resources.yaml and its environment's common_vars.yaml for the model."
                  how: "The path must be under environments/<cloud>/ with no `..`; returned as data, not instructions."
                  api: "`agents/…/stack_author/tools/catalog.py:136`"
              - id: a_writer
                label: GitHubWriter.open_draft_pr()
                icon: git
                status: built
                facts:
                  summary: "Opens the draft PR for the confirmed diff in an allowed repository."
                  how: "is_engaged(kill_switch, agent) right before the write; requests the reviewers from targets."
                  api: "`agents/…/stack_author/tools/github.py:157`"

  - id: wardens
    label: wardens framework
    sub: "framework/src/wardens"
    icon: package
    status: built
    facts:
      summary: "The shared library every agent runs on: durability, entry, guardrails, model access, evidence, state, handoff, messages."
      how: "Imported by each agent's worker; the guardrails live here so no agent can skip or reimplement them."
      api: "`framework/src/wardens/`"
    children:
      - id: w_durable
        label: wardens.durable
        icon: clock
        status: built
        facts:
          summary: "Temporal behind a small API: binding, the incident workflow, schedules, workers and conversations."
          how: "The agent's workflow calls `acts.x()`; the proxy turns it into an activity with the binding's timeout and retries."
          api: "`framework/src/wardens/durable/`"
        children:
          - id: w_binding
            label: binding.py
            icon: file
            status: built
            facts:
              summary: "The bridge from plain agent code to Temporal workflows and activities."
              how: "AgentBinding holds the options per method; default_options come from the manifest."
              api: "`framework/src/wardens/durable/binding.py`"
            children:
              - id: w_proxy
                label: _ActivityProxy
                icon: function
                status: built
                facts:
                  summary: "What `acts` is inside a workflow: every method call becomes workflow.execute_activity(\"<agent>.<method>\")."
                  how: "now comes from workflow time; next_message and publish stay in the workflow; each call is logged as an ActivityRecord."
                  api: "`framework/src/wardens/durable/binding.py:126`"
              - id: w_run_agent
                label: _run_agent()
                icon: function
                status: built
                facts:
                  summary: "Runs the agent's workflow and, in a finally block, always writes its run record."
                  how: "RECORD_ACTIVITY is shielded from cancellation, 5 attempts, ContractError not retried; then holds or sends the message."
                  api: "`framework/src/wardens/durable/binding.py:222`"
              - id: w_bind
                label: bind_activities()
                icon: function
                status: built
                facts:
                  summary: "Wraps the agent's methods as activities and adds the framework's own: record_run and notify."
                  how: "record_run → build_run_record → sink.write → export_run; notify → Notifier.send."
                  api: "`framework/src/wardens/durable/binding.py:436`"
          - id: w_incident
            label: incident.py
            icon: file
            status: built
            facts:
              summary: "The root workflow for scheduled and routed work: runs the agent as a child and plans handoffs."
              how: "Children run one after another (parallel ones behind PARALLEL_PATCH)."
              api: "`framework/src/wardens/durable/incident.py`"
            children:
              - id: w_inc_run
                label: IncidentWorkflow.run()
                icon: function
                status: built
                facts:
                  summary: "Resolves the capability, starts the child workflow, then asks for a handoff per suggestion in its findings."
                  how: "Each suggestedHandoffs entry becomes a plan_handoff activity with a cost share."
                  api: "`framework/src/wardens/durable/incident.py:96`"
              - id: w_plan_handoff
                label: plan_handoff()
                icon: function
                status: built
                facts:
                  summary: "Activity that calls plan_child_task and records the decision as a metric and a span."
                  how: "handoff_planned(agent, target, planned, reason)."
                  api: "`framework/src/wardens/durable/incident.py:246`"
          - id: w_sched
            label: schedules.py · worker.py
            icon: file
            status: built
            facts:
              summary: "Schedules from the manifest, the root task for each fire, and the worker itself."
              how: "sync_schedules creates or updates Temporal schedules; make_task builds the task when one fires."
              api: "`framework/src/wardens/durable/schedules.py`, `worker.py`"
            children:
              - id: w_make_task
                label: make_task()
                icon: function
                status: built
                facts:
                  summary: "Builds the root task for one schedule fire (channel schedule) with create_root_task."
                  how: "Does not call check_submission: guardrail point 1 is skipped on this path today (stated gap)."
                  api: "`framework/src/wardens/durable/schedules.py:59`"
              - id: w_sync
                label: sync_schedules()
                icon: function
                status: built
                facts:
                  summary: "Makes Temporal's schedules match the manifest's at worker start."
                  how: "One schedule per manifest entry, running the incident workflow on the agent's queue."
                  api: "`framework/src/wardens/durable/schedules.py:107`"
              - id: w_create_worker
                label: create_worker()
                icon: function
                status: built
                facts:
                  summary: "The Temporal worker for the agent's queue: its workflows and activities, sandboxed."
                  how: "Registers IncidentWorkflow, the agent workflow and every bound activity."
                  api: "`framework/src/wardens/durable/worker.py:90`"
          - id: w_conv
            label: Conversation
            sub: "conversation.py"
            icon: message
            status: built
            facts:
              summary: "Workflow-side next_message and publish for chat agents: messages arrive as signals, the view is a query."
              how: "next_message waits a set time and returns None when nothing arrived."
              api: "`framework/src/wardens/durable/conversation.py:28`"

      - id: w_runtime
        label: wardens.runtime
        icon: api
        status: built
        facts:
          summary: "Entry points: the console, the GitHub and alert receivers, the ingress bus, the registry."
          how: "Every operator, webhook and routed task is built by Console.build, which runs guardrail point 1."
          api: "`framework/src/wardens/runtime/`"
        children:
          - id: w_gh_hook
            label: GitHub Receiver
            sub: "github_webhook.py"
            icon: api
            status: built
            facts:
              summary: "Turns a signed workflow_job delivery from the drift scan into a root task and starts the incident."
              how: "HMAC checked first; a matching DriftRule builds the request and calls Console.build."
              api: "`framework/src/wardens/runtime/github_webhook.py:224`"
          - id: w_console
            label: Console.build()
            icon: function
            status: built
            facts:
              summary: "The one place a root task is built for operators, webhooks and routing, with guardrail point 1."
              how: "create_root_task, narrow to the channel's grants, then check_submission; refused raises Refused."
              api: "`framework/src/wardens/runtime/console.py:181`"
          - id: w_entry
            label: create_root_task()
            sub: "entry.py"
            icon: function
            status: built
            facts:
              summary: "Builds a schema-valid root task from the channel's policy: deadline, level, cost limit, hop budget."
              how: "Channel policies from config; dedupe when a store is given."
              api: "`framework/src/wardens/runtime/entry.py:107`"

      - id: w_guard
        label: wardens.guardrails
        icon: shield
        status: built
        facts:
          summary: "The four guardrail points, the kill switch and the circuit breaker."
          how: "Point 1 check_submission, point 2 check_tool_call, point 3 approval (planned), point 4 check_action."
          api: "`framework/src/wardens/guardrails/`"
        children:
          - id: w_is_engaged
            label: is_engaged()
            sub: "kill_switch.py"
            icon: lock
            status: built
            facts:
              summary: "Reads the kill switch for this agent or `all`; fails closed."
              how: "Any exception reading the switch counts as engaged; killswitch_observed records each read."
              api: "`framework/src/wardens/guardrails/kill_switch.py:80`"
          - id: w_check_sub
            label: check_submission()
            sub: "point 1"
            icon: check
            status: built
            facts:
              summary: "Point 1: a task must ask for a declared capability, within the agent's level, the framework ceiling and its cost ceiling."
              how: "Collects every reason (undeclared_capability, autonomy, cost_ceiling, quarantined) and raises SubmissionRejected."
              api: "`framework/src/wardens/guardrails/autonomy.py:34`"
          - id: w_check_action
            label: check_action()
            sub: "point 4 · autonomy.py"
            icon: shield
            status: built
            direction: down
            facts:
              summary: "Point 4: six checks in order on every proposed action; the first that fails decides."
              how: "Outcomes: output (L0–1), needs-approval (L2), within-bounds (L3), handoff, or rejected with a code."
              api: "`framework/src/wardens/guardrails/autonomy.py:91`"
            children:
              - {id: ca_fn, label: check_action(action), icon: function, status: built,
                 facts: {summary: "Entry: takes the proposed-action content, the manifest, the task's capability and level ceiling.", how: "Returns an ActionDecision; the caller records action_decision.", api: "`autonomy.py:91`"}}
              - {id: ca_catalog, label: In the catalog, icon: check, status: built,
                 facts: {summary: "The action must be in the manifest's actionCatalog.", how: "Code undeclared_action (principle 7).", api: "`autonomy.py:96`"}}
              - {id: ca_level, label: Catalog level, icon: check, status: built,
                 facts: {summary: "The action's level must equal the catalog's level for it.", how: "Code level_mismatch.", api: "`autonomy.py:99`"}}
              - {id: ca_ceiling, label: Under the ceiling, icon: check, status: built,
                 facts: {summary: "Level must not exceed min(task maxAutonomyLevel, framework ceiling).", how: "Code autonomy.", api: "`autonomy.py:103`"}}
              - {id: ca_goal, label: No goal drift, icon: check, status: built,
                 facts: {summary: "The task's capability must be one this agent serves.", how: "Code goal_drift.", api: "`autonomy.py:106`"}}
              - {id: ca_owner, label: Owner's domain, icon: check, status: built,
                 facts: {summary: "A resource owned by another domain becomes a handoff, not an action.", how: "Ownership map; code ownership (decision 0011).", api: "`autonomy.py:111`"}}
              - {id: ca_l2, label: L2+ needs an owner, icon: check, status: built,
                 facts: {summary: "A level 2 or 3 action needs the target in the ownership map.", how: "Code no_owner; at L1 an unmapped target is allowed as output only.", api: "`autonomy.py:113`"}}
          - id: w_check_tool
            label: check_tool_call()
            sub: "point 2 · tool_calls.py"
            icon: shield
            status: built
            direction: down
            facts:
              summary: "Point 2: four checks on every tool call a model asks for; the first that fails refuses it."
              how: "Records guardrail_decision(agent, \"tool\", allowed, code) for every call."
              api: "`framework/src/wardens/guardrails/tool_calls.py:38`"
            children:
              - {id: tc_fn, label: check_tool_call(name, args), icon: function, status: built,
                 facts: {summary: "Entry: the tool name, its arguments, the caller (llm or code) and the declared parameters.", how: "Returns a ToolDecision.", api: "`tool_calls.py:38`"}}
              - {id: tc_declared, label: Declared tool, icon: check, status: built,
                 facts: {summary: "The tool must be in the manifest's tools.", how: "Code undeclared_tool.", api: "`tool_calls.py:50`"}}
              - {id: tc_act, label: Not an act tool, icon: check, status: built,
                 facts: {summary: "A model may never call an act tool; only a deterministic stage may.", how: "Code act_from_llm.", api: "`tool_calls.py:53`"}}
              - {id: tc_params, label: Declared parameters, icon: check, status: built,
                 facts: {summary: "No argument outside the tool's schema.", how: "Code undeclared_parameters.", api: "`tool_calls.py:55`"}}
              - {id: tc_bounds, label: Inside the bounds, icon: check, status: built,
                 facts: {summary: "Each bounded argument must be inside the manifest's bounds for it.", how: "Code out_of_scope.", api: "`tool_calls.py:60`"}}
          - id: w_circuit
            label: CircuitBreaker
            sub: "circuit.py"
            icon: bolt
            status: built
            facts:
              summary: "Stops calling a failing dependency: open after 5 failures in a row, one trial after 60 s."
              how: "CircuitOpen is raised at once while open, so the stage takes its fallback without waiting on timeouts."
              api: "`framework/src/wardens/guardrails/circuit.py:39`"

      - id: w_llm
        label: wardens.llm
        icon: cpu
        status: built
        facts:
          summary: "The only way to a model: endpoint and breaker, prices and usage limits, guarded tools, call records."
          how: "Pydantic AI models pointed at LiteLLM; the agent never holds a key or a provider SDK."
          api: "`framework/src/wardens/llm/`"
        children:
          - id: w_providers
            label: providers.py
            icon: file
            status: built
            facts:
              summary: "Builds the model from the environment and wraps it in the agent's breaker."
              how: "model_from_env → model_from_config → with_breaker when agent= is given."
              api: "`framework/src/wardens/llm/providers.py`"
            children:
              - id: w_mfe
                label: model_from_env()
                icon: function
                status: built
                facts:
                  summary: "The model an agent uses: the LiteLLM endpoint and deployment from the environment."
                  how: "With agent=, wraps it in BreakerModel; without it (stack-author today), no breaker."
                  api: "`framework/src/wardens/llm/providers.py:128`"
              - id: w_breaker
                label: BreakerModel
                icon: bolt
                status: built
                facts:
                  summary: "A model whose every request goes through the agent's `model` circuit breaker."
                  how: "request and request_stream run inside breaker.guard()."
                  api: "`framework/src/wardens/llm/providers.py:134`"
          - id: w_limits
            label: limits.py
            icon: file
            status: built
            facts:
              summary: "Cost and tool safety for LLM stages."
              how: "Prices from prices.yaml; tools filtered and checked per call."
              api: "`framework/src/wardens/llm/limits.py`"
            children:
              - id: w_price
                label: require_price()
                icon: function
                status: built
                facts:
                  summary: "Refuses, at worker start, a model prices.yaml doesn't price: no unbounded turns."
                  how: "Raises UnpricedModelError."
                  api: "`framework/src/wardens/llm/limits.py:47`"
              - id: w_usage
                label: usage_limits()
                icon: function
                status: built
                facts:
                  summary: "Turns the remaining budget into Pydantic AI usage limits for one run."
                  how: "No budget left raises CostCeilingReached; a free model gets only a request limit; tokens priced at the dearer rate."
                  api: "`framework/src/wardens/llm/limits.py:57`"
              - id: w_guarded
                label: GuardedToolset
                icon: shield
                status: built
                facts:
                  summary: "Wraps a stage's tools: hides undeclared ones and runs point 2 on every call."
                  how: "Refusal → ModelRetry JSON (and an audit event when given an audit log); execute_tool span with redacted args; results capped at 20,000 characters."
                  api: "`framework/src/wardens/llm/limits.py:78`"
              - id: w_read_tools
                label: read_tools()
                icon: function
                status: built
                facts:
                  summary: "The manifest's read tools this stage may use, with their parameter names."
                  how: "Act tools are never included."
                  api: "`framework/src/wardens/llm/limits.py:138`"
          - id: w_model_call
            label: model_call()
            sub: "llm/__init__.py"
            icon: function
            status: built
            facts:
              summary: "Records one model call for the run record: stage, model, prompt version, tokens, or the failure."
              how: "Called with result=None when the stage fell back."
              api: "`framework/src/wardens/llm/__init__.py:24`"
          - id: w_mcp
            label: mcp_toolset()
            sub: "mcp.py"
            icon: search
            status: built
            facts:
              summary: "Loads MCP tools through LiteLLM with pinned definition hashes. Built, but no agent stage calls it yet."
              how: "check_pins refuses a missing or changed definitionSha256; gateway headers carry x-wardens-run and traceparent."
              api: "`framework/src/wardens/llm/mcp.py:126`"

      - id: w_tele
        label: wardens.telemetry
        icon: chart
        status: built
        facts:
          summary: "Run records, redaction, OpenTelemetry export and the guardrail metrics."
          how: "Everything that leaves the process is redacted first."
          api: "`framework/src/wardens/telemetry/`"
        children:
          - id: w_brr
            label: build_run_record()
            icon: file
            status: built
            facts:
              summary: "Builds the run record: priced model calls, redacted evidence and parameters, then a schema check."
              how: "redact_text on evidence, redact(classification) on parameters, validate(\"run-record\")."
              api: "`framework/src/wardens/telemetry/run_record.py:144`"
          - id: w_redact
            label: redact()
            icon: lock
            status: built
            facts:
              summary: "Masks secrets and personal data in any value before it is stored or exported."
              how: "Built-in patterns plus the classification's extra patterns."
              api: "`framework/src/wardens/telemetry/redact.py:52`"
          - id: w_export
            label: export_run()
            icon: chart
            status: built
            facts:
              summary: "Exports the run record as spans and metrics to the OpenTelemetry collector."
              how: "One root span per run with action events; run metrics by capability."
              api: "`framework/src/wardens/telemetry/otel.py:76`"
          - id: w_metrics
            label: metrics
            icon: chart
            status: built
            views: [evidence]
            facts:
              summary: "Guardrail, kill switch, breaker and handoff counters, one helper per decision."
              how: "action_decision, guardrail_decision, killswitch_observed, handoff_planned, run_record_fallback …"
              api: "`framework/src/wardens/telemetry/metrics.py`"

      - id: w_state
        label: wardens.state
        icon: database
        status: built
        facts:
          summary: "Postgres-backed stores, each with a file fallback: run records, kill switch, memory, audit log."
          how: "WARDENS_STATE_DSN picks Postgres; without it the file stores are used."
          api: "`framework/src/wardens/state/postgres.py`"
        children:
          - id: w_sink
            label: record_sink()
            sub: "PostgresRecordSink"
            icon: database
            status: built
            facts:
              summary: "Writes run records to Postgres, falling back to the file sink when the database is unreachable."
              how: "OperationalError → file sink and run_record_fallback metric."
              api: "`framework/src/wardens/state/postgres.py:131`"
          - id: w_ks_store
            label: kill_switch()
            sub: "AnyKillSwitch"
            icon: lock
            status: built
            facts:
              summary: "The switch is engaged when either the Git file or the database row says so."
              how: "Agent-specific row or `all`."
              api: "`framework/src/wardens/state/postgres.py:354`"
          - id: w_memory
            label: memory_store()
            icon: database
            status: built
            facts:
              summary: "Per-agent long-term memory with expiry."
              how: "Postgres table; file store without a DSN."
              api: "`framework/src/wardens/state/postgres.py:369`"

      - id: w_handoff
        label: wardens.handoff
        icon: users
        status: built
        facts:
          summary: "Plans a child task for another agent, or refuses with every reason."
          how: "Default deny: only pairs in framework/config/handoff.yaml are allowed."
          api: "`framework/src/wardens/handoff/policy.py`"
        children:
          - id: w_plan_child
            label: plan_child_task()
            icon: users
            status: built
            direction: down
            facts:
              summary: "Eight checks; every one runs and all reasons are collected. Then caps level and cost and validates the task schema."
              how: "Child: same correlationId, parentTaskId, level ≤ parent and target, cost = min(share, target ceiling), hopBudget − 1."
              api: "`framework/src/wardens/handoff/policy.py:56`"
            children:
              - {id: h_fn, label: plan_child_task(), icon: function, status: built,
                 facts: {summary: "Entry: parent task, chain, the finding, the target capability, spent and cost share.", how: "Raises HandoffRefused with every code, or returns the child task.", api: "`policy.py:56`"}}
              - {id: h_pair, label: Pair allowed, icon: check, status: built,
                 facts: {summary: "source → target must be enabled in handoff.yaml (default deny).", how: "Code pair_not_allowed.", api: "`policy.py:71`"}}
              - {id: h_route, label: Routable agent, icon: check, status: built,
                 facts: {summary: "The registry must resolve the capability to a routable agent.", how: "Code no_routable_agent.", api: "`policy.py:74`"}}
              - {id: h_hops, label: Hop budget, icon: check, status: built,
                 facts: {summary: "The parent must have hops left.", how: "Code hop_budget.", api: "`policy.py:78`"}}
              - {id: h_cycle, label: No cycle, icon: check, status: built,
                 facts: {summary: "The target capability must not already be on the chain.", how: "Code cycle.", api: "`policy.py:81`"}}
              - {id: h_verified, label: Verified finding, icon: check, status: built,
                 facts: {summary: "The finding that suggested it must have passed verification.", how: "Code unverified.", api: "`policy.py:84`"}}
              - {id: h_cost, label: Cost share, icon: check, status: built,
                 facts: {summary: "The share must be above zero and within what the parent has left.", how: "Code cost_share.", api: "`policy.py:88`"}}
              - {id: h_deadline, label: Deadline, icon: check, status: built,
                 facts: {summary: "The parent's deadline must not have passed.", how: "Code deadline.", api: "`policy.py:92`"}}
              - {id: h_inputs, label: Valid inputs, icon: check, status: built,
                 facts: {summary: "The inputs must match the target capability's input schema.", how: "Code invalid_inputs.", api: "`policy.py:95`"}}

      - id: w_notify
        label: Notifier.send()
        sub: "wardens.notify"
        icon: bell
        status: built
        facts:
          summary: "Sends the run's message to the channels configured for its audience."
          how: "Slack incoming webhook; URLs from OpenBao through framework/config/notify.yaml."
          api: "`framework/src/wardens/notify/channels.py:370`"

  - id: pydai
    label: Pydantic AI
    sub: "Agent.run"
    icon: package
    status: external
    facts:
      summary: "The agent loop library: sends the prompt, calls tools the model asks for, validates the output and retries."
      how: "Output validators raise ModelRetry to ask the model again; usage limits stop the run."
      url: {Docs: "https://ai.pydantic.dev"}

  - id: temporal
    label: Temporal
    icon: queue
    status: built
    facts:
      summary: "Runs workflows durably: each activity's result is saved, so a crashed worker resumes at the next step."
      how: "Workers poll their task queue over gRPC; schedules start the incident workflow."
      api: "`temporal-frontend.temporal.svc:7233`"

  - id: litellm
    label: LiteLLM
    icon: api
    status: built
    facts:
      summary: "The model gateway: OpenAI-compatible endpoint in front of the homelab's vLLM models."
      how: "One virtual key per agent with its own budget."
      api: "`https://llm.ai.home.cloudutsuk.com/v1`"

  - id: statedb
    label: wardens-state-db
    icon: database
    status: built
    facts:
      summary: "Postgres for run records, kill switch rows, memory and the audit log."
      how: "In the wardens cluster; each agent has its own role."
      api: "`wardens-state-db.wardens-state-db.svc:5432/wardens`"

  - id: github
    label: GitHub
    icon: devops/cicd/github-18.svg
    status: external
    facts:
      summary: "The IaC repositories the agents read and the draft PRs they open; also sends the drift scan's webhook."
      how: "Each agent's GitHub App mints installation tokens."
      api: "`https://api.github.com`"

  - id: slack
    label: Slack
    icon: miscellaneous/slack-18.svg
    status: external
    facts:
      summary: "Where people read each run's message."
      how: "Incoming webhook per audience."
      api: "`https://hooks.slack.com/services/…`"

  - id: collector
    label: OTel collector
    icon: chart
    status: built
    facts:
      summary: "Receives the run's spans and metrics and sends them to the mon cluster."
      how: "OTLP gRPC from every worker."
      api: "`http://agent-collector.monitoring.svc:4317`"

edges:
  # --- worker start-up ---
  - {id: rw_model, from: d_run_worker, to: d_model, kind: request, label: _model(), view: llm, main: true,
     why: "At worker start: the model is built once and shared by both LLM stages.", certs: {none: "In-process Python call."}}
  - {id: model_mfe, from: d_model, to: w_mfe, kind: request, label: model_from_env(agent=), view: llm, main: true,
     why: "At worker start: the agent gets its model only through wardens.llm, pointed at LiteLLM.", certs: {none: "In-process Python call."}}
  - {id: mfe_breaker, from: w_mfe, to: w_breaker, kind: control, label: with_breaker(), view: [llm, guardrails],
     why: "When agent= is given: every model request will go through the agent's breaker.", certs: {none: "In-process Python call."}}
  - {id: breaker_circuit, from: w_breaker, to: w_circuit, kind: control, label: breaker.guard(), view: [llm, guardrails],
     why: "On every model request: the breaker counts failures and opens after 5.", certs: {none: "In-process Python call."}}
  - {id: model_price, from: d_model, to: w_price, kind: control, label: require_price(), view: llm, main: true,
     why: "At worker start: a model without a price is refused, so every run has a cost limit.", certs: {none: "In-process Python call."}}
  - {id: rw_ks, from: d_run_worker, to: w_ks_store, kind: request, label: kill_switch(), view: guardrails, main: true,
     why: "At worker start: the activities get the switch that reads both the Git file and the database row.", certs: {none: "In-process Python call."}}
  - {id: rw_sink, from: d_run_worker, to: w_sink, kind: request, label: record_sink(), view: evidence, main: true,
     why: "At worker start: where this agent's run records go.", certs: {none: "In-process Python call."}}
  - {id: rw_bind, from: d_run_worker, to: w_bind, kind: request, label: bind_activities(),
     why: "At worker start: the agent's methods become activities, plus record_run and notify.", certs: {none: "In-process Python call."}}
  - {id: rw_cw, from: d_run_worker, to: w_create_worker, kind: request, label: create_worker(),
     why: "At worker start: one worker for the agent's queue.", certs: {none: "In-process Python call."}}
  - {id: rw_sync, from: d_run_worker, to: w_sync, kind: request, label: sync_schedules(),
     why: "At worker start: Temporal's schedules are made to match the manifest.", certs: {none: "In-process Python call."}}
  - {id: cw_t, from: w_create_worker, to: temporal, proto: gRPC, port: 7233, label: poll queue,
     why: "Always on: the worker polls its task queue for workflow and activity tasks.",
     certs: {none: "Plain gRPC inside the wardens cluster; a NetworkPolicy admits only labelled namespaces."}}
  - {id: sync_t, from: w_sync, to: temporal, proto: gRPC, port: 7233, label: schedules,
     why: "At worker start: create or update each schedule.", certs: {none: "Plain gRPC inside the wardens cluster."}}

  # --- entry and point 1 ---
  - {id: gh_hook, from: github, to: w_gh_hook, proto: Webhook, port: 443, tls: true, label: workflow_job,
     why: "Used when the drift scan's job finishes: the signed delivery reaches the receiver through Cloudflare and Traefik.", certs: cf-edge,
     detail: "The hops between (Cloudflare tunnel, Traefik, the Event Hubs bus) are drawn in the wardens-platform diagram."}
  - {id: hook_build, from: w_gh_hook, to: w_console, kind: request, label: Console.build(),
     why: "Used for a delivery a DriftRule matches: the root task is built in one shared place.", certs: {none: "In-process Python call."}}
  - {id: build_entry, from: w_console, to: w_entry, kind: request, label: create_root_task(),
     why: "Every Console.build: the channel's policy sets deadline, level, cost and hops.", certs: {none: "In-process Python call."}}
  - {id: build_sub, from: w_console, to: w_check_sub, kind: control, label: point 1, view: guardrails,
     why: "Every Console.build: guardrail point 1 checks the task against the agent's manifest.", certs: {none: "In-process Python call."}}
  - {id: hook_t, from: w_gh_hook, to: temporal, proto: gRPC, port: 7233, label: start incident,
     why: "Used once the task is built: starts the incident workflow with an id from the delivery, so a repeat is refused.", certs: {none: "Plain gRPC inside the wardens cluster."}}
  - {id: t_make_task, from: temporal, to: w_make_task, proto: gRPC, port: 7233, label: make_task,
     why: "Used when a schedule fires: the schedule workflow asks for the root task as an activity.", certs: {none: "Plain gRPC inside the wardens cluster."}}
  - {id: make_entry, from: w_make_task, to: w_entry, kind: request, label: create_root_task(),
     why: "Used for each schedule fire: channel schedule. No check_submission follows on this path (stated gap).", certs: {none: "In-process Python call."}}
  - {id: t_inc, oneway: true, from: temporal, to: w_inc_run, proto: gRPC, port: 7233, label: incident workflow,
     why: "Used for scheduled and webhook work: the incident workflow task goes to the worker.", certs: {none: "Plain gRPC inside the wardens cluster."}}

  # --- the workflow calls an activity ---
  - {id: inc_run, from: w_inc_run, to: d_run, kind: request, label: child workflow,
     why: "Used for every incident: the agent's own workflow runs as a child, under _run_agent.", certs: {none: "In-process inside the worker; the child start goes through Temporal."}}
  - {id: run_proxy, from: d_run, to: w_proxy, kind: request, label: acts.x(),
     why: "Every time the workflow needs a side effect: the call goes to the proxy, never to the network.", certs: {none: "In-process Python call."}}
  - {id: proxy_t, from: w_proxy, to: temporal, proto: gRPC, port: 7233, label: execute_activity,
     why: "Every activity: Temporal saves the request and the result, so a crash resumes at the next step.", certs: {none: "Plain gRPC inside the wardens cluster."}}
  - {id: t_bind, from: temporal, to: w_bind, proto: gRPC, port: 7233, label: activity task,
     why: "Every activity: the worker's poller takes the task (drawn in the direction the task travels).", certs: {none: "Plain gRPC inside the wardens cluster."}}
  - {id: bind_ks, from: w_bind, to: d_ks, kind: request, label: kill_switch_engaged(), view: guardrails, main: true,
     why: "Before each stack and each write: the bound activity runs the agent's method.", certs: {none: "In-process Python call."}}
  - {id: ks_is, from: d_ks, to: w_is_engaged, kind: control, label: is_engaged(), view: guardrails, main: true,
     why: "Every kill switch check: the framework decides, failing closed.", certs: {none: "In-process Python call."}}
  - {id: is_store, from: w_is_engaged, to: w_ks_store, kind: control, label: engaged(), view: guardrails,
     why: "Every kill switch check: the Git file or the database row for this agent or all.", certs: {none: "In-process Python call."}}
  - {id: store_db, from: w_ks_store, to: statedb, proto: PostgreSQL, port: 5432, view: guardrails,
     why: "Every kill switch check: reads the switch rows.", certs: {none: "Plain PostgreSQL inside the wardens cluster; per-agent role."}}

  # --- analysis and the LLM stages ---
  - {id: bind_analyse, from: w_bind, to: d_analyse, kind: request, label: analyse(),
     why: "Once per stack: the bound activity runs the analysis.", certs: {none: "In-process Python call."}}
  - {id: analyse_stack, from: d_analyse, to: d_analyse_stack, kind: request, label: analyse_stack(),
     why: "Once per stack: the pipeline runs inside the activity.", certs: {none: "In-process Python call."}}
  - {id: stack_attr, from: d_analyse_stack, to: d_attr, kind: request, label: attribute_changes(), view: llm, main: true,
     why: "Before any prompt: sensitive values are replaced.", certs: {none: "In-process Python call."}}
  - {id: stack_classify, from: d_analyse_stack, to: d_classify, kind: request, label: classify(), view: llm, main: true,
     why: "Once per stack: the model classifies each changed attribute.", certs: {none: "In-process Python call."}}
  - {id: classify_pyd, from: d_classify, to: pydai, kind: request, label: agent.run(), view: llm, main: true,
     why: "Each classify: typed output, 2 retries, 4 requests and 60,000 tokens at most.", certs: {none: "In-process Python call."}}
  - {id: pyd_breaker, from: pydai, to: w_breaker, kind: request, label: request(), view: llm, main: true,
     why: "Each model request of terraform-drift: through the breaker.", certs: {none: "In-process Python call."}}
  - {id: breaker_lite, from: w_breaker, to: litellm, proto: HTTPS, port: 443, view: llm, main: true,
     why: "Each model request: OpenAI-compatible chat completion through LiteLLM to vLLM.", certs: le-home,
     detail: "The agent's LiteLLM virtual key is the bearer token."}
  - {id: classify_mc, from: d_classify, to: w_model_call, kind: data, label: model_call(), view: [llm, evidence],
     why: "After every classify, success or fallback: the call is recorded for the run record.", certs: {none: "In-process Python call."}}
  - {id: stack_gate, from: d_analyse_stack, to: d_gate, kind: control, label: evaluate(), view: guardrails, main: true,
     why: "Per proposal: the deterministic gate decides, not the model.", certs: {none: "In-process Python call."}}
  - {id: stack_rationale, from: d_analyse_stack, to: d_rationale, kind: request, label: rationale(), view: llm, main: true,
     why: "Per proposal the gate decided: one short explanation.", certs: {none: "In-process Python call."}}
  - {id: rationale_pyd, from: d_rationale, to: pydai, kind: request, label: agent.run(), view: llm, main: true,
     why: "Per explanation: 2 requests and 20,000 tokens at most.", certs: {none: "In-process Python call."}}
  - {id: classify_mcp, from: d_classify, to: w_mcp, kind: request, label: planned,
     why: "Planned: drift's manifest declares web search, but no stage calls mcp_toolset yet; stack-author's chat is next.",
     certs: {planned: "Planned: through LiteLLM /mcp with pinned tool hashes."}}

  # --- point 4 and the draft PR ---
  - {id: bind_emit, from: w_bind, to: d_emit, kind: request, label: emit(),
     why: "Once per stack with proposals: artifacts are built and checked.", certs: {none: "In-process Python call."}}
