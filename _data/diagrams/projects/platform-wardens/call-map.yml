scenarios:
  - id: startup
    title: Worker start-up
    summary: "What run_worker wires before any task arrives: a priced model behind a breaker, the kill switch, the sinks, the binding, the queue and schedules."
    steps:
      - {title: Worker starts, action: "terraform-drift worker.py: run_worker() starts", lights: [d_run_worker],
         text: "The container's entry point. Everything the agent needs from wardens is wired here, once."}
      - title: Model behind a breaker
        action: "_model() → model_from_env(agent=) → with_breaker → CircuitBreaker"
        path: [rw_model, model_mfe, mfe_breaker, breaker_circuit, ~breaker_circuit, ~mfe_breaker, ~model_mfe]
        text: "The model comes only from wardens.llm, pointed at LiteLLM, and every request will go through the agent's breaker."
        detail: |
          `model_from_env` reads the endpoint and deployment from the environment; the agent holds no key and no provider SDK.
          Because `agent=` is given, `with_breaker` wraps it in `BreakerModel`, using the process-wide `model` breaker for this agent.
          The breaker opens after 5 failures in a row and lets one trial through after 60 s. While open, a stage gets `CircuitOpen` at once and takes its fallback.
          stack-author calls `model_from_env` without `agent=`, so its model has no breaker today.
      - title: Refuse an unpriced model
        action: "_model() → require_price(): is the model in prices.yaml?"
        path: [model_price, ~model_price, ~rw_model]
        text: "A model prices.yaml doesn't price stops the worker, so every later run can be held to a cost limit."
        detail: |
          `require_price` raises `UnpricedModelError` at start-up instead of letting a run spend without a limit.
          Later, `usage_limits` turns the task's remaining dollars into token and request limits using the same prices.
          This is why a new model is added to `prices.yaml` before any agent can use it.
      - {title: Kill switch and sink, action: "run_worker() → kill_switch() and record_sink()", path: [rw_ks, ~rw_ks, rw_sink, ~rw_sink],
         text: "The activities get a switch that reads the Git file and the database row, and the sink run records go to."}
      - {title: Bind the activities, action: "run_worker() → bind_activities(sink, prices, notifier, audit)", path: [rw_bind, ~rw_bind],
         text: "Each DriftActivities method becomes a Temporal activity with its timeout and retries, plus record_run and notify."}
      - {title: Poll the queue, action: "create_worker() ↔ Temporal: poll terraform-drift (gRPC 7233)", path: [rw_cw, cw_t, ~cw_t, ~rw_cw],
         text: "The worker registers IncidentWorkflow, the drift workflow and every bound activity on its own queue."}
      - {title: Sync the schedules, action: "sync_schedules() ↔ Temporal: one schedule per manifest entry", path: [rw_sync, sync_t, ~sync_t, ~rw_sync],
         text: "Temporal's schedules now match the manifest; each fire starts the incident workflow.",
         result: success, outcome: "Worker ready, guardrails wired"}

  - id: entry
    title: A task enters (point 1)
    summary: "How a root task is built and checked before any workflow starts, and the schedule path that skips the check today."
    modes: [{id: webhook, label: GitHub webhook}, {id: schedule, label: Schedule fires}]
    steps:
      - {title: Scan job finished, action: "GitHub → GitHub Receiver: workflow_job delivery (443)", when: webhook, path: [gh_hook],
         text: "Signed with X-Hub-Signature-256 and checked before the body is parsed; a DriftRule must match."}
      - {title: Build the root task, action: "Receiver → Console.build() → create_root_task()", when: webhook, path: [hook_build, build_entry, ~build_entry],
         text: "The channel's policy sets the deadline, autonomy level, cost limit and hop budget of the task."}
      - title: Guardrail point 1
        action: "Console.build() → check_submission(task, manifest)"
        when: webhook
        path: [build_sub, ~build_sub]
        text: "The task is checked against the agent's manifest before any workflow exists."
        detail: |
          `check_submission` collects every reason, not just the first:
          - the capability must be in the manifest (`undeclared_capability`);
          - `maxAutonomyLevel` must not exceed the agent's highest granted level or the framework ceiling (`autonomy`);
          - `costLimitUsd` must not exceed `costCeiling.perRunUsd` (`cost_ceiling`);
          - the agent must not be quarantined.
          A refusal raises `Refused`, records `submission_decision` and an entry span; the webhook answers 422 and nothing starts.
      - {title: Start the incident, action: "Receiver ↔ Temporal: start with an id from the delivery; 2xx to GitHub", when: webhook, path: [~hook_build, hook_t, ~hook_t, ~gh_hook],
         text: "A repeated delivery gets the same workflow id, so Temporal refuses the duplicate.",
         result: success, outcome: "Checked task started"}
      - {title: Schedule fires, action: "Temporal: terraform-drift's daily schedule fires", when: schedule, lights: [temporal],
         text: "The schedule workflow asks for the root task as an activity, because building it reads config files."}
      - title: Task without point 1
        action: "make_task() → create_root_task(channel=schedule)"
        when: schedule
        path: [t_make_task, make_entry, ~make_entry, ~t_make_task]
        text: "The task is built from the schedule channel's policy, but check_submission is not called on this path."
        detail: |
          `make_task` calls `create_root_task` directly, not `Console.build`, so guardrail point 1 does not run for scheduled tasks.
          The schedule's own values come from the agent's manifest, so in practice they stay inside it, but nothing checks that.
          This is a stated gap: point 1 covers the console, webhooks and routing, not schedules.
          Points 2 and 4 and the kill switch still apply inside the run.
      - {title: Incident starts, action: "Temporal → IncidentWorkflow.run() on the agent's queue", when: schedule, path: [t_inc],
         text: "The run goes ahead with the kill switch and points 2 and 4 still in place.",
         result: done, outcome: "Started; point 1 not run (gap)"}

  - id: killswitch
    title: Kill switch before a write
    summary: "One call from the workflow to the kill switch, through Temporal, the binding, the agent's activity and wardens' fail-closed check."
    modes: [{id: released, label: Switch released}, {id: engaged, label: Switch engaged}]
    steps:
      - {title: Workflow needs a write, action: "workflow.run(): next stack, so check the switch first", lights: [d_run],
         text: "The drift workflow runs as a child; before each stack and each write it asks for the kill switch."}
      - title: Call becomes an activity
        action: "run() → acts.kill_switch_engaged() → _ActivityProxy → Temporal"
        path: [run_proxy, proxy_t]
        text: "The workflow only decides; the proxy turns the call into a Temporal activity, so a crash resumes here."
        detail: |
          Inside a workflow `acts` is `_ActivityProxy`, not the real `DriftActivities`.
          `__getattr__` turns `kill_switch_engaged()` into `workflow.execute_activity("terraform-drift.kill_switch_engaged")` with the binding's timeout and retry policy.
          Temporal saves the request and, later, the result. A worker that crashes resumes at the next step without repeating finished ones.
          Each call is also logged as an `ActivityRecord` for the run record.
      - {title: Worker runs it, action: "Temporal → bind_activities wrapper → DriftActivities.kill_switch_engaged()", path: [t_bind, bind_ks],
         text: "The worker's activity poller takes the task and runs the agent's method."}
      - title: Fail-closed read
        action: "is_engaged() → AnyKillSwitch ↔ wardens-state-db (5432)"
        path: [ks_is, is_store, store_db, ~store_db, ~is_store]
        text: "The switch is read from the Git file and the database row for this agent or all; an error counts as engaged."
        detail: |
          `is_engaged(switch, agent)` is the only kill switch check agents use.
          `AnyKillSwitch` is engaged when either the Git file or the Postgres row says so, for this agent or for `all`.
          Any exception while reading is treated as engaged: the agent stops rather than writes blind.
          Every read records `killswitch_observed`, so Grafana shows how often each agent checked and what it saw.
      - {title: Answer returns, action: "is_engaged() → activity → Temporal → workflow: engaged or not", path: [~ks_is, ~bind_ks, ~t_bind, ~proxy_t, ~run_proxy],
         text: "The result is saved in the workflow's history, so a replay sees the same answer."}
      - {title: Go ahead, action: "run(): released, so analyse, emit and open the PR", when: released, lights: [d_run],
         text: "The tool checks the switch once more right before the write itself.",
         result: success, outcome: "Released: the write may go ahead"}
      - {title: Stop, action: "run(): engaged, so stop before the next write", when: engaged, lights: [d_run],
         text: "Nothing more is written; the run record still says why it stopped.",
         result: done, outcome: "Engaged: run stops, nothing written"}

  - id: classify
    title: Classify drift with the model
    summary: "The LLM stage inside analyse: redaction, typed output, a validator, usage limits, the breaker, a recorded call and a deterministic fallback; the gate still decides."
    modes: [{id: ok, label: Model answers}, {id: down, label: Model failing}]
    steps:
      - {title: Analyse one stack, action: "bind_activities → analyse() → analyse_stack()", path: [bind_analyse, analyse_stack],
         text: "The analysis runs in one activity per stack; a failure in one stack doesn't stop the others."}
      - title: Redact first
        action: "analyse_stack() → attribute_changes(): sensitive values replaced"
        path: [stack_attr, ~stack_attr]
        text: "Changed attributes are listed with sensitive values replaced before anything reaches a prompt."
        detail: |
          `attribute_changes` reads the plan's drift for one resource and returns one change per attribute.
          An attribute Terraform marks sensitive becomes `(sensitive value)`, so no secret reaches the model, the run record or a PR.
          The scan's evidence is wrapped in the prompt as `<evidence>` and labelled untrusted data, not instructions.
      - title: Ask the model
        action: "classify() → agent.run() → BreakerModel → LiteLLM (443)"
        path: [stack_classify, classify_pyd, pyd_breaker]
        text: "Typed output (ClassifyOutput), 2 retries, at most 4 requests and 60,000 tokens."
        detail: |
          `Agent(output_type=ClassifyOutput, retries=2)` makes the model answer in a schema, not free text.
          `USAGE_LIMITS` caps the stage at 4 requests and 60,000 tokens, whatever the model does.
          The request goes through `BreakerModel`, so a failing endpoint is noticed after 5 failures and later requests fail fast.
      - title: Validated answer
        when: ok
        action: "LiteLLM → BreakerModel → output validator _check → classify()"
        path: [breaker_lite, ~breaker_lite, ~pyd_breaker, ~classify_pyd]
        text: "The validator checks the verdicts cover every changed attribute exactly once and invent no change record."
        detail: |
          The `@agent.output_validator` `_check` compares the answer with the input, in code.
          A missing or repeated (address, attribute) pair, or a change record that isn't in the evidence, raises `ModelRetry` with the reason.
          The model then answers again, up to 2 retries; after that the stage takes its fallback.
      - {title: Breaker or timeout, action: "BreakerModel: CircuitOpen or a failed request", when: down, path: [breaker_circuit, ~breaker_circuit, ~pyd_breaker, ~classify_pyd],
         text: "After 5 failures in a row the breaker is open: the next request fails at once instead of waiting on a timeout."}
      - {title: Record the call, action: "classify() → model_call(result=…) for the run record", path: [classify_mc, ~classify_mc],
         text: "Model, prompt version and tokens, or the failure, are recorded either way."}
      - title: Fallback
        when: down
        action: "classify() → fallback: every attribute unknown → gate says investigate"
        path: [~stack_classify, stack_gate, ~stack_gate, ~analyse_stack, ~bind_analyse]
        text: "Any exception gives every attribute the verdict unknown, which the gate turns into investigate."
        detail: |
          `fallback(changes, reason)` returns `unknown` for each attribute; the run goes on without the model.
          `gate.evaluate` is deterministic: unknown never becomes a draft PR, only an investigate finding.
          So a model outage lowers the quality of the explanation, never the safety of the output.
        result: done
        outcome: "Model down: investigate, nothing proposed"
      - {title: Gate decides, action: "analyse_stack() → gate.evaluate(): investigate, codify or revert", when: ok, path: [~stack_classify, stack_gate, ~stack_gate],
         text: "Deterministic policy on secrets, scope and the verdicts; the model never decides what is proposed."}
      - {title: Explain it, action: "rationale() → agent.run(): one short explanation", when: ok, path: [stack_rationale, rationale_pyd, ~rationale_pyd, ~stack_rationale, ~analyse_stack, ~bind_analyse],
         text: "At most 2 requests and 20,000 tokens; on failure a fixed default sentence.",
         result: success, outcome: "Proposals decided by the gate"}

  - id: point4
    title: Point 4 and the draft PR
    summary: "emit runs check_action on every proposed action; only then does the tool open the draft PR, after one more kill switch read."
    modes: [{id: allowed, label: Allowed}, {id: refused, label: Not in the catalog}]
    steps:
      - {title: Emit the findings, action: "bind_activities → emit(analysis, task, now)", path: [bind_emit],
         text: "The analysis becomes artifacts: a finding and a proposed action per proposal."}
      - title: Checks 1 to 3
        when: allowed
        action: "emit() → check_action(): catalog, level, ceiling"
        path: [emit_ca, ca1, ca2, ca3]
        text: "The action must be declared, at its catalog level, and under the task's and framework's ceiling."
        detail: |
          `check_action` runs six checks in order and returns at the first that fails:
          1. the action is in the manifest's `actionCatalog` (`undeclared_action`);
          2. its level equals the catalog's (`level_mismatch`);
          3. its level is at most min(task `maxAutonomyLevel`, framework ceiling) (`autonomy`).
          A draft PR is a level 1 action: output only, a person merges it.
      - title: Checks 4 to 6
        when: allowed
        action: "check_action(): goal drift, ownership, L2+ owner → decision"
        path: [ca4, ca5, ca6, ca_done]
        text: "The agent must serve the task, the target must be in its domain, and level 2+ needs a mapped owner."
        detail: |
          4. the task's capability is one this agent serves (`goal_drift`);
          5. a target owned by another domain becomes a `handoff`, not an action (`ownership`, decision 0011);
          6. a level 2 or 3 action needs its target in the ownership map (`no_owner`).
          Passed at level 1, the outcome is `output`; level 2 would be `needs-approval`, level 3 `within-bounds`.
      - {title: Count the decision, action: "emit() → action_decision() metric", when: allowed, path: [~emit_ca, emit_metric],
         text: "Every decision is counted by outcome and code, so refusals show up in Grafana."}
      - title: Open the draft PR
        when: allowed
        action: "open_draft_pr() → GitHubWriter → is_engaged() again"
        path: [~bind_emit, bind_openpr, openpr_writer, writer_is, ~writer_is]
        text: "The only write: drift/ branch never main, same patch hash, and the kill switch read right before it."
        detail: |
          The workflow checked the kill switch before calling the activity; the tool checks it again just before writing.
          The branch must start with the drift prefix and is never `main` or the default branch.
          An open PR for the same key is reused, so a retry never opens a second one; `patchSha256` is checked again.
          `DraftPrRefused` and `ScopeError` are not retried.
      - {title: Draft PR on GitHub, action: "GitHubWriter ↔ GitHub: branch, commit, draft PR (443)", when: allowed, path: [writer_gh, ~writer_gh, ~openpr_writer, ~bind_openpr],
         text: "A person reviews and merges it; the agent never merges.",
         result: success, outcome: "Draft PR opened"}
      - title: Refused at check 1
        when: refused
        action: "check_action(): action not in actionCatalog → rejected"
        path: [emit_ca, ca1, ~ca1, ~emit_ca, emit_metric]
        text: "An action the manifest doesn't declare is rejected with undeclared_action; the later checks don't run."
        detail: |
          The first failing check decides and the rest are skipped.
          `emit` records `action_decision` and raises `PermissionError`, so nothing is written for this stack.
          The workflow catches it per stack, so the other stacks go on, and the run record shows the refusal.
      - {title: Nothing written, action: "emit(): PermissionError back to the workflow", when: refused, path: [~bind_emit],
         text: "The refusal is counted and recorded; no PR is opened for this stack.",
         result: fail, outcome: "Refused by point 4"}

  - id: handoff
    title: Handoff to change-correlator
    summary: "A finding suggests asking change-correlator who made the change; the incident workflow asks wardens.handoff, which runs eight checks."
    modes: [{id: planned, label: Planned}, {id: refused, label: Refused}]
    steps:
      - {title: Suggest a handoff, action: "emit() → _suggest_correlation(): suggestedHandoffs on the finding", path: [entry_suggest, ~entry_suggest],
         text: "The finding names the drifted resources so change-correlator can look up who changed them."}
      - {title: Plan it, action: "IncidentWorkflow.run() → Temporal → plan_handoff()", path: [inc_t, t_plan],
         text: "After the child finishes, each suggestion becomes a plan_handoff activity with a cost share."}
      - title: Checks 1 to 4
        when: planned
        action: "plan_child_task(): pair, route, hops, cycle"
        path: [ph_fn, h1, h2, h3, h4]
        text: "The pair must be enabled, the capability routable, hops left, and the target not already on the chain."
        detail: |
          Unlike point 4, every check runs and every reason is collected.
          1. `terraform.drift.explain → change.correlate` must be enabled in `handoff.yaml`; everything else is denied by default.
          2. the registry resolves `change.correlate` to a routable agent;
          3. the parent has `hopBudget` left;
          4. the target capability is not already on the chain, so two agents can't hand work back and forth.
      - title: Checks 5 to 8
        when: planned
        action: "plan_child_task(): verified, cost share, deadline, inputs"
        path: [h5, h6, h7, h8, h_done]
        text: "The finding must be verified, the share affordable, the deadline ahead and the inputs valid."
        detail: |
          5. the finding that suggested it passed verification;
          6. the cost share is above zero and within what the parent has left;
          7. the parent's deadline has not passed;
          8. the inputs match change.correlate's input schema.
          The child gets the same `correlationId`, a level no higher than the parent's or the target's, cost min(share, target ceiling) and one hop fewer, then a schema check.
      - title: Refused
        when: refused
        action: "plan_child_task(): all eight checks, every reason collected"
        path: [ph_fn, h1, h2, h3, h4, h5, h6, h7, h8, h_done]
        text: "A pair not in handoff.yaml, or any other failed check, raises HandoffRefused with every reason."
        detail: |
          Default deny: a pair that isn't enabled is refused even when every other check passes.
          All reasons are returned together, so one run shows everything that would need changing.
          The incident keeps the parent's result and sends its message without the child's.
      - {title: Count it, action: "plan_handoff() → handoff_planned() metric and span", path: [~ph_fn, ph_metric],
         text: "Planned or refused, the decision is counted with its reason and traced."}
      - {title: Start the child, action: "IncidentWorkflow → Temporal: change-correlator child workflow", when: planned, path: [~t_plan, ~inc_t, inc_child],
         text: "The child runs on change-correlator's queue; its finding joins the incident by reference.",
         result: success, outcome: "Child task started"}
      - {title: Go on without it, action: "IncidentWorkflow: no child; one message for the incident", when: refused, path: [~t_plan, ~inc_t],
         text: "The refusal is in the run record and the trace; the drift result still goes out.",
         result: done, outcome: "Handoff refused, incident goes on"}

  - id: record
    title: Run record and the message
    summary: "At the end of every run, success or failure, _run_agent writes the run record: built, redacted, schema-checked, stored and exported, then the message."
    steps:
      - {title: Run ends, action: "_run_agent(): finally block, success or failure", lights: [w_run_agent],
         text: "The record is written whatever happened, so a failed or stopped run leaves evidence too."}
      - title: Shielded activity
        action: "_run_agent() → Temporal → record_run activity"
        path: [ra_t, t_bind]
        text: "RECORD_ACTIVITY is shielded from cancellation and retried 5 times; a ContractError is not retried."
        detail: |
          The record activity runs in a `finally` block, so it runs on success, failure and cancellation.
          It is shielded: cancelling the workflow (the kill switch, an operator) doesn't cancel the record.
          5 attempts cover a short database or network blip; a `ContractError` means the record itself is wrong and retrying won't help.
      - title: Build and redact
        action: "record_run → build_run_record() → redact()"
        path: [bind_brr, brr_redact, ~brr_redact, ~bind_brr]
        text: "Model calls are priced, evidence and parameters masked, then the record is checked against the run-record schema."
        detail: |
          `build_run_record` prices each model call from `prices.yaml`.
          Evidence text goes through `redact_text`; activity parameters through `redact(…, classification=…)`, which adds the classification's own patterns.
          `validate("run-record")` rejects a record that doesn't match the contract.
      - title: Store it
        action: "sink.write() ↔ wardens-state-db (5432)"
        path: [bind_sink, sink_db, ~sink_db, ~bind_sink]
        text: "Inserted with a retention from its classification; if Postgres is unreachable it goes to the file sink."
        detail: |
          `PostgresRecordSink.write` catches `OperationalError`, writes to the file sink instead and counts `run_record_fallback`.
          So a database outage never loses a record, and an alert can fire on the fallback counter.
      - {title: Export it, action: "export_run() → OTel collector (OTLP gRPC 4317)", path: [bind_export, export_col],
         text: "One root span per run with action events, and run metrics by capability, to the mon cluster."}
      - {title: Record id returns, action: "record_run → Temporal → _run_agent(): the record's id", path: [~t_bind, ~ra_t],
         text: "The workflow keeps the reference; the message links to it."}
      - {title: Send the message, action: "notify() → Notifier.send() → Slack (443)", path: [bind_notify, notify_slack],
         text: "The run's message goes to its audience; inside an incident the root sends one message for all.",
         result: success, outcome: "Run recorded and reported"}

  - id: chat
    title: Chat turn with stack-author
    summary: "One message in the Author tab: budget, guarded read tools, point 2 on every call, the model, a validator that prepares the diff and a recorded call."
    modes: [{id: ok, label: Within budget}, {id: budget, label: Budget spent}]
    steps:
      - {title: Message arrives, action: "Engineer → console → Temporal signal → Conversation → _turn()", path: [eng_t, t_conv, conv_turn],
         text: "One workflow per conversation; next_message returns the signal inside it."}
      - {title: Turn is an activity, action: "_turn() → acts.chat_turn() → Temporal → chat_turn()", path: [turn_proxy, proxy_t, t_bind, bind_chat, chat_stage],
         text: "The model call runs as an activity with no retries: a failure becomes a reply, not a failed conversation."}
      - title: Set the budget
        action: "chat_turn() → usage_limits(remaining_usd, REQUEST_LIMIT 14)"
        path: [stage_usage, ~stage_usage]
        text: "What the conversation has left becomes token and request limits for this turn."
        detail: |
          `remaining_usd` is the task's cost limit minus what earlier turns spent.
          `usage_limits` prices tokens at the model's dearer rate and adds `REQUEST_LIMIT = 14` requests per turn.
          No budget left raises `CostCeilingReached` before the model is called at all.
      - {title: Budget spent, action: "chat_turn(): CostCeilingReached → fixed reply, call recorded", when: budget, path: [stage_mc, ~stage_mc, ~chat_stage, ~bind_chat, ~t_bind, ~proxy_t, ~turn_proxy],
         text: "The person is told to start a new conversation; the model is never called.",
         result: done, outcome: "Budget spent, no model call"}
      - title: Guarded read tools
        when: ok
        action: "_toolset() → read_tools() → GuardedToolset()"
        path: [stage_toolset, ts_read_tools, ~ts_read_tools, ts_guarded, ~ts_guarded, ~stage_toolset]
        text: "Only the manifest's read tools are offered, each call to go through point 2."
        detail: |
          `read_tools(manifest, TOOL_PARAMETERS)` lists the read tools and their parameter names; act tools are never included.
          `GuardedToolset.get_tools` hides anything not in that list, so the model can't even see an undeclared tool.
          Stated limit: `_toolset` passes no manifest or audit log, so tool bounds aren't checked and a refusal writes no audit event.
      - {title: Model asks for a tool, action: "chat_turn() → agent.run() → LiteLLM (443): read_stack", when: ok, path: [stage_pyd, pyd_lite, ~pyd_lite],
         text: "stack-author's model goes straight to LiteLLM: model_from_env got no agent=, so there is no breaker."}
      - title: Point 2
        when: ok
        action: "GuardedToolset.call_tool() → check_tool_call(caller=llm)"
        path: [pyd_guarded, guarded_tc, tc1, tc2, tc3, tc4, tc_done]
        text: "Declared, a read tool, declared arguments, inside the bounds: the first failure refuses the call."
        detail: |
          A refusal never runs the function: the model gets a `ModelRetry` with the reason as JSON and may try something else.
          Every call opens an `execute_tool` span with redacted arguments and the guardrail's result.
          `guardrail_decision(agent, "tool", allowed, code)` counts every decision.
      - {title: Read the stack, action: "read_stack() ↔ GitHub: resources.yaml and common_vars.yaml", when: ok, path: [~guarded_tc, guarded_read, read_gh, ~read_gh, ~guarded_read, ~pyd_guarded],
         text: "Paths outside environments/<cloud>/ are refused; the result, capped at 20,000 characters, is data, not instructions."}
      - title: Proposal prepared in code
        when: ok
        action: "LiteLLM → output validator _prepared(): prepare the diff"
        path: [pyd_lite, ~pyd_lite, pyd_prepared, ~pyd_prepared]
        text: "A proposed change is prepared against the real stack and module inputs; errors send it back to the model."
        detail: |
          `_prepared` runs `prepare(Proposal(...), catalog, reader)` in code.
          Errors raise `ModelRetry` with the list, so the model repairs the proposal, up to 2 retries.
          Only a prepared change, with its diff and `patchSha256`, reaches the person; they press the button, and `_confirm` checks the same hash.
      - {title: Reply, action: "chat_turn() → model_call() → activity → workflow → console", when: ok, path: [~stage_pyd, stage_mc, ~stage_mc, ~chat_stage, ~bind_chat, ~t_bind, ~proxy_t, ~turn_proxy],
         text: "The call is recorded with its cost; the reply and the diff appear in the Author tab.",
         result: success, outcome: "Reply with a prepared diff"}
