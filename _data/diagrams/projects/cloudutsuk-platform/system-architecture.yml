edges:
  # Remote access and the portal
  - {id: you_tailnet, view: networking, main: true, from: you, to: ts-policy, proto: WireGuard, kind: stream, label: tailnet, why: "Every visit starts here: your device sends the request over WireGuard into the private tailnet; nothing at home listens on the internet.", certs: {server: "tailscale-keys", note: "WireGuard (Noise IK, Curve25519) encrypts the hop with keys, not X.509 certificates; the HTTPS inside it is checked separately."}}
  - {id: ts_allow, view: networking, main: true, from: ts-policy, to: ts-router, label: allowed, kind: control, why: "The tailnet policy only lets your login reach the platform's addresses; anyone else's packets are dropped here.", certs: {server: "tailscale-control"}}
  - {id: ts_route, view: networking, main: true, from: ts-router, to: traefik-platform, proto: HTTPS, port: 443, tls: true, label: "172.30.0.2", why: "Carries every request home: tailscaled on the DGX routes it onto the homelab bridge to platform's Traefik.", certs: {server: ["le-portal", "le-argocd", "le-velero"], note: "Traefik picks the certificate by the name you typed (SNI)."}}
  - {id: tr_bs, view: networking, main: true, from: traefik-platform, to: backstage, proto: HTTP, port: 7007, why: "Traefik forwards each portal request to Backstage inside the platform cluster.", certs: {none: "Plain HTTP inside the platform cluster: the hop never leaves the cluster network, so there's no certificate. TLS ended at Traefik."}}
  - {id: bs_kc, view: security, main: true, from: backstage, to: keycloak, proto: OIDC, tls: true, detail: "Confidential client `portal`; groups become Backstage identity claims.", why: "Used when you sign in to Backstage: Keycloak brokers your Entra ID login and your groups become roles. The tailnet decides who reaches the network; Keycloak decides who may use the portal.", certs: {server: "le-auth"}}
  - {id: kc_db, view: security, main: true, from: keycloak, to: core-db, proto: PostgreSQL, port: 5432, why: "Keycloak keeps its realm, groups and your Entra ID links here, and reads them on every sign-in.", certs: {none: "Plain PostgreSQL inside the core cluster: the hop never leaves the cluster network, so there's no certificate. The JDBC URL sets no SSL; the password comes from OpenBao."}}
  - {id: you_graf, view: observability, main: true, from: you, to: grafana, proto: HTTPS, port: 443, label: "grafana.mon", detail: "grafana.mon.home.cloudutsuk.com over the tailnet, then Grafana's own Keycloak sign-in.", why: "Used when you open Grafana to look at a dashboard or an alert.", certs: {server: "le-grafana"}}

  # Labs: deploy through the runner, register through lab.sh (lab contract v2)
  - {id: bs_run, from: labs-plugin, to: runner, proto: HTTP, port: 8095, label: "172.30.0.1:8095", detail: "Bearer token from OpenBao `kv/platform/lab-runner`, read by the portal through External Secrets.", why: "Used when you click Deploy or Destroy on a lab tile: the Labs plugin asks the lab runner to do it and follows the job's log.", certs: {none: "Plain HTTP from the platform cluster to the runner on the homelab bridge (172.30.0.1:8095); a bearer token authenticates the call."}}
  - {id: run_labs, oneway: true, from: runner, to: labs, label: make up, kind: control, why: "Used when a lab is deployed: after the port and memory checks, the runner runs the lab's make up, which creates the lab's k3d cluster on the homelab network.", certs: {none: "Local processes on the DGX: the runner starts `make up`, no network hop."}}
  - {id: run_labsh, oneway: true, from: runner, to: lab-sh, label: "make up: register", kind: control, why: "At the end of every make up: the lab's Makefile runs lab.sh register to join the cluster to the platform (and unregister first in make down).", certs: {none: "Local processes on the DGX: the lab's Makefile runs `lab.sh register`, no network hop."}}
  - {id: labsh_lab, from: lab-sh, to: labs, proto: HTTPS, port: 6443, label: "SA + OTLP token", detail: "The shared `labs` token is copied from mon's otlp-gateway-tokens Secret; labs have no External Secrets.", why: "During registration: lab.sh creates the argocd-manager ServiceAccount in the lab and copies in the shared labs OTLP token.", certs: {server: "k3s-lab", client: "k3s-admin", note: "lab.sh uses the lab's kubeconfig context `k3d-<lab>`, whose client certificate k3d wrote."}}
  - {id: labsh_argo, from: lab-sh, to: argocd, proto: HTTPS, port: 6443, label: cluster secret, detail: "Secret cluster-<lab> in platform, labelled homelab/addons=monitoring.", why: "During registration: lab.sh writes the lab's Argo CD cluster secret, so the ApplicationSets start installing its add-ons.", certs: {server: "k3s-platform", client: "k3s-admin"}}
  - {id: labsh_graf, view: observability, from: lab-sh, to: grafana, proto: HTTPS, port: 443, label: Labs folder, detail: "Dashboards go in as ConfigMaps in mon; unregister removes them and revokes the lab's Grafana token.", why: "During registration: the lab's dashboard JSON is loaded into Grafana's Labs folder, and removed again when the lab leaves.", certs: {server: "le-grafana", note: "Authenticated with the host's lab-tools Grafana token."}}
  - {id: argo_labs, view: cicd, main: true, from: argocd, to: lab-operator, proto: HTTPS, port: 6443, label: "cert-manager + pack", why: "Used when a lab registers: Argo CD's ApplicationSets install cert-manager and the monitoring pack through the lab's Kubernetes API.", certs: {server: "k3s-lab", note: "Argo CD authenticates with the cluster's `argocd-manager` ServiceAccount token, not a client certificate."}}

  # GitOps and delivery
  - {id: argo_git, view: cicd, main: true, from: argocd, to: gitops, proto: SSH, port: 22, label: "sync · 3 min", why: "Argo CD polls homelab-gitops every 3 minutes; every merged change (a new image digest, a policy, a dashboard) is synced from here.", certs: {server: "github-ssh", note: "Argo CD reads the repo over SSH (`git@github.com:…`), so a pinned host key, not a certificate, proves it is GitHub."}}
  - {id: argo_admit, view: [security, cicd], from: argocd, to: kyverno, proto: HTTPS, port: 6443, label: admission, detail: "Argo CD applies through the cluster's Kubernetes API, which calls Kyverno's admission webhook for every object.", why: "On every apply: Kyverno checks each object against its seven Deny policies before the API server accepts it.", certs: {server: "kyverno-webhook", note: "The API server is the client here; it calls Kyverno's webhook over HTTPS for every object."}}
  - {id: kyv_zot, view: [security, cicd], from: kyverno, to: zot, proto: HTTPS, port: 443, label: verify signature, detail: "Committed Cosign public key; a zot-pull credential for the lookup.", why: "For every platform/* and labs/* image: Kyverno fetches the Cosign signature and the SBOM attestation from Zot and verifies them.", certs: {server: "le-registry"}}
  - {id: argo_platform, view: cicd, from: argocd, to: portal-area, proto: HTTPS, port: 6443, label: apply, why: "After a portal digest commit, Argo CD applies the portal's manifests through the Kubernetes API, so the new image rolls out.", certs: {server: "k3s-platform", note: "In-cluster: Argo CD uses its ServiceAccount and the mounted cluster CA (`ca.crt`)."}}
  - {id: argo_hello, view: cicd, from: argocd, to: hello-world, proto: HTTPS, port: 6443, label: apply, why: "After a hello-world digest commit, Argo CD applies the Deployment with the new image digest.", certs: {server: "k3s-platform", note: "In-cluster: Argo CD uses its ServiceAccount and the mounted cluster CA (`ca.crt`)."}}
  - {id: smoke_hw, view: cicd, from: argocd, to: hello-world, proto: HTTP, label: PostSync smoke test, detail: "A hook Job with a pinned curl image; it passes every Kyverno policy too.", why: "After every sync: the PostSync Job checks /readyz, / and the revision. A failing test fails the sync; the fix is a revert.", certs: {none: "Plain HTTP inside the platform cluster: the hop never leaves the cluster network, so there's no certificate. The PostSync Job calls the Service directly."}}
  - {id: argo_ai, view: cicd, from: argocd, to: vllm-embed, proto: HTTPS, port: 6443, label: apply, why: "After every sync, Argo CD applies the ai cluster's changed manifests (today the embeddings model) through its Kubernetes API.", certs: {server: "k3s-ai", note: "Argo CD authenticates with the cluster's `argocd-manager` ServiceAccount token, not a client certificate."}}
  - {id: you_push, view: cicd, from: you, to: repos, proto: HTTPS, port: 443, label: git push, why: "Every release starts here: you push a commit (or merge a pull request), and GitHub queues the CI workflow.", certs: {server: "github-https"}}
  - {id: ci_gh, view: cicd, from: arc, to: repos, proto: HTTPS, port: 443, label: poll jobs, why: "Always polling: the runners ask GitHub for queued jobs, so no inbound connection is needed.", certs: {server: "github-https"}}
  - {id: ci_bao, view: [security, cicd], from: arc, to: openbao, proto: OIDC, tls: true, label: GitHub OIDC, detail: "Role main is bound to the org, self-hosted runners, refs/heads/main and the reusable workflow; role pr reads only the pull key.", why: "At the start of a CI job the runner logs in to OpenBao with GitHub OIDC to get short-lived secrets; nothing is stored as a GitHub secret.", certs: {server: "le-bao", note: "The runner logs in with a GitHub OIDC JWT, signed by GitHub's key, not a client certificate."}}
  - {id: ci_bk, view: cicd, from: arc, to: buildkit, proto: gRPC, port: 1234, label: buildx build, why: "Used when tests and security gates pass: the job builds the image on the shared BuildKit and gets an OCI layout back to scan.", certs: {none: "Plain gRPC (`tcp://…:1234`) inside the platform cluster: the hop never leaves the cluster network, so there's no certificate. buildkitd runs without `--tlscert`."}}
  - {id: ci_zot, view: cicd, from: arc, to: zot, proto: HTTPS, port: 443, label: crane push, why: "On main only: the scanned image bytes are pushed to Zot under platform/<name>.", certs: {server: "le-registry"}}
  - {id: ci_sign, view: [security, cicd], from: arc, to: openbao, proto: HTTPS, port: 443, label: transit sign, detail: "cosign with hashivault://cosign (ECDSA P-256, not exportable); only role main may sign.", why: "On main only: Cosign signs the pushed image and its SBOM attestation with OpenBao's transit key; a PR job gets 403.", certs: {server: "le-bao", note: "The signing key itself stays in OpenBao's transit engine (ECDSA P-256, not exportable)."}}
  - {id: ci_app, view: [security, cicd], from: arc, to: gitops-app, proto: HTTPS, port: 443, label: App token, why: "In the promote job: the runner mints a short-lived gitops-writer token limited to homelab-gitops and contents: write.", certs: {server: "github-https"}}
  - {id: ci_git, view: cicd, oneway: true, from: arc, to: gitops, proto: HTTPS, port: 443, label: digest commit, why: "After the push, kustomize edit set image commits the new digest to homelab-gitops so Argo CD deploys it; the token is then revoked.", certs: {server: "github-https"}}
  - {id: iac_gh, view: cicd, from: arc-iac, to: repos, proto: HTTPS, port: 443, label: infra-local jobs, why: "Always polling, for infra-local only: Terragrunt plans on pull requests and applies on merge.", certs: {server: "github-https"}}
  - {id: iac_docker, view: [security, cicd], from: arc-iac, to: ghostunnel, proto: TCP, kind: control, port: 2376, tls: true, cards: [tcp, mtls, http], label: mTLS, detail: "Client certificate CN=homelab-iac; ghostunnel forwards to the host's Docker socket.", why: "Used when an IaC job plans or applies a k3d stack: it reaches the host's Docker through the mutual-TLS endpoint, not a socket mount.", certs: {server: "docker-proxy-server", client: "docker-proxy-client"}}

  # Telemetry
  - {id: app_otlp, main: true, view: observability, from: lab-app, to: lab-agent, proto: OTLP gRPC, port: 4317, why: "Always on: the lab app's traces, metrics and logs go to the in-cluster agent collector, which adds pod metadata.", certs: {none: "Plain OTLP gRPC inside the lab cluster: the hop never leaves the cluster network, so there's no certificate. The app sends to the node's agent collector."}}
  - {id: labs_mon, main: true, view: observability, from: lab-agent, to: otel-gw, proto: OTLP HTTP, port: 443, tls: true, detail: "Bearer: the shared labs token. k8s.cluster.name is set to the lab's cluster.", why: "Always on: the lab's agent collector forwards app telemetry, pod logs and node metrics to mon's gateway.", certs: {server: "le-otlp", note: "Authenticated with the shared `labs` bearer token."}}
  - {id: lab_cc_mon, main: true, view: observability, from: lab-clustercol, to: otel-gw, proto: OTLP HTTP, port: 443, tls: true, why: "Always on: the lab's cluster collector sends kube-state-metrics, API server metrics, ServiceMonitor scrapes and events to mon.", certs: {server: "le-otlp", note: "Authenticated with the shared `labs` bearer token."}}
  - {id: ksm_scrape, view: observability, from: lab-clustercol, to: lab-ksm, proto: Prometheus, label: scrape, why: "Every scrape interval: the cluster collector reads object state from kube-state-metrics for the Kubernetes dashboards.", certs: {none: "Plain HTTP inside the lab cluster: the hop never leaves the cluster network, so there's no certificate. (`kube-state-metrics:8080`)."}}
  - {id: obi_gw, main: true, view: observability, from: lab-obi, to: otel-gw, proto: OTLP HTTP, port: 443, tls: true, why: "Always on in lab-ebpf: OBI's eBPF traces and RED metrics go straight to the gateway, since host-network pods can't reach the agent's Service.", certs: {server: "le-otlp", note: "Authenticated with the shared `labs` bearer token."}}
  - {id: platform_otel, view: observability, from: platform-otel, to: otel-gw, proto: OTLP HTTP, port: 443, tls: true, why: "Always on: the platform cluster's telemetry (portal, Argo CD, Kyverno, Traefik, runners) streams to mon with its own token.", certs: {server: "le-otlp", note: "Authenticated with the platform cluster's own bearer token."}}
  - {id: ai_otel, view: observability, from: ai-otel, to: otel-gw, proto: OTLP HTTP, port: 443, tls: true, why: "Always on: the ai cluster's vLLM and pod telemetry streams to mon for the AI dashboards and the vLLM alerts.", certs: {server: "le-otlp", note: "Authenticated with the ai cluster's own bearer token."}}
  - {id: gw_scrape, main: true, view: observability, from: otel-gw, to: host-exporters, proto: Prometheus, label: "9100 9400 9101 9115", why: "Every 30 seconds: the gateway scrapes the host's node, GPU, Docker and blackbox exporters as cluster dgx.", certs: {none: "Plain HTTP from mon to the host exporters on 172.30.0.1 (ports 9100, 9400, 9101, 9115); they never leave the DGX."}}
  - {id: bb_kc, view: observability, from: host-exporters, to: keycloak, proto: HTTPS, port: 443, label: probe, why: "Every minute: blackbox probes Keycloak's OIDC discovery, so a down identity provider and its certificate expiry raise alerts.", certs: {server: "le-auth", note: "The probe checks the chain and alerts before the certificate expires."}}
  - {id: bb_bao, view: observability, from: host-exporters, to: openbao, proto: HTTPS, port: 443, label: probe, why: "Every minute: blackbox probes OpenBao's health endpoint, since core has no collector of its own.", certs: {server: "le-bao", note: "The probe checks the chain and alerts before the certificate expires."}}
  - {id: bb_zot, view: observability, from: host-exporters, to: zot, proto: HTTPS, port: 443, label: probe, why: "Every minute: blackbox probes Zot's /v2/ endpoint, so a dead registry is noticed before pods fail to pull.", certs: {server: "le-registry", note: "The probe checks the chain and alerts before the certificate expires."}}
  - {id: gw_logs, main: true, from: otel-gw, to: loki, view: observability, kind: telemetry, label: logs, why: "Always on: pod logs and Kubernetes events from every cluster are written to Loki.", certs: {none: "Plain HTTP (`loki.monitoring.svc:3100`) inside the mon cluster: the hop never leaves the cluster network, so there's no certificate."}}
  - {id: gw_metrics, main: true, from: otel-gw, to: mimir-store, view: observability, kind: telemetry, label: metrics, why: "Always on: metrics from every cluster and the host are written to Mimir for dashboards and alert rules.", certs: {none: "Plain HTTP (`mimir.monitoring.svc:8080`) inside the mon cluster: the hop never leaves the cluster network, so there's no certificate."}}
  - {id: gw_traces, main: true, from: otel-gw, to: tempo, view: observability, kind: telemetry, label: traces, why: "Always on: traces from every cluster are written to Tempo.", certs: {none: "Plain gRPC (`tempo.monitoring.svc:4317`, `tls.insecure`) inside the mon cluster: the hop never leaves the cluster network, so there's no certificate."}}
  - {id: graf_q, view: observability, from: grafana, to: mimir-store, proto: HTTP, port: 8080, label: PromQL, why: "Every time a dashboard panel loads: Grafana queries Mimir's Prometheus API (and Loki and Tempo the same way).", certs: {none: "Plain HTTP inside the mon cluster: the hop never leaves the cluster network, so there's no certificate."}}
  - {id: ruler_eval, view: observability, from: ruler, to: mimir-store, kind: data, label: evaluate, why: "Every minute: the ruler evaluates the 195 alert and recording rules against the stored metrics.", certs: {none: "Inside Mimir: the ruler reads the store in-process, no network hop of its own."}}
  - {id: ruler_am, main: true, view: observability, from: ruler, to: alertmanager, kind: event, oneway: true, label: firing, why: "Used when a rule's condition holds for its duration: the ruler sends the alert to Alertmanager (the Watchdog always fires).", certs: {none: "Inside Mimir: the ruler hands alerts to Alertmanager in-process."}}
  - {id: am_slack, main: true, view: observability, oneway: true, from: alertmanager, to: slack, proto: Webhook, tls: true, port: 443, label: alert, why: "Used when a warning or critical alert fires or resolves: Alertmanager posts it to the Slack channel.", certs: {server: "slack-https"}}
  - {id: am_watchdog, view: observability, oneway: true, from: alertmanager, to: healthchecks, proto: HTTPS, port: 443, label: Watchdog · 1 min, why: "Every minute: the always-firing Watchdog pings healthchecks.io, so a broken alert path itself sends an email.", certs: {server: "hc-https"}}
  - {id: hb_bao, view: observability, from: heartbeat, to: openbao, proto: HTTPS, port: 443, label: health, detail: "Through core's Traefik on 172.30.0.1.", why: "Every 5 minutes: the heartbeat checks OpenBao is initialised, unsealed and active, which proves Docker, core, ingress and DNS.", certs: {server: "le-bao"}}
  - {id: hb_hc, view: observability, oneway: true, from: heartbeat, to: healthchecks, proto: HTTPS, port: 443, label: ping · 5 min, why: "Every 5 minutes: a healthy platform pings healthchecks.io (a sick one pings /fail), so a silent DGX emails me.", certs: {server: "hc-https"}}
  - {id: doc_k8s, view: observability, from: doctor, to: platform, proto: HTTPS, port: 6443, label: every cluster, detail: "A merged kubeconfig of every k3d cluster, outside git.", why: "Used when you open Headlamp or run Popeye: the doctor reads every cluster's API server, read-only scans included.", certs: {server: "k3s-all", client: "k3s-admin", note: "One merged kubeconfig: each cluster's CA and admin client certificate."}}
  - {id: doc_graf, view: observability, from: doctor, to: grafana, proto: HTTPS, port: 443, label: dashboards, why: "At each link-page refresh: the doctor lists every Grafana dashboard by folder with the read-only lab-tools token.", certs: {server: "le-grafana"}}

  # Secrets, identity and certificates
  - {id: eso_bao, view: security, from: eso-platform, to: openbao, proto: HTTPS, port: 443, detail: "Per-cluster Kubernetes auth; the cluster's policy reads only its own paths.", why: "Used whenever the platform cluster needs a secret (Keycloak clients, the runner token, zot-pull, OTLP token): External Secrets copies it from OpenBao.", certs: {server: "le-bao", note: "Authenticated with a Kubernetes ServiceAccount login, not a client certificate."}}
  - {id: eso_ai_bao, from: eso-ai, to: openbao, view: security, proto: HTTPS, port: 443, why: "Used when the ai cluster needs a secret (zot-pull, its OTLP token); it can read only its own OpenBao paths.", certs: {server: "le-bao", note: "Authenticated with a Kubernetes ServiceAccount login, not a client certificate."}}
  - {id: argo_bao, from: argocd, to: openbao, view: security, proto: HTTPS, port: 443, label: cluster tokens, why: "Argo CD's ServiceAccount tokens for the long-lived clusters are refreshed from OpenBao, so no long-lived cluster token is stored.", certs: {server: "le-bao", note: "Read through External Secrets on platform."}}
  - {id: cm_le, view: security, from: cert-manager, to: letsencrypt, proto: HTTPS, port: 443, label: ACME DNS-01, detail: "TXT records written through the Cloudflare API.", why: "Used when a certificate is new or near expiry: cert-manager proves the domain with a DNS-01 TXT record and gets a real certificate.", certs: {server: ["acme-https", "cloudflare-https"], note: "cert-manager talks to both: the ACME API to order, Cloudflare's API to write the `_acme-challenge` TXT record."}}
  - {id: velero_kc, view: security, from: velero, to: keycloak, proto: OIDC, tls: true, why: "Used when you open the Velero UI: client velero-ui; platform-admins manage backups, viewers only read.", certs: {server: "le-auth"}}
  - {id: graf_kc, view: security, from: grafana, to: keycloak, proto: OIDC, tls: true, why: "Used when you sign in to Grafana: platform-admins become Admin and viewers Viewer.", certs: {server: "le-auth"}}

  # Networking
  - {id: extdns_pdns, from: extdns, to: powerdns, view: networking, proto: HTTPS, kind: control, label: PowerDNS API, port: 443, why: "Whenever a service is created or changes, ExternalDNS publishes its name into the home.cloudutsuk.com zone.", certs: {server: "le-pdns", note: "Authenticated with PowerDNS's API key from OpenBao."}}
  - {id: dns_lookup, from: platform, to: powerdns, view: networking, proto: DNS, port: 53, label: "*.home", why: "Cross-cluster calls use names in the internal home.cloudutsuk.com zone, which PowerDNS answers.", certs: {none: "Plain DNS on 172.30.0.1:53; no DNSSEC or DNS over TLS on the internal zone."}}
  - {id: pull_platform, from: platform, to: zot, view: [networking, cicd], proto: HTTPS, label: image pulls, why: "Every time a pod starts, the cluster pulls its image from Zot: our signed images, or upstream ones through Zot's mirror.", certs: {server: "le-registry", note: "containerd checks it with the public CA bundle; the pull credential is a Zot account."}}
  - {id: pull_labs, from: labs, to: zot, view: [networking, cicd], proto: HTTPS, label: image pulls, why: "Lab clusters also pull through Zot, so labs keep working when an upstream registry is slow or rate-limited.", certs: {server: "le-registry", note: "containerd checks it with the public CA bundle."}}

  # Backups
  - {id: dump_db, view: ops, from: core-backup, to: core-db, proto: PostgreSQL, port: 5432, label: pg_dump, why: "Nightly at 02:00, before the backup: the dump hook reads Keycloak's database through a read-only pg_read_all_data role.", certs: {none: "Plain PostgreSQL inside the core cluster: the hop never leaves the cluster network, so there's no certificate. The nightly dump hook runs next to the database."}}
  - {id: dump_bao, view: ops, from: core-backup, to: openbao, proto: HTTP, port: 8200, label: raft snapshot, why: "Nightly at 02:00: the dump hook takes an OpenBao snapshot with its own Kubernetes login and a snapshot-only policy.", certs: {none: "Plain HTTP (`openbao.openbao.svc:8200`) inside the core cluster: the hop never leaves the cluster network, so there's no certificate. The hook skips Traefik and logs in with its ServiceAccount."}}
  - {id: bkp_blob, view: ops, from: core-backup, to: backup-blob, proto: HTTPS, port: 443, label: upload, detail: "Kopia, with our own repository password.", why: "Nightly: Velero uploads core's objects and the two dumps to Azure Blob (kept 30 days; weekly ones 12 weeks).", certs: {server: "azure-blob"}}
  - {id: velero_pdb, view: ops, from: velero, to: platform-db, proto: PostgreSQL, port: 5432, label: pg_dump, why: "Nightly: the platform cluster's dump hook takes a pg_dump of platform-db before Velero's backup.", certs: {none: "Plain PostgreSQL inside the platform cluster: the hop never leaves the cluster network, so there's no certificate."}}
  - {id: velero_blob, view: ops, from: velero, to: backup-blob, proto: HTTPS, port: 443, label: "backups, read-only core/ ai/", why: "Nightly it uploads platform's backup; the UI also reads core's and ai's backups through read-only locations.", certs: {server: "azure-blob"}}
  - {id: you_velero, view: ops, from: you, to: velero, proto: HTTPS, port: 443, label: velero.platform, why: "Used when you check what was backed up, when and how big, or take an on-demand backup before a risky change.", certs: {server: "le-velero"}}

