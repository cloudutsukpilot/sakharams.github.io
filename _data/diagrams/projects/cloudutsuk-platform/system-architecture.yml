  - {id: gw_more, view: ops, from: gateway, to: more, proto: HTTPS, port: 443, dashed: true, tone: warn, label: "overflow, later", why: "Planned: when the queue stays long, a second machine or a hosted model is added behind the gateway, with no change to its callers.", certs: {planned: "Planned: each hosted model provider's public certificate."}}
  - {id: ing_gh, dashed: true, oneway: true, from: repos, to: rag-ingest, proto: HTTPS, port: 443, label: clone, why: "Planned: every 6 hours (or on Re-index now) rag-ingest pulls the latest pushed content of the blog and repos.", certs: {server: "github-https", note: "Planned: a GitHub webhook or a poll, either way GitHub's public certificate."}}
  - {id: ing_qd, dashed: true, from: rag-ingest, to: qdrant, proto: Qdrant, port: 6333, why: "Planned: after embedding, new and changed chunks are written to Qdrant and the chunks of removed files deleted.", certs: {planned: "Qdrant's name already has a Let's Encrypt certificate (`qdrant.ai.home.cloudutsuk.com`); in-cluster callers may use the Service instead."}}
  - {id: ing_gw, dashed: true, from: rag-ingest, to: gateway, proto: HTTP, port: 4000, label: embeddings, why: "Planned: changed files are embedded through the gateway before they are stored.", certs: {planned: "The gateway's name already has a Let's Encrypt certificate (`llm.ai.home.cloudutsuk.com`); in-cluster callers may use the Service instead."}}
  - {id: gw_od, dashed: true, view: ops, from: gateway, to: vllm-ondemand, proto: HTTP, port: 8000, label: on demand, why: "Planned: used only when a caller asks for an on-demand model; the gateway routes it here once KEDA has loaded it.", certs: {planned: "Planned: not designed yet."}}
  - {id: keda_mimir, dashed: true, view: observability, from: keda, to: mimir-store, proto: HTTPS, port: 443, label: PromQL, detail: "An OAuth2 token from OpenBao through External Secrets.", why: "Planned: every polling interval, KEDA asks Mimir how many requests the gateway has seen for each on-demand model.", certs: {planned: "Planned: not designed yet."}}
  - {id: keda_scale, dashed: true, view: ops, oneway: true, from: keda, to: vllm-ondemand, kind: control, label: "scale 0 ↔ 1", why: "Planned: when demand appears or after a quiet spell, KEDA loads one copy of the model, or unloads it and frees its memory.", certs: {planned: "Planned: not designed yet."}}

  # Planned: SRE agent (phase 6)
  - {id: mon_sre, dashed: true, view: observability, from: alertmanager, to: sre, proto: Webhook, tls: true, label: alert, why: "Planned: when an alert fires, Alertmanager also hands it to the SRE agent for diagnosis.", certs: {planned: "Planned: not designed yet."}}
  - {id: sre_labs, dashed: true, from: sre, to: lab-app, proto: HTTPS, port: 6443, label: read-only, detail: "15-minute read-only ServiceAccount tokens from OpenBao's Kubernetes secrets engine.", why: "Planned: during an investigation the agent reads the affected cluster's pods, events and logs, read-only.", certs: {planned: "Planned: not designed yet."}}
  - {id: sre_rag, dashed: true, from: sre, to: rag-api, proto: HTTPS, label: runbooks, why: "Planned: during an investigation the agent searches the knowledge base for matching runbooks.", certs: {planned: "Planned: not designed yet."}}
  - {id: sre_gw, dashed: true, from: sre, to: gateway, proto: HTTPS, label: root cause, why: "Planned: the agent asks the local model for a root cause and a proposed fix.", certs: {planned: "Planned: not designed yet."}}
  - {id: sre_slack, dashed: true, oneway: true, from: sre, to: slack, proto: HTTPS, port: 443, label: RCA, why: "Planned: when the diagnosis is done, the agent posts the root cause and fix to Slack for your approval.", certs: {server: "slack-https", note: "Planned."}}
  - {id: slack_git, dashed: true, oneway: true, from: slack, to: gitops, label: approve → PR, kind: control, why: "Planned: when you approve a fix, it is opened as a pull request to homelab-gitops, so nothing changes without review.", certs: {planned: "Planned: GitHub's public certificate for the pull request."}}
  - {id: sre_bao, dashed: true, from: sre, to: openbao, view: security, proto: HTTPS, port: 8200, label: 15-min tokens, why: "Planned: before reading a cluster, the agent gets a 15-minute read-only token from OpenBao's Kubernetes secrets engine.", certs: {server: "le-bao", note: "Planned: like every other platform client, through Traefik on core."}}

  # Planned: Karmada (phase 1a)
  - {id: argo_karmada, dashed: true, view: cicd, from: argocd, to: karmada, proto: HTTPS, port: 5443, label: shared add-ons, detail: "Karmada's API server, registered in Argo CD as one more cluster.", why: "Planned: when a shared add-on changes in homelab-gitops, Argo CD syncs it once to Karmada instead of once per cluster.", certs: {planned: "Planned: Karmada's API server certificate, from its own CA."}}
  - {id: run_karmada, dashed: true, view: cicd, oneway: true, from: lab-sh, to: karmada, kind: control, label: register, why: "Planned: when a lab registers or leaves, it is also joined to Karmada (role lab) or removed.", certs: {planned: "Planned: not designed yet."}}
  - {id: kagent_karmada, dashed: true, view: cicd, from: lab-karmada, to: karmada, proto: HTTPS, port: 5443, label: pull, detail: "Pull mode: the agent's own client certificate; Karmada never connects in.", why: "Planned: the agent watches Karmada for add-ons placed on its cluster and reports their status back.", certs: {planned: "Planned: Karmada's API server certificate, from its own CA."}}
  - {id: kagent_apply, dashed: true, view: cicd, oneway: true, from: lab-karmada, to: lab-operator, kind: control, label: apply add-ons, why: "Planned: when an add-on is placed on this cluster, the agent applies it locally, here the monitoring pack.", certs: {planned: "Planned: not designed yet."}}

  # Planned: chaos engineering (phase 2a)
  - {id: you_chaos, dashed: true, view: ops, from: you, to: chaoscenter, proto: HTTPS, port: 443, label: "chaos.core.home", why: "Planned: used when you start, schedule or review a chaos experiment in ChaosCenter.", certs: {planned: "Planned: not designed yet."}}
  - {id: cc_db, dashed: true, view: ops, from: chaoscenter, to: chaos-db, proto: MongoDB, port: 27017, why: "Planned: every experiment run and its result and resilience score are stored in ChaosCenter's MongoDB.", certs: {planned: "Planned: not designed yet."}}
  - {id: chaos_agent, dashed: true, view: ops, from: lab-chaos, to: chaoscenter, proto: HTTPS, port: 443, label: experiments, detail: "Outbound from the target cluster with its infrastructure ID and access key.", why: "Planned: while a cluster is a chaos target, the agent dials out to ChaosCenter for experiments and reports their results.", certs: {planned: "Planned: not designed yet."}}
  - {id: chaos_inject, dashed: true, view: ops, oneway: true, from: lab-chaos, to: lab-app, kind: control, label: inject fault, why: "Planned: during an experiment the chaos operator injects the fault (for example pod-delete) into the target app.", certs: {planned: "Planned: not designed yet."}}
  - {id: chaos_metrics, dashed: true, stream: false, view: [observability, ops], from: lab-clustercol, to: lab-chaos, proto: Prometheus, label: chaos exporter, why: "Planned: experiment state and resilience scores are scraped by the cluster collector, so Grafana shows faults next to their effects.", certs: {planned: "Planned: not designed yet."}}
  - {id: chaos_git, dashed: true, view: [cicd, ops], from: chaoscenter, to: gitops, proto: HTTPS, port: 443, label: experiments as code, why: "Planned: experiment definitions are reviewed in homelab-gitops; ChaosCenter's GitOps sync keeps its library equal to git.", certs: {planned: "Planned: GitHub's public certificate."}}
  - {id: chaos_kc, dashed: true, view: [security, ops], from: chaoscenter, to: keycloak, proto: OIDC, tls: true, why: "Planned: you sign in to ChaosCenter with Keycloak through Litmus's Dex integration; only platform-admins may run experiments.", certs: {planned: "Would use Keycloak's certificate (`auth.core.home.cloudutsuk.com`, Let's Encrypt) like every other OIDC client."}}

# Use cases: one activity each, one action per step (the reader picks one; auto-play runs them in turn).
# `path` hops run one after another; `~id` is the response travelling back. `action` is the banner line;
# `result` (success / done / fail) celebrates the outcome at the last hop's target.
scenarios:
  - id: login
    title: Sign in to the portal
    summary: "How a device reaches the portal: a private tailnet, one Keycloak sign-in, nothing open on the internet."
    steps:
      - title: You open the portal
        action: "Browser opens portal.platform.home.cloudutsuk.com"
        text: "From your phone or laptop on the tailnet; split DNS resolves the name to 172.30.0.2. The core cluster booted first, so Keycloak is ready."
        lights: [you]
      - title: Into the tailnet
        action: "Device → tailnet: WireGuard to 172.30.0.2:443"
        text: "Your device sends the request over WireGuard into the private tailnet. Nothing at home listens on the internet."
        edges: [you_tailnet]
      - title: Policy and route
        action: "Policy OK → DGX subnet router → platform's Traefik (443)"
        text: "The policy lets only your login through, and tailscaled on the DGX routes the packets onto the homelab bridge to platform's Traefik, which ends TLS."
        path: [ts_allow, ts_route]
      - title: To Backstage
        action: "Traefik → Backstage: GET / (7007)"
        text: "Traefik forwards the request to Backstage inside the platform cluster."
        edges: [tr_bs]
      - title: Sign in through Keycloak
        action: "Backstage ↔ Keycloak: OIDC sign-in"
        text: "Backstage sends you to Keycloak, which brokers your Entra ID login and maps your groups to roles. Network access alone gets nobody in."
        path: [bs_kc, ~bs_kc]
      - title: Look up your account
        action: "Keycloak ↔ core-db: read your account and groups"
        text: "Keycloak reads its realm, your Entra ID link and your groups from core-db, and gets them back."
        path: [kc_db, ~kc_db]
      - title: Portal page returns
        action: "Backstage → Traefik → tailnet → your device: the portal page"
        text: "The portal page travels back the same way: through Traefik, the subnet router and the tailnet to your device."
        path: [~tr_bs, ~ts_route, ~ts_allow, ~you_tailnet]
        result: success
        outcome: "Signed in to the portal"

  - id: deploy-lab
    title: Deploy a lab
    summary: "One click on a lab tile: the runner runs make up, and the lab registers itself with the platform (contract v2)."
    steps:
      - title: Deploy clicked
        action: "Labs plugin → lab runner: deploy this lab (HTTP 8095)"
        text: "The Labs plugin calls the runner on the DGX with its bearer token. The runner checks the card's ports and the memory budget and takes a per-lab lock."
        edges: [bs_run]
      - title: Cluster created
        action: "Lab runner → k3d: make up creates the lab cluster"
        text: "The runner runs the lab's make up, which creates a k3d cluster such as lab-otel on the homelab network, pulling images through Zot."
        edges: [run_labs]
      - title: lab.sh register
        action: "make up → lab.sh register"
        text: "The end of make up runs infra-local's lab.sh register; registration is the lab's own job, not the runner's."
        edges: [run_labsh]
      - title: Access and token
        action: "lab.sh ↔ lab cluster: ServiceAccount and the labs OTLP token (6443)"
        text: "lab.sh creates the argocd-manager ServiceAccount in the lab and copies in the shared labs token for the gateway."
        path: [labsh_lab, ~labsh_lab]
      - title: Registered with Argo CD
        action: "lab.sh → Argo CD: cluster secret labelled homelab/addons=monitoring"
        text: "The lab's cluster secret goes into platform, labelled for labs, so only cert-manager and the monitoring pack are installed."
        path: [labsh_argo, ~labsh_argo]
      - title: Add-ons installed
        action: "Argo CD → lab cluster: cert-manager and the monitoring pack (6443)"
        text: "The ApplicationSets install cert-manager and the monitoring pack; lab.sh waits until they are Healthy (up to 15 minutes on a first run)."
        path: [argo_labs, ~argo_labs]
      - title: Dashboards loaded
        action: "lab.sh → Grafana: the lab's dashboards in the Labs folder"
        text: "The lab's dashboard JSON is loaded into mon's Grafana, folder Labs; make down removes it again."
        path: [labsh_graf, ~labsh_graf]
      - title: Lab ready
        action: "Lab runner → Labs plugin: deployment finished"
        text: "The runner reports the job as done (the OpenTelemetry lab took 8 min 48 s) and the tile shows its links."
        path: [~bs_run]
        result: success
        outcome: "Lab deployed and registered"

  - id: monitoring
    title: Monitor a lab
    summary: "Telemetry streams from the lab into mon's gateway, and you read it in Grafana filtered on the lab's cluster."
    steps:
      - title: The app sends OTLP
        action: "Lab app → agent collector: traces, metrics, logs (OTLP 4317)"
        text: "The lab's app sends OTLP to the in-cluster agent collector, which adds pod metadata and the cluster name."
        edges: [app_otlp]
      - title: Out to mon
        action: "Agent collector → OTLP gateway: OTLP/HTTP with the labs token (443)"
        text: "The agent forwards everything to otlp.mon.home.cloudutsuk.com over HTTPS with the shared labs bearer token."
        edges: [labs_mon]
      - title: Stored in LGTM
        action: "OTLP gateway → Mimir, Loki, Tempo: store the telemetry"
        text: "The gateway writes metrics to Mimir, logs to Loki and traces to Tempo, kept about 15 days."
        edges: [gw_metrics, gw_logs, gw_traces]
      - title: You open the dashboard
        action: "Browser → Grafana: the lab's dashboard in the Labs folder"
        text: "grafana.mon.home.cloudutsuk.com is reached over the tailnet; Grafana signs you in through Keycloak."
        path: [you_graf]
      - title: Panels query Mimir
        action: "Grafana ↔ Mimir: PromQL filtered on cluster=\"lab-otel\""
        text: "Every panel's query filters on the lab's cluster, because mon holds every cluster's signals."
        path: [graf_q, ~graf_q]
      - title: Dashboard shown
        action: "Grafana → browser: the lab's dashboard"
        text: "The filled dashboard returns to your browser."
        path: [~you_graf]
        result: done
        outcome: "Dashboard loaded"

  - id: alert
    title: Alert to Slack
    summary: "A rule fires in Mimir's ruler and reaches Slack; the Watchdog proves the alert path itself works."
    modes:
      - {id: fire, label: "VLLMNotServing fires"}
      - {id: watchdog, label: "Watchdog"}
    steps:
      - title: Metrics arrive
        when: fire
        action: "ai collector → OTLP gateway: vLLM metrics show no ready model (443)"
        text: "The embeddings model's pod isn't ready (on its first deploy it waited 15 minutes for its 22 GB image)."
        edges: [ai_otel]
      - title: Stored in Mimir
        when: fire
        action: "OTLP gateway → Mimir: write the metrics"
        text: "The gateway writes the ai cluster's metrics to Mimir with cluster=\"ai\"."
        edges: [gw_metrics]
      - title: Rules evaluated
        action: "Ruler ↔ Mimir: evaluate the 195 rules (every minute)"
        text: "The ruler evaluates every alert rule from homelab-gitops against the stored metrics, once a minute."
        path: [ruler_eval, ~ruler_eval]
      - title: Alert fires
        when: fire
        action: "Ruler → Alertmanager: VLLMNotServing (after 10 minutes)"
        text: "The condition has held for its 10 minutes, so the ruler sends the alert to Mimir's Alertmanager."
        edges: [ruler_am]
      - title: Posted to Slack
        when: fire
        action: "Alertmanager → Slack: VLLMNotServing on cluster ai (HTTPS 443)"
        text: "Alertmanager posts the alert to the Slack channel; it posts again when the pod is ready and the alert resolves."
        edges: [am_slack]
        result: success
        outcome: "Alert in Slack"
      - title: Watchdog fires
        when: watchdog
        action: "Ruler → Alertmanager: Watchdog (always firing)"
        text: "The Watchdog rule always fires, so the alert path is exercised every minute."
        edges: [ruler_am]
      - title: Ping healthchecks.io
        when: watchdog
        action: "Alertmanager → healthchecks.io: Watchdog ping (HTTPS 443)"
        text: "If the pings stop (Mimir down, Alertmanager broken, mon gone), healthchecks.io emails me."
        edges: [am_watchdog]
        result: done
        outcome: "Alert path proven alive"

  - id: backup
    title: Nightly backup
    summary: "At 02:00 Velero dumps the databases that can't be rebuilt, plus OpenBao, and uploads them to Azure Blob."
    steps:
      - title: Dump Keycloak's database
        action: "Dump hook ↔ core-db: pg_dump with a read-only role (5432)"
        text: "Before core's backup, the backup-dumps hook takes a pg_dump of Keycloak's database through pg_read_all_data."
        path: [dump_db, ~dump_db]
      - title: Snapshot OpenBao
        action: "Dump hook ↔ OpenBao: raft snapshot (8200)"
        text: "The hook logs in with its own Kubernetes identity and a snapshot-only policy, and takes OpenBao's snapshot."
        path: [dump_bao, ~dump_bao]
      - title: Upload to Azure
        action: "Velero → Azure Blob: core's objects and both dumps (HTTPS 443)"
        text: "Velero uploads with Kopia to the Cool-tier account; nightly backups are kept 30 days, weeklies 12 weeks."
        path: [bkp_blob, ~bkp_blob]
      - title: Dump platform-db
        action: "platform's dump hook ↔ platform-db: pg_dump (5432)"
        text: "In platform, the same pattern dumps platform-db, where the portal keeps its data."
        path: [velero_pdb, ~velero_pdb]
      - title: Upload platform
        action: "Velero → Azure Blob: platform's objects and dump (HTTPS 443)"
        text: "platform's Velero uploads its own backup to the same container."
        path: [velero_blob, ~velero_blob]
      - title: Check in the UI
        action: "Browser ↔ Velero UI: every cluster's backups"
        text: "velero.platform.home.cloudutsuk.com lists core's, platform's and ai's backups with their size and status."
        path: [you_velero, ~you_velero]
        result: success
        outcome: "Backups stored off the DGX"

  - id: release
    title: Code to cluster
    summary: "A push to hello-world becomes a scanned, signed image and a digest commit that Argo CD deploys (M1: 8 min 25 s)."
    steps:
      - title: Commit pushed
        action: "You → GitHub: git push to homelab-services"
        text: "A pushed commit (or a merged pull request) queues hello-world's workflow on GitHub."
        path: [you_push, ~you_push]
      - title: Runner picks up the job
        action: "homelab runner ↔ GitHub: poll for queued jobs"
        text: "A runner pod in platform polls GitHub for jobs (no inbound connection). Ruff and pytest run first, in 13 s."
        path: [ci_gh, ~ci_gh]
      - title: Log in to OpenBao
        action: "Runner ↔ OpenBao: GitHub OIDC login as role main"
        text: "The runner logs in with GitHub's OIDC token and gets the Zot push key; nothing is stored as a GitHub secret."
        path: [ci_bao, ~ci_bao]
      - title: Gates, then build
        action: "Runner ↔ BuildKit: build after the gates pass (gRPC, default 1234)"
        text: "Gitleaks, Semgrep, Bandit, Trivy, Checkov, Conftest and Hadolint pass, then BuildKit builds and returns an OCI layout that is scanned and given an SBOM."
        path: [ci_bk, ~ci_bk]
      - title: Push and sign
        action: "Runner → Zot: push; runner → OpenBao transit: sign"
        text: "On main, crane pushes the scanned bytes to Zot, and Cosign signs them and attests the SBOM with the transit key."
        path: [ci_zot, ~ci_zot, ci_sign, ~ci_sign]
      - title: Digest commit
        action: "Runner → gitops-writer App → homelab-gitops: commit the new digest"
        text: "The promote job mints a short-lived App token and commits the digest to apps/hello-world, then revokes the token."
        path: [ci_app, ~ci_app, ci_git]
      - title: Argo CD syncs
        action: "Argo CD ↔ homelab-gitops: the new digest (3-minute poll)"
        text: "Argo CD notices the digest commit on its next poll and reads the changed manifests."
        path: [argo_git, ~argo_git]
      - title: Admitted and applied
        action: "Argo CD → Kyverno: admitted (signed) → apply hello-world"
        text: "Kyverno verifies the signature and SBOM attestation in Zot and admits the Deployment, which Argo CD applies."
        path: [argo_admit, kyv_zot, ~kyv_zot, ~argo_admit, argo_hello, ~argo_hello]
      - title: Image pulled
        action: "platform ↔ Zot: pull the signed image and start the pod"
        text: "The new pod pulls the signed image from Zot by digest and starts."
        path: [pull_platform, ~pull_platform]
      - title: Smoke test
        action: "PostSync Job → hello-world: /readyz, / and the revision"
        text: "The PostSync smoke test passes, so the sync succeeds and the app is Synced and Healthy on the new SHA."
        path: [smoke_hw, ~smoke_hw]
        result: success
        outcome: "Released: commit to running pod"

  - id: admission
    title: Admission denied
    summary: "Kyverno refuses an image that isn't signed in Zot, so an unsigned build can never run."
    modes:
      - {id: unsigned, label: "Unsigned image"}
      - {id: signed, label: "Signed image"}
    steps:
      - title: A change is synced
        action: "Argo CD ↔ homelab-gitops: a manifest with a new image"
        text: "Argo CD picks up a commit that points at a platform/* image."
        path: [argo_git, ~argo_git]
      - title: Admission review
        action: "Argo CD → API server → Kyverno: admission review"
        text: "Argo CD applies through the Kubernetes API, which sends the Pod spec to Kyverno's webhook for its seven policies."
        edges: [argo_admit]
      - title: Look up the signature
        action: "Kyverno ↔ Zot: Cosign signature and SBOM attestation?"
        text: "Kyverno fetches the image's referrers from Zot and checks them against the committed Cosign public key."
        path: [kyv_zot, ~kyv_zot]
      - title: Denied
        when: unsigned
        action: "Kyverno → Argo CD: denied by verify-image-signatures"
        text: "No valid signature, so the API server refuses the object; the app shows the error and nothing runs."
        path: [~argo_admit]
        result: fail
        outcome: "Unsigned image refused"
      - title: Admitted
        when: signed
        action: "Kyverno → Argo CD: admitted; apply continues"
        text: "The signature and SBOM verify, every other policy passes, and the object is created."
        path: [~argo_admit, argo_hello, ~argo_hello]
        result: success
        outcome: "Signed image admitted"

  - id: inventory
    title: Resources and cost
    summary: "Planned (phase 4): how the inventory collects cloud resources and cost, and how you see them."
    steps:
      - title: Credentials from OpenBao
        action: "External Secrets ↔ OpenBao: fetch read-only cloud credentials"
        text: "External Secrets fetches the read-only cloud credentials from OpenBao (HTTPS 443 through Traefik on core); no secret lives in git."
        path: [eso_bao, ~eso_bao]
      - title: Read the clouds
        action: "Inventory ↔ Azure, AWS, GCP APIs: list resources and cost"
        text: "Every 6 hours (or on Sync now) the inventory calls the cloud APIs over HTTPS and gets resources and cost back."
        path: [inv_cl, ~inv_cl]
      - title: Store the results
        action: "Inventory → platform-db: write resources and daily cost"
        text: "Resources and daily cost go into platform-db.inventory (PostgreSQL, 5432), grouped by lab and repo tags."
        path: [inv_pg, ~inv_pg]
      - title: You look at cost
        action: "Inventory plugin ↔ inventory: show cost per lab"
        text: "The Inventory plugin in Backstage calls the inventory service and renders resources and cost per lab."
        path: [bs_inv, ~bs_inv]
        result: success
        outcome: "Cost per lab shown"

  - id: dgx-cost
    title: Price a lab on the DGX
    summary: "Planned (phase 4): OpenCost on each k3d cluster splits the DGX's cost by cluster, namespace and lab."
    steps:
      - title: Daily cost sync
        action: "Inventory → OpenCost: allocation for yesterday, by namespace (HTTPS 443)"
        text: "Once a day the inventory asks each cluster's OpenCost for yesterday's cost by namespace, with a Keycloak token."
        path: [inv_oc]
      - title: Read the usage
        action: "OpenCost ↔ Mimir: this cluster's CPU, memory and pod metrics (PromQL)"
        text: "OpenCost reads only its own cluster's series from Mimir and prices them with the DGX's custom per-hour prices."
        path: [oc_mimir, ~oc_mimir]
      - title: Allocation returns
        action: "OpenCost → inventory: cost per namespace and pod"
        text: "The allocation comes back; GPU-hours go to the pods that requested the GPU."
        path: [~inv_oc]
      - title: Store it with the cloud costs
        action: "Inventory → platform-db: DGX rows in COST_DAILY (PostgreSQL 5432)"
        text: "The rows are stored under the dgx provider, next to Azure, AWS and GCP, so a lab's local and cloud cost roll up together."
        path: [inv_pg, ~inv_pg]
      - title: See the lab's cost
        action: "Inventory plugin ↔ inventory: cost per lab, DGX included"
        text: "The portal's cost view shows each lab's DGX cost beside its cloud cost."
        path: [bs_inv, ~bs_inv]
        result: success
        outcome: "Lab cost includes the DGX"

  - id: karmada
    title: Join a new cluster
    summary: "Planned (phase 1a): Karmada places the shared add-ons on a new lab cluster by label."
    steps:
      - title: Register the cluster
        action: "lab.sh → Karmada: register the new lab cluster (role lab)"
        text: "At the end of make up, lab.sh also registers the cluster with Karmada in pull mode and labels it with its role."
        edges: [run_karmada]
      - title: The agent asks for work
        action: "Karmada agent ↔ Karmada: which add-ons are placed here? (HTTPS 5443)"
        text: "The lab's karmada-agent dials out to Karmada's API server (default port 5443); propagation policies match the lab label."
        path: [kagent_karmada, ~kagent_karmada]
      - title: Apply the add-ons
        action: "Karmada agent → lab cluster: apply the monitoring pack and other add-ons"
        text: "The agent applies the add-ons locally, with overrides such as the cluster's name."
        edges: [kagent_apply]
      - title: Report status
        action: "Karmada agent ↔ Karmada: add-ons applied and healthy"
        text: "The agent reports each add-on's status, which Karmada aggregates across every cluster."
        path: [kagent_karmada, ~kagent_karmada]
      - title: One health in Argo CD
        action: "Argo CD ↔ Karmada: shared add-ons Synced and Healthy (HTTPS 5443)"
        text: "Argo CD reads the aggregated status from Karmada, so one app shows the add-ons' health on every cluster."
        path: [argo_karmada, ~argo_karmada]
        result: success
        outcome: "Add-ons running on the new lab"

  - id: chaos
    title: Run a chaos experiment
    summary: "Planned (phase 2a): a fault in a lab, run from ChaosCenter in core, watched in Grafana and scored."
    steps:
      - title: Start the experiment
        action: "Browser → ChaosCenter: run pod-delete on the lab (HTTPS 443)"
        text: "You start an experiment from the library synced from homelab-gitops; ChaosCenter is never published to the internet."
        path: [you_chaos]
      - title: Record the run
        action: "ChaosCenter ↔ chaos-db: store the new run (MongoDB 27017)"
        text: "ChaosCenter records the run in its MongoDB (default port 27017) before any agent sees it."
        path: [cc_db, ~cc_db]
      - title: The agent picks it up
        action: "Chaos agent ↔ ChaosCenter: fetch the experiment (HTTPS 443)"
        text: "The lab's chaos agent dials out to ChaosCenter in core and gets the experiment; nothing connects into the lab."
        path: [chaos_agent, ~chaos_agent]
      - title: Inject the fault
        action: "Chaos operator → lab app: delete a pod"
        text: "The chaos operator injects the fault within the blast radius set in git, while its probes check the app keeps answering."
        edges: [chaos_inject]
      - title: Watch the effect
        action: "Lab app → agent collector → mon: signals during the fault"
        text: "The monitoring pack streams the lab's signals to mon as usual, next to the chaos exporter's metrics."
        path: [app_otlp, labs_mon]
      - title: Report the result
        action: "Chaos agent ↔ ChaosCenter: probe results and verdict"
        text: "The agent reports the probe results; ChaosCenter turns them into a pass or fail and a resilience score."
        path: [chaos_agent, ~chaos_agent]
      - title: Read the score
        action: "ChaosCenter → browser: verdict and resilience score"
        text: "You see the verdict and score next to the Grafana dashboards for the same time window."
        path: [~you_chaos]
        result: success
        outcome: "Resilience score recorded"

  - id: wake-model
    title: Wake an idle model
    summary: "Planned (phase 5): KEDA loads a rarely used model on demand and unloads it when idle."
    steps:
      - title: A request for a sleeping model
        action: "Gateway: a request arrives for an on-demand model at 0 replicas"
        text: "A caller asks the gateway for an on-demand model; the gateway queues the request while the model is asleep."
        lights: [gateway, vllm-ondemand]
      - title: KEDA sees the demand
        action: "KEDA ↔ Mimir: requests for this model in the last 5 minutes (PromQL)"
        text: "KEDA's Prometheus scaler reads the gateway's per-model request rate from Mimir over HTTPS."
        path: [keda_mimir, ~keda_mimir]
      - title: Load the model
        action: "KEDA → on-demand model: scale 0 → 1"
        text: "If its memory slice fits what's free on the host, KEDA scales the model to one copy and vLLM loads it."
        edges: [keda_scale]
      - title: Serve the request
        action: "Gateway ↔ on-demand model: the queued request (HTTP 8000)"
        text: "The queued request is answered. After 30 quiet minutes KEDA scales the model back to 0 and its memory returns."
        path: [gw_od, ~gw_od]
        result: success
        outcome: "Model served, then unloaded when idle"

  - id: chat
    title: Ask the chatbot
    summary: "Planned (phase 5): a question goes through the RAG API, cache first, then retrieval and the local model."
    modes:
      - {id: miss, label: "Cache miss"}
      - {id: hit, label: "Simulate a cache hit"}
    steps:
      - title: Question sent
        action: "Chat plugin → RAG API: your question (HTTPS)"
        text: "The chat plugin sends your question to the RAG API in the ai cluster over HTTPS."
        edges: [bs_rag]
      - title: Check the cache
        action: "RAG API ↔ Redis: is there a similar answer?"
        text: "The RAG API looks for a semantically similar question in Redis (6379)."
        path: [rag_cache, ~rag_cache]
      - title: Instant answer
        when: hit
        action: "RAG API → chat plugin: cached answer"
        text: "A cache hit (same index version) answers immediately, without retrieval or the model."
        path: [~bs_rag]
        result: success
        outcome: "Answered from the cache"
      - title: Retrieve documents
        when: miss
        action: "RAG API ↔ Qdrant: find the closest chunks"
        text: "On a miss, Qdrant (6333) returns the closest chunks, filtered by repo, lab or cloud."
        path: [rag_qd, ~rag_qd]
      - title: Prompt to the model
        when: miss
        action: "RAG API → gateway → vLLM chat: generate the answer"
        text: "The prompt with the chunks goes to the LiteLLM gateway (4000), which routes it to vLLM chat (8000) on the GPU."
        path: [rag_gw, gw_llm]
      - title: Answer streams back
        when: miss
        action: "vLLM chat → gateway → RAG API: the generated answer"
        text: "The answer streams back through the gateway to the RAG API."
        path: [~gw_llm, ~rag_gw]
      - title: Trace recorded
        when: miss
        action: "RAG API → Phoenix: record the request trace"
        text: "The request's spans (cache check, chunks and scores, prompt, tokens) go to Phoenix."
        edges: [rag_px]
      - title: Answer shown
        when: miss
        action: "RAG API → chat plugin: answer with citations"
        text: "The answer, with citations and a View trace link, is shown in the portal."
        path: [~bs_rag]
        result: success
        outcome: "Answer with citations shown"

  - id: ingest
    title: Keep knowledge fresh
    summary: "Planned (phase 5): every 6 hours, changed files are re-embedded into Qdrant."
    steps:
      - title: Clone the repos
        action: "GitHub → rag-ingest: latest pushed content"
        text: "rag-ingest clones the blog and repos from GitHub over HTTPS with a read-only token; only pushed work is indexed."
        edges: [ing_gh]
      - title: Embed changed files
        action: "rag-ingest → gateway → vLLM embed: embed changed files"
        text: "Only changed files are sent through the gateway (4000) to the embeddings model (8000), which already runs today."
        path: [ing_gw, gw_emb]
      - title: Vectors come back
        action: "vLLM embed → gateway → rag-ingest: the embeddings"
        text: "The embeddings come back through the gateway to rag-ingest."
        path: [~gw_emb, ~ing_gw]
      - title: Update Qdrant
        action: "rag-ingest → Qdrant: upsert new chunks, delete removed ones"
        text: "New chunks are written to Qdrant and removed files deleted; the cache invalidates with the index version."
        path: [ing_qd, ~ing_qd]
        result: done
        outcome: "Index updated"

  - id: sre
    title: SRE agent handles an alert
    summary: "Planned (phase 6): an alert becomes a root cause and a reviewed fix, never an unapproved change."
    steps:
      - title: Alert fires
        action: "Alertmanager → SRE agent: POST /alerts"
        text: "Alertmanager in mon POSTs to the SRE agent's /alerts webhook with the cluster, namespace and pod labels."
        edges: [mon_sre]
      - title: Read the cluster
        action: "SRE agent ↔ lab cluster: read pods, events and logs"
        text: "The agent reads the lab cluster through the Kubernetes API with a 15-minute read-only token."
        path: [sre_labs, ~sre_labs]
      - title: Find runbooks
        action: "SRE agent ↔ RAG API: search matching runbooks"
        text: "It searches the knowledge base through the RAG API for matching runbooks."
        path: [sre_rag, ~sre_rag]
      - title: Ask for a root cause
        action: "SRE agent → gateway → vLLM chat: what is the root cause?"
        text: "It asks the local model, through the gateway, for a root cause and a proposed fix."
        path: [sre_gw, gw_llm]
      - title: Diagnosis returns
        action: "vLLM chat → gateway → SRE agent: root cause and fix"
        text: "The model's diagnosis comes back through the gateway."
        path: [~gw_llm, ~sre_gw]
      - title: Post to Slack
        action: "SRE agent → Slack: RCA with approve / reject"
        text: "The root cause and proposed fix are posted to Slack with approve and reject buttons."
        edges: [sre_slack]
      - title: Approve, open a PR
        action: "Slack → homelab-gitops: approved fix as a pull request"
        text: "Approving opens a pull request to homelab-gitops; nothing changes without your approval."
        edges: [slack_git]
      - title: Argo CD syncs the fix
        action: "Argo CD ↔ homelab-gitops: sync the merged fix"
        text: "Once merged, Argo CD syncs the fix, so every change is reviewed and reversible."
        path: [argo_git, ~argo_git]
        result: success
        outcome: "Fix deployed through GitOps"
