            how: OpenCost (phase 4), the Karmada agent (phase 1a) and the Litmus chaos agent (phase 2a).
            where: every lab
            api: Planned
          children:
          - id: lab-opencost
            label: OpenCost
            sub: planned · phase 4
            icon: devops/monitoring/opencost-18.svg
            status: planned
            phase: 4
            facts:
              summary: Planned split of the DGX's cost by lab, next to cloud costs.
              how: Prices CPU, memory and GPU requests with custom DGX prices, reading usage from Mimir; no UI.
              where: every k3d cluster
              when: read daily by the inventory
              api: 'Planned: OpenCost allocation API'
          - id: lab-karmada
            label: Karmada agent
            sub: planned · phase 1a
            icon: devops/orchestration/karmada-18.svg
            status: planned
            phase: '1a'
            facts:
              summary: Planned agent that pulls placed add-ons, so Karmada holds no cluster credentials.
              how: Dials out to Karmada, applies the add-ons placed on this cluster and reports their status.
              where: every member cluster
              api: 'Planned: Karmada API server, port 5443'
          - id: lab-chaos
            label: Chaos agent
            sub: planned · phase 2a
            icon: devops/monitoring/litmus-18.svg
            status: planned
            phase: '2a'
            facts:
              summary: Planned chaos agent that runs faults where they are tested.
              how: A subscriber that dials out to ChaosCenter, the chaos operator and the chaos exporter; never node-level stress.
              where: target clusters, labs first
              api: 'Planned: outbound to ChaosCenter'
  - id: clouds
    label: Clouds
    sub: read-only
    icon: cloud
    status: external
    facts:
      summary: Azure, AWS and GCP, read so labs that use the cloud show their cost in the portal.
      how: Read-only identities, rotated every 90 days; read by the inventory from phase 4.
      when: every 6 h (phase 4)
      api: Their resource and cost APIs
    children:
    - id: azure
      label: Azure
      icon: cloud/azure/azure-18.svg
      status: external
      facts:
        summary: Read for the resources and cost of Azure labs.
        how: Resource Graph and Cost Management, as Reader and Cost Management Reader.
        when: every 6 h (phase 4)
        url:
          Azure portal: https://portal.azure.com
        api: Azure Resource Graph · Cost Management API
    - id: aws
      label: AWS
      icon: cloud/aws/amazonwebservices-18.svg
      status: external
      facts:
        summary: Read for the resources and cost of AWS labs.
        how: Resource Explorer and Cost Explorer, as ReadOnly plus `ce:Get*`.
        when: every 6 h (phase 4)
        url:
          AWS console: https://console.aws.amazon.com
        api: Resource Explorer · Cost Explorer API
    - id: gcp
      label: GCP
      icon: cloud/gcp/googlecloudplatform-18.svg
      status: external
      facts:
        summary: Read for the resources and cost of GCP labs.
        how: Cloud Asset Inventory for resources and the BigQuery billing export for cost, as Viewer and BigQuery Data Viewer.
        when: every 6 h (phase 4)
        url:
          GCP console: https://console.cloud.google.com
        api: Cloud Asset Inventory API · BigQuery billing export
  - id: github
    label: GitHub
    sub: repos, Apps
    icon: devops/cicd/github-18.svg
    status: external
    facts:
      summary: 'The source of truth for code and deployments: every change is reviewed and versioned.'
      how: Private repos in the `cloudutsukpilot` org; self-hosted runners poll it and Argo CD reads it.
      url:
        Org: https://github.com/cloudutsukpilot
    children:
    - id: repos
      label: Blog + repos
      sub: content
      icon: devops/cicd/github-18.svg
      status: external
      facts:
        summary: The blog, services, portal, labs and infrastructure, as reviewed commits.
        how: Pushes queue workflows that the self-hosted runners pick up.
        when: every push and PR
        url:
          Org: https://github.com/cloudutsukpilot
        api: GitHub REST API · Actions
    - id: gitops
      label: homelab-gitops
      sub: desired state
      icon: git
      status: built
      facts:
        summary: 'The desired state of every managed cluster: every rollback is a revert.'
        how: App-of-apps, ApplicationSets, Helm values, image digests, policies, dashboards, alert rules and ADRs.
        when: polled every 3 min
        url:
          Repo: https://github.com/cloudutsukpilot/homelab-gitops
    - id: gitops-app
      label: gitops-writer App
      sub: contents:write
      icon: key
      status: built
      facts:
        summary: Lets CI write exactly one repo, with no long-lived token.
        how: The `cloudutsuk-gitops-writer` App has Contents read/write on `homelab-gitops`; the `promote` job mints a short-lived
          token and revokes it.
        when: after every main build
        api: 'Installation token (`contents: write`); key in OpenBao `ci/gitops-writer`'
  - id: saas
    label: External services
    sub: SaaS
    icon: cloud
    color: slate
    status: external
    facts:
      summary: Outside services that do the jobs the homelab can't do for itself.
      how: Outbound HTTPS only; none of them can reach in.
      api: Outbound HTTPS 443
    children:
    - id: slack
      label: Slack
      sub: alerts
      icon: miscellaneous/slack-18.svg
      status: external
      facts:
        summary: Where alerts reach my phone (later also the SRE agent's root causes).
        how: Alertmanager posts through an incoming webhook.
        when: on fire and resolve
        url:
          Slack: https://slack.com
        api: Incoming webhook (URL in `kv/mon/alertmanager`)
    - id: healthchecks
      label: healthchecks.io
      sub: dead-man's switch
      icon: devops/monitoring/healthchecks-18.svg
      status: external
      facts:
        summary: Two dead-man's switches, because a dead DGX or a dead alert path can't alert by itself.
        how: The heartbeat pings every 5 minutes and the Watchdog every minute; a late ping sends an email.
        when: always
        url:
          healthchecks.io: https://healthchecks.io/projects/
        api: Ping URLs (secret)
    - id: letsencrypt
      label: Let's Encrypt
      sub: ACME · Cloudflare DNS-01
      icon: miscellaneous/letsencrypt-18.svg
      status: external
      facts:
        summary: Real certificates for internal names, with nothing exposed to the internet.
        how: 'ACME DNS-01: cert-manager writes TXT records for `cloudutsuk.com` through the Cloudflare API.'
        when: on issue and renewal
        url:
          Cloudflare: https://dash.cloudflare.com/
        api: ACME v2 · Cloudflare DNS API
    - id: backup-blob
      label: Azure Blob
      sub: Velero backups
      icon: cloud/azure/azure-18.svg
      status: external
      facts:
        summary: The off-site copy of Velero's backups, so they survive the DGX itself (ADR 0039).
        how: Account `dvsthomelabbkp01`, Cool tier, versioning and 14-day soft delete; every request needs the key.
        where: Azure · eastus
        when: nightly and Sundays
        url:
          Azure portal: https://portal.azure.com/#browse/Microsoft.Storage%2FStorageAccounts
        api: Azure Blob REST API
  - id: more
    label: More capacity
    sub: later
    icon: cpu
    status: planned
    facts:
      summary: Later capacity behind the gateway, because one GB10 can't scale out.
      how: A second machine or a hosted model added as one more LiteLLM route; callers don't change.
      when: when the queue stays long
      api: 'Planned: through the gateway'

