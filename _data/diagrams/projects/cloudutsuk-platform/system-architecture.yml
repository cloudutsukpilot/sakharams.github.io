# Explorable diagram engine (assets/js/diagram.js; plan in .claude/skills/cloudutsuk-diagram/PLAN.md).
# Cloudutsuk Platform system architecture, from _posts/projects/cloudutsuk-platform/2026-10-10-05-technical-architecture.md,
# updated 2026-10-14 to what is built (Phase 0 and 1 done, Phase 2 and 3 in progress), from the plan's step tables,
# CI/CD and Release Management, Infrastructure and Environments (lab contract v2) and the as-built notes in the
# homelab-gitops ADRs. Components not built yet carry `tone: warn` and a "planned · phase N" sub-label; arrows that
# touch them are dashed.
# Ports: the posts' and repos' values; products' defaults where none is named (Backstage 7007, LiteLLM 4000, vLLM 8000,
# Qdrant 6333, Redis 6379, Postgres 5432, OpenBao 8200, Kubernetes API 6443, BuildKit 1234, MongoDB 27017).
# Collectors send OTLP/HTTP to https://otlp.mon.home.cloudutsuk.com (443) with a bearer token (ADR 0042).
title: Cloudutsuk Platform system architecture
accent: "#F472B6"
accent2: "#FACC15"
level: 1
levels: [Overview, Clusters, Areas, Services, Components]
# Tabs at the top centre: cross-cutting connections stay hidden in the main view until their tab is on.
views:
  - {id: networking, label: Networking, icon: router}
  - {id: observability, label: Observability, icon: chart}
  - {id: security, label: Security, icon: lock}
  - {id: cicd, label: CI/CD, icon: rocket}
  - {id: ops, label: "Backups, chaos, scaling", icon: bolt}

nodes:
  - id: you
    label: You
    sub: phone, laptop
    icon: user
    status: built
    facts:
      summary: 'You: the one operator, reaching every internal UI from a phone or laptop.'
      how: A device on the tailnet opens a `*.home.cloudutsuk.com` name; each tool then signs you in through Keycloak.
      where: anywhere, over Tailscale
      url:
        Portal: https://portal.platform.home.cloudutsuk.com
        Grafana: https://grafana.mon.home.cloudutsuk.com
        Argo CD: https://argocd.platform.home.cloudutsuk.com
  - id: tailnet
    label: Tailscale
    sub: private network
    icon: miscellaneous/tailscale-18.svg
    color: teal
    status: external
    facts:
      summary: A private WireGuard network, so nothing at home is published on the internet (ADR 0037).
      how: Both ends dial out to Tailscale's coordination service; traffic goes device to DGX, encrypted.
      when: always on
      url:
        Tailscale admin: https://login.tailscale.com/admin/machines
    children:
    - id: ts-policy
      label: Policy
      sub: only my login
      icon: lock
      status: built
      facts:
        summary: Lets only my login reach the homelab, so a stolen device or another user gets nothing.
        how: ACL allows `172.30.0.0/24` on 80/443, 53 and 6441-6444; split DNS sends `home.cloudutsuk.com` to PowerDNS.
        where: Tailscale control plane
        when: every connection
        url:
          Access controls: https://login.tailscale.com/admin/acls
        api: '`infra-local/host/tailscale/policy.hujson`'
      detail: Split DNS sends `home.cloudutsuk.com` to PowerDNS on `172.30.0.1:53`.
    - id: ts-router
      label: Subnet router
      sub: tailscaled on the DGX
      icon: router
      status: built
      facts:
        summary: Puts tailnet traffic onto the homelab bridge, so clusters keep private addresses yet stay reachable.
        how: '`tailscaled` advertises `172.30.0.0/24` and forwards to each cluster''s load balancer (core .1, platform .2,
          mon .3, ai .4).'
        where: DGX host, outside the clusters
        when: always on
        api: 'None of its own: routes to `172.30.0.1`–`.4` on the allowed ports'
  - id: homelab
    label: Homelab
    sub: DGX Spark · k3d
    direction: down
    icon: server
    color: violet
    status: built
    facts:
      summary: 'The whole platform on one NVIDIA DGX Spark: hosting costs $0 and the GPU runs local models.'
      how: k3d clusters on one Docker network, `homelab`, reach each other by name; the boot unit starts `core` first.
      where: DGX Spark · 172.30.0.0/24
      when: always on
      url:
        Link page (on the DGX): http://127.0.0.1:4467
    children:
    - id: dgx-host
      label: DGX host services
      sub: systemd and Compose
      icon: terminal
      color: amber
      status: built
      facts:
        summary: Services that need Docker, k3d or the GPU directly, or must survive a cluster being down.
        how: systemd units and a Docker Compose project on the bridge address.
        where: DGX host · 172.30.0.1
        when: always on, from boot
        api: '`172.30.0.1` (8095 lab runner; 9100, 9400, 9101, 9115 exporters)'
      children:
      - id: host-labs
        label: Lab tooling
        sub: runner, lab.sh
        icon: terminal
        status: built
        facts:
          summary: The host side of labs, because labs need Docker, k3d and the lab repos that only the host has.
          how: The portal calls the runner; the runner runs a lab's `make`, which calls `lab.sh`.
          when: on deploy and destroy
          api: http://172.30.0.1:8095
        children:
        - id: runner
          label: Lab runner
          sub: systemd · 8095
          icon: terminal
          status: built
          facts:
            summary: Deploys and destroys labs for the portal, refusing any deploy that would clash on ports or memory (ADR
              0017).
            how: Checks the card's ports and the memory budget, takes a per-lab lock, runs `make up` / `make down` and keeps
              the log; bearer token.
            where: systemd `lab-runner` · 172.30.0.1:8095
            when: on Deploy / Destroy; cloud labs at TTL
            url:
              Health: http://172.30.0.1:8095/healthz
            api:
            - '`POST /v1/labs/{slug}/deploy`'
            - '`POST /v1/labs/{slug}/destroy`'
            - '`GET /v1/labs/{slug}/status`'
            - '`GET /v1/jobs/{id}/logs`'
            - '`GET /v1/capacity`'
          detail: 'Bearer token in OpenBao at `kv/platform/lab-runner`. M3: the OpenTelemetry lab deployed in 8 min 48 s and
            was destroyed in 2 s.'
        - id: lab-sh
          label: lab.sh
          sub: register / unregister
          icon: terminal
          status: built
          facts:
            summary: Joins a lab cluster to the platform or takes it out, so every lab registers the same way (contract v2).
            how: Creates an `argocd-manager` ServiceAccount, the Argo CD cluster secret, the shared `labs` OTLP token and the
              lab's Grafana dashboards.
            where: infra-local/host/labs
            when: end of make up · start of make down
            api:
            - '`lab.sh register <cluster> [dashboards]`'
            - '`lab.sh unregister <cluster>`'
            - '`lab.sh status <cluster>`'
      - id: host-obs
        label: Host monitoring
        sub: exporters, heartbeat
        icon: chart
        status: built
        facts:
          summary: Watches the DGX and every cluster from outside, because a dead cluster can't report on itself.
          how: Exporters that mon scrapes, a heartbeat to healthchecks.io, and the doctor's UIs.
          when: always on
          url:
            Link page: http://127.0.0.1:4467
        children:
        - id: host-exporters
          label: Host exporters
          sub: node, DCGM, cAdvisor, blackbox
          icon: devops/monitoring/prometheus-18.svg
          status: built
          facts:
            summary: GPU, host and per-cluster container metrics, plus probes of core, which has no collector of its own.
            how: node-exporter, DCGM, Docker cAdvisor and blackbox; mon's gateway scrapes them as cluster `dgx`.
            where: Compose · 172.30.0.1
            when: scraped every 30 s
            url:
              cAdvisor: http://172.30.0.1:9101/docker/
              Blackbox: http://172.30.0.1:9115/
            api:
            - http://172.30.0.1:9100/metrics
            - http://172.30.0.1:9400/metrics
          detail: All 10 targets up. The GB10 reports 11 DCGM fields (no framebuffer, XID or row-remap fields).
        - id: heartbeat
          label: Heartbeat
          sub: every 5 min
          icon: clock
          status: built
          facts:
            summary: 'A dead-man''s switch: if the DGX goes silent, healthchecks.io emails me.'
            how: Checks OpenBao is initialised, unsealed and active through core's Traefik, then pings healthchecks.io (`/fail`
              if not).
            where: systemd timer on the DGX
            when: every 5 min
            url:
              healthchecks.io: https://healthchecks.io/projects/
            api: Ping URL in `/etc/homelab/heartbeat-url` (secret)
        - id: doctor
          label: Cluster doctor
          sub: Headlamp, Popeye, links
          icon: devops/orchestration/headlamp-18.svg
          status: built
          facts:
            summary: One place to see every cluster's workloads, a misconfiguration grade and every live link.
            how: Headlamp, Popeye and a link page in containers, reading a merged kubeconfig; nothing is installed in the clusters.
            where: DGX · 127.0.0.1 only
            when: on demand
            url:
              Headlamp: http://127.0.0.1:4466
              Link page: http://127.0.0.1:4467
            api: '`host/doctor/run.sh ui | check | links | refresh`'
          detail: Headlamp v0.45.0, Popeye v0.22.1. Each link tile shows its status code and certificate expiry.
      - id: ghostunnel
        label: Docker over mTLS
        sub: ghostunnel · 2376
        icon: lock
        status: built
        facts:
          summary: Gives the IaC runners Docker without a socket mount or host access (ADR 0040).
          how: Accepts only a client certificate with `CN=homelab-iac` and forwards to the host's Docker socket.
          where: homelab bridge · 172.30.0.10
          when: infra-local plans and applies
          api: '`tcp://172.30.0.10:2376`'
    - id: core
      label: core cluster
      sub: boots first
      icon: cluster
      color: slate
      status: built
      facts:
        summary: 'The cluster everything depends on: identity, secrets, registry, DNS and backups, kept outside Argo CD
          (ADR 0025, 0038).'
        how: Installed by Terragrunt Helm stacks in `infra-local`; it runs no collector, so the host's blackbox probes it.
        where: 172.30.0.1 · API :6441
        when: boots first
        api: https://172.30.0.1:6441
      detail: It runs no collector; the host's blackbox exporter probes its endpoints.
      children:
      - id: trust
        label: Identity + secrets
        sub: Keycloak, OpenBao
        icon: lock
        color: slate
        status: built
        facts:
          summary: 'Who you are and what services may read: the two things every other cluster depends on.'
          how: Keycloak issues OIDC tokens; OpenBao gives each cluster and CI role its own paths.
          where: core
          url:
            Keycloak: https://auth.core.home.cloudutsuk.com
            OpenBao: https://bao.core.home.cloudutsuk.com
        children:
        - id: identity
          label: Identity
          sub: Keycloak + core-db
          icon: iam/keycloak-18.svg
          status: built
          facts:
            summary: 'Keycloak and its database: one OIDC issuer for every tool (ADR 0028).'
            how: Keycloak keeps realm `homelab` in `core-db` and brokers Entra ID.
            where: core
            url:
              Account: https://auth.core.home.cloudutsuk.com/realms/homelab/account/
          children:
          - id: keycloak
            label: Keycloak
            sub: identity
            icon: iam/keycloak-18.svg
            status: built
            facts:
              summary: The one identity provider, so access to every tool is granted or revoked in one place (ADR 0028).
              how: OIDC; brokers Entra ID (Google deferred) and maps groups such as `platform-admins` and `viewers` to roles.
              where: core · realm homelab
              when: every sign-in
              url:
                Account: https://auth.core.home.cloudutsuk.com/realms/homelab/account/
                Admin: https://auth.core.home.cloudutsuk.com/admin/master/console/
              api: https://auth.core.home.cloudutsuk.com/realms/homelab/.well-known/openid-configuration
          - id: core-db
            label: core-db
            sub: Postgres
            icon: databases/postgresql-18.svg
            status: built
            facts:
              summary: 'Keycloak''s realm, groups and Entra ID links: not rebuildable from git, so dumped nightly (ADR 0035).'
              how: PostgreSQL; Keycloak connects over JDBC; Velero's hook dumps it with a read-only role.
              where: core · ns core-db
              when: every sign-in · dump 02:00
              api: '`core-db.core-db.svc.cluster.local:5432`'
        - id: openbao
          label: OpenBao
          sub: secrets, transit
          icon: devsecops/openbao-18.svg
          status: built
          facts:
            summary: The only place secrets live, and the key that signs our images, so nothing secret is in git or GitHub (ADR
              0023).
            how: Kubernetes auth per cluster, GitHub OIDC roles `main` and `pr` for CI, and a non-exportable transit key `cosign`.
            where: core
            when: every secret sync, CI job, signature
            url:
              OpenBao: https://bao.core.home.cloudutsuk.com
            api:
            - https://bao.core.home.cloudutsuk.com/v1/sys/health
            - '`transit/sign/cosign` · `kv/<cluster>/*` · `ci/*`'
      - id: zot
        label: Zot
        sub: registry
        icon: devops/cicd/zot-18.svg
        status: built
        facts:
          summary: Our signed images and a mirror of every upstream image and chart, so pulls survive upstream outages (ADR
            0034).
          how: OCI registry; Cosign signatures and SBOM attestations are stored as referrers next to each image.
          where: core
          when: every push, pull, signature check
          url:
            Registry: https://registry.core.home.cloudutsuk.com
          api: https://registry.core.home.cloudutsuk.com/v2/
      - id: powerdns
        label: PowerDNS
        sub: home zone
        icon: globe
        status: built
        facts:
          summary: 'DNS for `home.cloudutsuk.com`: real names under my domain, so certificates are real too (ADR 0024).'
          how: ExternalDNS in each cluster writes records through its API; the DGX's split DNS asks it.
          where: core · 172.30.0.1:53
          when: every internal lookup
          api:
          - '`172.30.0.1:53` (DNS)'
          - https://pdns-api.core.home.cloudutsuk.com
      - id: core-ops
        label: Backups + chaos
        sub: Velero, LitmusChaos
        icon: devops/orchestration/velero-18.svg
        color: slate
        status: built
        facts:
          summary: Backups of core (built) and the chaos control plane (planned), which must outlive what they protect or
            break.
          how: Velero with a dump hook; LitmusChaos ChaosCenter with its own MongoDB from phase 2a.
          where: core
          url:
            Velero UI: https://velero.platform.home.cloudutsuk.com
        children:
        - id: core-backup
          label: Velero + dumps
          sub: nightly 02:00
          icon: devops/orchestration/velero-18.svg
          status: built
          facts:
            summary: 'Backs up core with the only things git can''t rebuild: Keycloak''s database and OpenBao (ADR 0039).'
            how: The `backup-dumps` hook takes a `pg_dump` (read-only role) and an OpenBao snapshot (snapshot-only policy);
              Kopia uploads to Azure Blob.
            where: core · ns velero
            when: nightly 02:00 · Sundays 02:30
            url:
              Velero UI: https://velero.platform.home.cloudutsuk.com
            api: '`velero backup create --kubecontext k3d-core`'
          detail: 'First run: 714 objects plus 328 KB of dumps.'
        - id: litmus
          label: LitmusChaos
          sub: planned · phase 2a
          icon: devops/monitoring/litmus-18.svg
          status: planned
          phase: '2a'
          facts:
            summary: Planned fault injection to prove the platform survives failures and to feed the SRE agent's evals.
            how: ChaosCenter schedules experiments that agents in target clusters run and score.
            where: core
            url:
            - 'Planned: https://chaos.core.home.cloudutsuk.com'
          children:
          - id: chaoscenter
            label: ChaosCenter
            sub: planned · phase 2a
            icon: devops/monitoring/litmus-18.svg
            status: planned
            phase: '2a'
            facts:
              summary: Planned UI and API for chaos experiments, kept where it stays up while the target breaks.
              how: Holds the ChaosHub of faults; agents dial out to it; probe results become a resilience score; definitions in
                git.
              where: core
              when: on demand, game days
              url:
              - 'Planned: https://chaos.core.home.cloudutsuk.com'
              api: 'Planned: ChaosCenter GraphQL API'
          - id: chaos-db
            label: chaos-db
            sub: planned · MongoDB
            icon: databases/mongodb-18.svg
            status: planned
            phase: '2a'
            facts:
              summary: Planned store for experiment runs and scores; history is an accepted loss.
              how: MongoDB, used only by ChaosCenter; definitions rebuild from git.
              where: core
              api: 'Planned: MongoDB, default port 27017'
    - id: platform
      label: platform cluster
      sub: portal, GitOps, CI
      icon: cluster
      color: indigo
      status: built
      facts:
        summary: The long-lived cluster for the portal, GitOps and CI, apart from the GPU and from identity and secrets.
        how: Bootstrapped by `infra-local`, then managed by its own Argo CD from `homelab-gitops`.
        where: 172.30.0.2 · API :6442
        when: always on
        url:
          Portal: https://portal.platform.home.cloudutsuk.com
        api: https://172.30.0.1:6442
      children:
      - id: portal-area
        label: Portal
        sub: ingress to Backstage
        icon: browser
        color: indigo
        status: built
        facts:
          summary: 'The path to the portal: one front door for labs, cost, chat and cluster views.'
          how: HTTPS ends at Traefik, which forwards to Backstage on port 7007.
          where: platform · ns portal
          url:
            Portal: https://portal.platform.home.cloudutsuk.com
        children:
        - id: traefik-platform
          label: Traefik
          sub: ingress on 172.30.0.2
          icon: miscellaneous/traefik-18.svg
          status: built
          facts:
            summary: 'platform''s ingress: one TLS entry point per cluster on the bridge.'
            how: Ends TLS with the Let's Encrypt certificate for `*.platform.home.cloudutsuk.com` and routes by host.
            where: platform · 172.30.0.2:443
            when: every request
            api: '`172.30.0.2:443`'
        - id: backstage
          label: Backstage
          sub: portal
          icon: devops/cicd/backstage-18.svg
          status: built
          facts:
            summary: 'The self-service portal: labs today, cost and chat later, behind one Keycloak sign-in (ADR 0004).'
            how: A custom Backstage image built by CI; reads for everyone signed in, changes and lab deploys for `platform-admins`.
            where: platform · ns portal
            when: redeployed on every commit
            url:
              Portal: https://portal.platform.home.cloudutsuk.com
            api: '`/api/*` (Backstage backend, port 7007)'
          detail: Reads for everyone signed in; changes and lab deploys for `platform-admins` only. A portal commit was live
            9 min 44 s after the merge.
          children:
          - id: labs-plugin
            label: Labs plugin
            sub: labs-backend
            icon: rocket
            status: built
            facts:
              summary: 'The Labs page: the blog''s lab cards with Deploy and Destroy, behind the runner''s admission checks.'
              how: Its backend reads the cards and calls the lab runner with a bearer token; the job's log survives a reload.
              where: in Backstage
              when: Deploy / Destroy
              url:
                Portal: https://portal.platform.home.cloudutsuk.com
              api: Calls http://172.30.0.1:8095
          - id: inv-plugin
            label: Inventory plugin
            sub: planned · phase 4
            icon: chart
            status: planned
            phase: 4
            facts:
              summary: Planned page showing what each lab costs across Azure, AWS, GCP and the DGX.
              how: Reads the inventory service with an OAuth2 client-credentials token; Sync now triggers a refresh.
              where: in Backstage
              api: 'Planned: inventory HTTP API'
          - id: chat-plugin
            label: Chat plugin
            sub: planned · phase 5
            icon: message
            status: planned
            phase: 5
            facts:
              summary: Planned chat over my posts, labs and code, answered by a local model.
              how: Sends questions to the RAG API; shows streamed answers with citations and a View trace link.
              where: in Backstage
              api: 'Planned: `POST /chat` on the RAG API'
          - id: ops-views
            label: Argo CD + K8s views
            sub: planned · phase 3
            icon: cluster
            status: planned
            phase: 3
            facts:
              summary: Planned cluster views in the portal, so sync and health are visible without opening Argo CD.
              how: 'Backstage''s Argo CD and Kubernetes plugins: every app''s sync and health, every cluster''s workloads.'
              where: in Backstage
              api: 'Planned: Argo CD and Kubernetes APIs'
      - id: platform-services
        label: Platform services
        sub: GitOps, inventory, agent
        icon: gear
        color: violet
        status: built
        facts:
          summary: 'The control point for the fleet: GitOps, the add-ons every cluster runs, and two planned services.'
          how: Argo CD with ApplicationSets by cluster label; inventory and the SRE agent come later.
          where: platform
          url:
            Argo CD: https://argocd.platform.home.cloudutsuk.com
        children:
        - id: gitops-area
          label: GitOps
          sub: Argo CD + Karmada
          icon: devops/cicd/argocd-18.svg
          color: orange
          status: built
          facts:
            summary: How every cluster gets its desired state, so every change is a reviewed commit.
            how: Argo CD syncs `homelab-gitops`; Karmada may place the shared add-ons by label (phase 1a).
            where: platform · ns argocd
            url:
              Argo CD: https://argocd.platform.home.cloudutsuk.com
          children:
          - id: argocd
            label: Argo CD
            sub: hub · 3-min poll
            icon: devops/cicd/argocd-18.svg
            color: orange
            status: built
            facts:
              summary: Deploys every cluster except core from git, so every change is a reviewed commit and drift raises an alert
                (ADR 0038).
              how: Polls `homelab-gitops` and applies through each cluster's API; ApplicationSets pick clusters by label. About
                60 apps in five groups (projects, label `homelab/group`), each limited to its own sources and clusters (ADR 0047).
              where: platform · ns argocd
              when: always on · 3-min poll
              url:
                Argo CD: https://argocd.platform.home.cloudutsuk.com
                Monitoring group: https://argocd.platform.home.cloudutsuk.com/applications?proj=monitoring
                Labs group: https://argocd.platform.home.cloudutsuk.com/applications?proj=labs
              api: '`argocd-server.argocd` (gRPC and REST)'
            detail: Labs (`homelab/addons=monitoring`) get only cert-manager and the monitoring pack.
          - id: karmada
            label: Karmada
            sub: planned · phase 1a
            icon: devops/orchestration/karmada-18.svg
            status: planned
            phase: '1a'
            facts:
              summary: 'Planned placement of the shared add-ons by cluster label: one sync instead of one per cluster.'
              how: Argo CD syncs add-ons once to Karmada; propagation and override policies place them; members pull. If the trial
                fails, ApplicationSets stay.
              where: platform
              api: 'Planned: Karmada API server, port 5443'
        - id: planned-svcs
          label: Planned services
          sub: phases 4 and 6
          icon: gear
          status: planned
          facts:
            summary: Inventory and cost (phase 4) and the SRE agent (phase 6), kept in platform so they work when ai is down.
            how: Services in platform, each with its own database in `platform-db`.
            where: platform
            api: 'Planned: their HTTP APIs'
          children:
          - id: inventory
            label: Inventory
            sub: planned · phase 4
            icon: chart
            status: planned
            phase: 4
            facts:
              summary: Planned collector of resources and cost from Azure, AWS, GCP and the DGX, for one cost view per lab.
              how: Read-only identities per cloud and OpenCost's daily allocation; rows in `platform-db.inventory`.
              where: platform · CronJob + API
              when: every 6 h · Sync now
              api: 'Planned: inventory HTTP API (OAuth2 client credentials)'
          - id: sre
            label: SRE agent
            sub: planned · phase 6
            icon: server
            status: planned
            phase: 6
            facts:
              summary: Planned agent that turns an alert into a root cause and a proposed fix, never an unreviewed change.
              how: Reads clusters with 15-minute read-only tokens, asks RAG and the local model, posts to Slack; approved fixes
                become PRs.
              where: platform
              when: on an alert
              api: 'Planned: `POST /alerts` webhook'
        - id: platform-addons
          label: Cluster add-ons
          sub: also on mon and ai
          icon: gear
          color: sky
          status: built
          facts:
            summary: The same policy, certificates, secrets, DNS, backups and monitoring on every long-lived cluster.
            how: Argo CD ApplicationSets by cluster label; Velero through `infra-local`.
            where: platform, mon, ai
            url:
              Argo CD: https://argocd.platform.home.cloudutsuk.com
          children:
          - id: kyverno
            label: Kyverno
            sub: 7 policies · Deny
            icon: devsecops/kyverno-18.svg
            status: built
            facts:
              summary: Admission control, so only signed, pinned, restricted workloads from Zot can run (ADR 0033).
              how: Seven CEL policies in Deny; the API server calls it for every object; it verifies Cosign signatures and SBOM
                attestations in Zot.
