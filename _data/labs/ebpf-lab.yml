# Hands-on lab card for /tags/ebpf-lab/ (see _includes/lab-index.html).
# Created by the cloudutsuk-learning-lab skill. `experiments` drive the experiment cards in part 6,
# the index tiles and scripts/capture.cjs. `brief` is the author's request, not rendered.
#
# Lab contract v2 (homelab Phase 2, steps 5 and 6): the lab cluster joins the `homelab` network, declares
# `deploy` (ADR 0017) and bundles no LGTM. `make up` registers it with the platform (infra-local
# host/labs/lab.sh), whose monitoring pack sends metrics and logs to mon; OBI sends its traces and RED
# metrics straight to mon's gateway. Every mon query is filtered on cluster lab-ebpf (checked 2026-10-14).
name: eBPF Lab
tag: eBPF Lab
summary: "Swap a k3d cluster's networking for Cilium and watch every flow in Hubble, get RED metrics
  and traces from an app with no instrumentation code, and catch (then kill) a shell's download in a
  container with Falco and Tetragon, all with eBPF on one DGX Spark."
status: Built
created: '2026-10-11'
level: Advanced
duration: about 2 hours
category: hands-on-labs   # Projects tab group (_data/project_catalog.yml)
lab_category: observability   # Labs tab group (_data/lab_catalog.yml)
clouds: [agnostic]
repo:
  path: /home/sakharam/gitrepos/observability/ebpf-lab
platform:
  runtime: "k3d (lab-ebpf) on the homelab network, Cilium as the CNI"
  observability: "Hubble, Tetragon, Falco + Falcosidekick UI, OpenTelemetry eBPF Instrumentation → homelab mon cluster"
  cost: free-local
deploy:              # lab contract v2 (ADR 0017): what the lab runner checks before `make up`
  targets: {up: up, down: down, status: status}
  memory_gb: 7       # the lab's stack plus the monitoring pack and cert-manager (about 1 GB)
  ports: [6450, 8091, 8092, 8093]
facts:
  - {label: Stack, value: "Cilium 1.20, Hubble, Tetragon 1.7, Falco 0.45, OBI 0.13, k3s 1.35, Go, Redis"}
  - {label: Storage, value: "static local PVs bound to PVCs, no hostPath; data survives make rebuild"}
endpoints:
  app: http://127.0.0.1:8091
  hubble: http://127.0.0.1:8092
  falco: http://127.0.0.1:8093
  grafana: https://grafana.mon.home.cloudutsuk.com
capture:
  urls:
    app: http://127.0.0.1:8091
    hubble: http://127.0.0.1:8092
    falco: http://127.0.0.1:8093
    grafana: https://grafana.mon.home.cloudutsuk.com
  viewport: {width: 1440, height: 900}
  color_scheme: dark
  window: 10m
  settle_ms: 3500
  preflight: make status
  cooldown: 20
experiments:
  - id: cilium-cni
    title: See every flow without kube-proxy
    goal: "Send traffic through web, api and redis and see each hop in Hubble, with Cilium's eBPF doing the service load balancing that kube-proxy used to do."
    signals: [events, metrics]
    action:
      say: "Send 120 requests through the app."
      run: make exp-cilium-cni
    predict: "There is no kube-proxy and no iptables service rules. How does a request to the `api` ClusterIP reach a pod, and on which node?"
    wait: 15
    verify: make verify-cilium-cni
    look_for:
      - signal: events
        where: "Hubble UI › namespace demo"
        query: "hubble observe --namespace demo"
        expect: "web → api → redis edges, with flows to the api pod on the other node marked to-overlay (VXLAN)."
      - signal: metrics
        where: "cilium-dbg service list"
        query: "cilium-dbg service list"
        expect: "The api ClusterIP with two backends, translated in eBPF on each pod's veth."
    shots:
      - name: service-map
        phase: after
        url: "hubble:/?namespace=demo"
        steps:
          - {wait_for_text: "redis"}
        viewport: {width: 1440, height: 1000}
        wide: true
        alt: "Hubble UI service map for namespace demo: world, web, api and redis connected by flows"
        caption: "The demo app as Hubble sees it, built only from packets."

  - id: identity-policy
    title: Drop a connection by identity
    goal: "Allow only api pods to talk to redis and watch Cilium drop web's direct connection in eBPF, while the app keeps working."
    signals: [events]
    action:
      say: "Apply the policy, then try to reach redis from the web pod."
      run: make exp-identity-policy
    predict: "The web pod and the api pods share a node network. What does Cilium check to tell them apart?"
    wait: 10
    verify: make verify-identity-policy
    look_for:
      - signal: events
        where: "Hubble UI › namespace demo, then the flows table"
        query: "hubble observe --namespace demo --verdict DROPPED"
        expect: "web → redis:6379 with verdict DROPPED and reason Policy denied, repeated for each SYN retry; api → redis still FORWARDED."
    shots:
      - name: flows
        phase: after
        url: "hubble:/?namespace=demo"
        steps:
          - {wait_for_text: "redis"}
          - {click_text: "Any verdict"}
          - {click_text: "Dropped"}
          - {wait_for_text: "dropped"}
        viewport: {width: 1440, height: 1000}
        wide: true
        alt: "Hubble UI for namespace demo with the web to redis edge shown as dropped and dropped flows in the table"
        caption: "web → redis dropped by policy; the api path is untouched."

  - id: obi-red-metrics
    title: RED metrics from an app with no instrumentation
    goal: "Let OpenTelemetry eBPF Instrumentation watch the Go API and Redis from the kernel and turn their traffic into request rate, errors and duration per route."
    signals: [metrics]
    action:
      say: "Send traffic, then read the HTTP and Redis metrics OBI produced."
      run: make exp-obi-red-metrics
    predict: "The API has no OpenTelemetry, no metrics library, nothing. Where can OBI get the route name /api/visits from?"
    wait: 90    # OBI exports metrics every 60 s, then Mimir needs a sample or two for rate()
    verify: make verify-obi-red-metrics
    look_for:
      - signal: metrics
        where: "Grafana (mon) › Dashboards › Labs › eBPF lab › Requests per route (or Explore, as an Editor)"
        query: 'sum by (http_route) (rate(http_server_request_duration_seconds_count{cluster="lab-ebpf", job=~"demo/.*"}[3m]))'
        expect: "/api/visits, /api/items and /healthz with their request rates, and db_client_operation_duration_seconds for the Redis INCR."
      - signal: metrics
        where: "Grafana (mon) › Dashboards › Labs › eBPF lab"
        query: "Requests per route, Latency p95, Responses by status code, Redis operations"
        expect: "All four OBI panels move with the burst; Redis shows INCR at the /api/visits rate."
    shots:
      - name: red
        phase: after
        url: "grafana:/d/ebpf-lab/?orgId=1&kiosk&from=${from}&to=${to}"
        selector: '[data-viz-panel-key="panel-1"]'
        wide: true
        alt: "Request rate per route for the demo app, produced by eBPF instrumentation"
        caption: "Per-route request rate for a service with no metrics code."
      - name: dashboard
        phase: after
        url: "grafana:/d/ebpf-lab/?orgId=1&kiosk&from=${from}&to=${to}"
        viewport: {width: 1440, height: 1340}
        wide: true
        alt: "The eBPF lab dashboard in mon's Grafana: OBI request, latency, status and Redis panels, the OBI trace table, Tetragon events and Falco alerts"
        caption: "The lab's dashboard in mon after the traffic burst."

  - id: obi-traces
    title: A trace across web, api and redis
    goal: "Follow requests through nginx, the Go API and Redis as traces that OBI builds from the kernel, and find out when its trace context joins them into one trace and when it doesn't."
    signals: [traces]
    action:
      say: "Send six visits, three seconds apart, so the two api pods (one per node) both serve some."
      run: make exp-obi-traces
    predict: "Nobody propagates a traceparent header in this code. Will web's span and the api's span end up in the same trace, whichever api pod answers?"
    wait: 60
    verify: make verify-obi-traces
    look_for:
      - signal: traces
        where: "Grafana (mon) › Dashboards › Labs › eBPF lab › Traces for GET /api/visits, then Trace waterfall"
        query: '{ resource.k8s.cluster.name = "lab-ebpf" && resource.service.name = "web" } >> { resource.service.name = "api" }'
        expect: "Joined traces: demo/web GET /api/visits with demo/api's GET /api/visits and its INCR under it, when web and that api pod share a node."
      - signal: traces
        where: "Same panel, the rows whose Service is api"
        query: '{ resource.k8s.cluster.name = "lab-ebpf" && trace:rootService = "api" && trace:rootName = "GET /api/visits" }'
        expect: "Split traces: demo/api as the root, with INCR and demo/redis's own INCR span, for requests that crossed to the api pod on the other node."
    shots:
      - name: waterfall
        phase: after
        url: "grafana:/d/ebpf-lab/?orgId=1&kiosk&from=${start}&to=${to}&var-trace=${trace_id}"   # trace_id: printed by make verify-obi-traces
        steps:
          - {wait_for_text: "Service & Operation"}
          - {wait: 2000}
        selector: '[data-viz-panel-key="panel-8"]'
        viewport: {width: 1440, height: 2100}
        wide: true
        alt: "Trace waterfall of one visit: demo/web GET /api/visits with demo/api GET /api/visits and its Redis INCR client span nested under it"
        caption: "Joined: web and the api pod on the same node, one trace, no tracing code."
      - name: split
        phase: after
        url: "grafana:/d/ebpf-lab/?orgId=1&kiosk&from=${start}&to=${to}&var-trace=${split_id}"
        steps:
          - {wait_for_text: "Service & Operation"}
          - {wait: 2000}
        selector: '[data-viz-panel-key="panel-8"]'
        viewport: {width: 1440, height: 2100}
        wide: true
        alt: "Trace waterfall rooted at demo/api GET /api/visits with an INCR client span and a demo/redis INCR server span, no web span"
        caption: "Split: the request crossed nodes, so the api started a trace of its own."

  - id: falco-shell
    title: Catch a shell in a container
    goal: "Open a shell in the web pod and see Falco's syscall rules flag it within a second, with pod and container metadata, in the Falcosidekick UI."
    signals: [events]
    action:
      say: "Run a command through kubectl exec in the web pod."
      run: make exp-falco-shell
    predict: "kubectl exec without -t has no terminal, so Falco's stock rule doesn't fire. What else in the event could identify this as suspicious?"
    wait: 10
    verify: make verify-falco-shell
    look_for:
      - signal: events
        where: "Falcosidekick UI › Events"
        query: 'rule = "Shell in demo pod"'
        expect: "A WARNING with the command line, uid 101, pod web-… and namespace demo, resolved from k3s's containerd."
      - signal: logs
        where: "Grafana (mon) › Dashboards › Labs › eBPF lab › Falco alerts from the lab rules"
        query: '{k8s_cluster_name="lab-ebpf", k8s_namespace_name="falco", k8s_container_name="falco"} |= "ebpf_lab"'
        expect: "The same alert as a log line, kept in mon with the rest of the lab's signals."
    shots:
      - name: events
        phase: after
        url: "falco:/"
        steps:
          - {fill: ['input[required][type="text"]', "admin"]}    # the chart's default UI login; the port is bound to 127.0.0.1
          - {fill: ['input[type="password"]', "admin"]}
          - {click: 'button:has-text("Login")'}
          - {click_text: "EVENTS"}
          - {wait_for_text: "Shell in demo pod"}
        viewport: {width: 1440, height: 1000}
        wide: true
        alt: "Falcosidekick UI dashboard with the Shell in demo pod event from the web pod"
        caption: "Falco's view: the shell, who ran it and where."

  - id: tetragon-enforce
    title: Kill a download before it starts
    goal: "Apply a Tetragon policy that SIGKILLs any process in a demo pod that calls execve() for wget, curl or nc, run wget, and compare what Tetragon and Falco each record."
    signals: [events, logs]
    action:
      say: "Apply the Tetragon policy, then run wget from the web pod."
      run: make exp-tetragon-enforce
    predict: "In experiment 2, Falco raised a CRITICAL Network tool alert for nc. Will it raise one for wget now that Tetragon guards execve()?"
    wait: 10
    verify: make verify-tetragon-enforce
    look_for:
      - signal: events
        where: "Falcosidekick UI › Events"
        query: 'rule = "Shell in demo pod" or rule = "Network tool in demo pod"'
        expect: "Only Shell in demo pod for the sh -c wget command. No Network tool alert for wget: it never started. The CRITICAL one in the list is experiment 2's nc."
      - signal: logs
        where: "Grafana (mon) › Dashboards › Labs › eBPF lab › Tetragon process events (or make tetragon-events)"
        query: '{k8s_cluster_name="lab-ebpf", k8s_container_name="export-stdout"} |= "SIGKILL"'
        expect: "The shell's exec, then KPROBE_ACTION_SIGKILL on __arm64_sys_execve for /bin/sh with policy block-network-tools, then that sh exiting with SIGKILL; the command prints wget exit=137."
    shots:
      - name: falco
        phase: after
        url: "falco:/"
        steps:
          - {fill: ['input[required][type="text"]', "admin"]}    # the chart's default UI login; the port is bound to 127.0.0.1
          - {fill: ['input[type="password"]', "admin"]}
          - {click: 'button:has-text("Login")'}
          - {click_text: "EVENTS"}
          - {wait_for_text: "wget"}
        viewport: {width: 1440, height: 1000}
        wide: true
        alt: "Falcosidekick UI events: Shell in demo pod warnings for the sh -c wget command and no Network tool alert for wget"
        caption: "Falco saw the shell, not wget: Tetragon killed it inside execve()."
      - name: tetragon
        phase: after
        url: "grafana:/d/ebpf-lab/?orgId=1&kiosk&from=${start}&to=${to}"
        selector: '[data-viz-panel-key="panel-6"]'
        viewport: {width: 1440, height: 1900}   # panel 6 is below the fold; Grafana renders only visible panels
        wide: true
        alt: "Tetragon process events panel in Grafana: the shell's exec, KPROBE_ACTION_SIGKILL on execve with policy block-network-tools, and the shell exiting with SIGKILL"
        caption: "Tetragon's event: the execve that never completed."

  - id: rebuild-persists
    title: Delete the cluster and keep the data
    goal: "Delete and recreate the whole cluster and see Redis come back with the same counter, because its PVC re-binds to a static local PV over the same host folder."
    signals: [events]
    action:
      say: "Note the visit count, rebuild the cluster from scratch, then count a visit again."
      run: make exp-rebuild-persists
      browser:
        url: app:/
        steps: [{wait_for_text: "served by"}]
    predict: "k3d deletes both node containers. Where does the counter live, and which object makes the new Redis pod find it?"
    wait: 10
    verify: make verify-rebuild-persists
    look_for:
      - signal: events
        where: "The app page"
        query: "GET /api/visits"
        expect: "The counter continues from its value before the rebuild instead of starting at 1."
    shots:
      - name: before
        phase: before
        url: "app:/"
        steps: [{wait_for_text: "served by"}]
        alt: "Demo app page showing the visit counter before the rebuild"
        caption: "Before: the counter in Redis."
      - name: after
        phase: after
        url: "app:/"
        steps: [{wait_for_text: "served by"}]
        alt: "Demo app page after a full cluster rebuild, the counter continuing from before"
        caption: "After a full rebuild: same data, new cluster."
brief: |
  Author's request (2026-10-11), with this context pasted from another session:
  "Better options that keep the 'survives a rebuild' property: Static local PVs and PVCs ... Point the
  local-path provisioner at /srv/homelab ... Where eBPF could fit, from least to most effort: Grafana
  Beyla, now OpenTelemetry eBPF Instrumentation ... Runtime security with Tetragon or Falco ... Cilium
  as the CNI ... would need recreating with flannel and the built-in policy controller turned off;
  the k3d nodes need the BPF filesystem mounted; it uses more memory per cluster; it would deserve its
  own ADR."
  "Similar to opentelemetry lab project, I would like to create a project to understand eBPF
  instrumentation, runtime security and Cilium as the CNI in a controlled lab environment. I would
  like setting up a dedicated k3d cluster, experimenting with the different eBPF tools, and
  documenting the findings and best practices. Please create a new lab project for eBPF
  experimentation, covering instrumentation, runtime security, and Cilium as the CNI. Use PV and PVCs
  whenever possible to ensure data persists across node rebuilds and we dont mount local paths
  directly."
  Answers: name eBPF Lab, repo ~/gitrepos/observability/ebpf-lab; runtime security: both Falco and
  Tetragon, compared; no bundled LGTM: use the platform's (homelab mon cluster, Phase 2).
