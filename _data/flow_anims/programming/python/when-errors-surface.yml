steps:
  - { lights: [JW, PW], title: "Same bug, two languages", text: "Both programs have the same typo inside a function that only runs when a user clicks one specific button." }
  - { edges: [JWC], title: "Java/C: compile step", text: "Before anything runs, the compiler checks every name and type in the whole program." }
  - { edges: [JCX], title: "Caught before running", text: "The unknown name fails the build. The bug never reaches a user, but you wait for a compile on every change." }
  - { edges: [JXF], title: "Fix and run", text: "You fix the typo, rebuild and only then see the program run." }
  - { edges: [PWT], when: test, title: "A test exercises the handler", text: "A pytest test calls the button handler directly, so that line actually executes." }
  - { edges: [PTX], when: test, title: "Caught in CI", text: "The NameError fails the test run instead of a user's session. In Python, tests are your compiler-style safety net." }
  - { edges: [PWR], title: "Python: just run it", text: "No build step. Python compiles to bytecode on the fly and starts running straight away." }
  - { edges: [PRO], title: "Everything looks fine", text: "The paths you tried work. The typo sits in a line nobody has executed yet, so nothing complains." }
  - { edges: [POB], when: notest, title: "Someone clicks the button", text: "Days later a user triggers the rarely used handler and the VM finally reaches the broken line." }
  - { edges: [PBE], when: notest, title: "Runtime error", text: "NameError: name 'totl' is not defined. Python only reports it when that line runs, here in production." }
