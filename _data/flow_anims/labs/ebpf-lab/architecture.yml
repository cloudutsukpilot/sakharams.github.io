steps:
  - lights: [CL]
    title: A visit
    text: "curl or the Count a visit button calls /api/visits on 127.0.0.1:8091, which k3d maps to NodePort 30091 on the server node."
  - edges: [CL_WEB]
    title: No kube-proxy
    text: "Cilium's eBPF programs translate the NodePort to the web pod. k3s runs with no kube-proxy and no iptables Service rules."
  - edges: [WEB_API]
    title: nginx proxies /api
    text: "nginx sends it to the api Service on HTTP :8080. Cilium picks one of two api pods on the pod's veth, sometimes on the other node, over VXLAN."
  - edges: [API_RD]
    title: INCR in Redis
    text: "The Go API opens a connection, sends INCR visits to Redis :6379 in its own protocol and returns the count. It has no tracing, metrics or logging library."
  - edges: [RD_PV]
    title: Data on a static PV
    text: "Redis appends every write to its AOF on a PVC bound to a static local PV, so the counter outlives the whole cluster."
  - edges: [WEB_CIL, API_OBI]
    lights: [CIL, OBI, TET, FAL]
    title: eBPF sees it all
    text: "Four eBPF tools watch from the kernel the k3d nodes share: packets (Cilium), HTTP and Redis calls (OBI), process executions (Tetragon, Falco)."
  - edges: [CIL_HUB]
    title: Flows in Hubble
    text: "Cilium records every flow with its source and destination identity and verdict. Hubble Relay gathers both nodes for the UI."
  - edges: [OBI_GW]
    title: OBI to mon, directly
    text: "OBI turns the traffic into RED metrics and spans and sends OTLP straight to mon's gateway, because a host-network pod can't reach the agent here."
  - edges: [TET_AGT, FAL_AGT, FAL_FSK]
    title: Security events
    text: "Tetragon and Falco write JSON events to stdout; the platform's agent tails them like any pod log. Falcosidekick also shows Falco's in its UI."
  - edges: [AGT_GW]
    title: The monitoring pack
    text: "The agent collector, installed by Argo CD when make up registered the lab, ships logs and metrics to the gateway with the labs token."
  - edges: [GW_LG]
    title: One cluster label
    text: "The gateway turns k8s.cluster.name into cluster=lab-ebpf; Mimir, Loki and Tempo keep the lab's data next to every other cluster's."
  - edges: [LG_GR]
    title: The lab's dashboard
    text: "Grafana on mon shows the eBPF lab dashboard in folder Labs, every query filtered on lab-ebpf."
