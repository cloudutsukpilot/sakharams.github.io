# Animated flow diagram for _posts/labs/opentelemetry-lab/2026-10-08-01-overview.md
# (include id: labs/opentelemetry-lab/architecture), reused in part 7.
# The request path of one click on "Call /api/demo", then how each signal reaches Grafana.
# Facts from ~/gitrepos/observability/otel-static-site-k3d at 8fbd1b1.
title: OpenTelemetry End to End, request and signal paths
accent: "#22D3EE"
accent2: "#A3E635"
viewbox: [1000, 560]
modes:
  - { id: miss, label: "Cache miss" }
  - { id: hit, label: "Show a cache hit instead" }

lanes:
  - { label: "Request path", x: 8, y: 8, w: 984, h: 236 }
  - { label: "Telemetry path", x: 8, y: 256, w: 984, h: 296 }

nodes:
  - { id: BR, label: "Browser", sub: "otel.js", x: 90, y: 80, w: 140, h: 56, icon: browser }
  - { id: TR, label: "Traefik", sub: "ingress", x: 280, y: 80, w: 150, h: 56, icon: balancer }
  - { id: NG, label: "nginx", sub: "static files", x: 375, y: 190, w: 130, h: 56 }
  - { id: API, label: "API", sub: "FastAPI", x: 470, y: 80, w: 150, h: 56, icon: api }
  - { id: BK, label: "Backend", sub: "FastAPI", x: 660, y: 80, w: 150, h: 56, icon: server }
  - { id: RD, label: "Redis", sub: "cache", x: 880, y: 62, w: 130, h: 62, shape: cylinder, icon: bolt }
  - { id: SQ, label: "SQLite", sub: "records", x: 880, y: 178, w: 130, h: 62, shape: cylinder }
  - { id: COL, label: "OTel Collector", sub: "DaemonSet", x: 470, y: 380, w: 170, h: 56, icon: chart }
  - { id: EXP, label: "nginx exporter", sub: ":9113/metrics", x: 190, y: 360, w: 160, h: 50, icon: chart, icon_pos: corner }
  - { id: LOG, label: "Pod log files", sub: "/var/log/pods", x: 190, y: 470, w: 160, h: 50, icon: chart, icon_pos: corner }
  - { id: TE, label: "Tempo", sub: "traces", x: 720, y: 318, w: 130, h: 56, shape: cylinder, icon: chart }
  - { id: LO, label: "Loki", sub: "logs", x: 720, y: 410, w: 130, h: 56, shape: cylinder, icon: "devops/monitoring/loki-18.svg" }
  - { id: PR, label: "Prometheus", sub: "metrics", x: 720, y: 502, w: 130, h: 56, shape: cylinder, icon: "devops/monitoring/prometheus-18.svg", icon_pos: corner }
