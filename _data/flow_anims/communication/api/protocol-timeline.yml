steps:
  - lights: [A]
    title: 1991, HTTP
    text: Tim Berners-Lee's HTTP fetches documents with a request and a response. Almost every protocol in this series runs on it or starts from it.
  - edges: [AB]
    title: 1998, XML-RPC and SOAP
    text: Enterprises want to call remote procedures across firewalls and languages, so they wrap calls in XML and send them over HTTP POST.
  - edges: [BC]
    title: 1999, MQTT
    text: IBM and Arcom need a tiny publish/subscribe protocol for oil pipeline sensors on expensive, unreliable satellite links.
  - edges: [CD]
    title: 2000, REST
    text: Roy Fielding's dissertation describes the architecture of the web itself, resources, URLs, verbs and caching, as a style for APIs.
  - edges: [DE]
    title: 2003, AMQP
    text: JPMorgan Chase starts an open, interoperable wire protocol for reliable business messaging to replace proprietary middleware.
  - edges: [EF]
    title: 2006, Comet and SSE
    text: Web apps like chat need server push. Long polling and streaming (Comet) work around HTTP, and Server-Sent Events standardise one-way streams.
  - edges: [FG]
    title: 2007, Webhooks
    text: Jeff Lindsay names the pattern of user-defined HTTP callbacks, so services can notify each other instead of being polled.
  - edges: [GH]
    title: 2011, WebSocket
    text: RFC 6455 gives browsers a real full-duplex connection, ending the Comet workarounds for chat, games and live data.
  - edges: [HI]
    title: 2015, gRPC
    text: Google open-sources the successor of its internal Stubby RPC system, built on HTTP/2 and Protocol Buffers.
  - edges: [IJ]
    title: 2015, GraphQL
    text: Facebook open-sources the query language it built in 2012 for its mobile News Feed, to fetch nested data in one request.
  - edges: [JK]
    title: 2022, HTTP/3
    text: HTTP moves onto QUIC over UDP (RFC 9114), removing TCP head-of-line blocking for every protocol that rides on HTTP.
