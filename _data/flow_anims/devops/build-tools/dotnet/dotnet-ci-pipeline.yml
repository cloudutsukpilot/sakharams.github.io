steps:
  - lights: [A]
    title: "Source + project files"
    text: "A commit triggers CI. Project and solution files, Directory.Packages.props and packages.lock.json define the build; global.json pins the SDK."
  - edges: [AB]
    title: "Restore"
    text: "dotnet restore --locked-mode restores exactly what packages.lock.json says from NuGet; NuGet audit warns about vulnerable packages."
  - edges: [BC]
    title: "Lint and format"
    text: "dotnet format --verify-no-changes fails if the code does not match .editorconfig and the analyzer style rules."
  - edges: [CD]
    title: "Compile"
    text: "dotnet build -c Release --no-restore compiles with MSBuild; -warnaserror turns analyzer warnings, including security rules, into errors."
  - edges: [DE]
    title: "Test and coverage"
    text: "dotnet test runs xUnit, NUnit or MSTest, and --collect:\"XPlat Code Coverage\" records coverage with Coverlet."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "Roslyn security analyzers check our code, dotnet list package --vulnerable --include-transitive checks dependencies, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Format, the build with analyzers as errors, the tests and the vulnerability report must pass before publishing."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Publish the output"
    text: "dotnet publish -c Release writes the deployable output; dotnet pack builds a .nupkg for libraries."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "dotnet CycloneDX writes the SBOM for the solution, and the output is signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "Packages go to a NuGet feed (nuget.org, Azure Artifacts, GitHub Packages); deployable output is kept as a CI artifact."
