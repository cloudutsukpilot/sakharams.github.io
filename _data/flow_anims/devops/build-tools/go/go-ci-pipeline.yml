steps:
  - lights: [A]
    title: "Source + go.mod"
    text: "A commit triggers CI. go.mod lists the module requirements and go.sum records their checksums."
  - edges: [AB]
    title: "Download and verify modules"
    text: "go mod download fetches modules through GOPROXY (proxy.golang.org or a private proxy), and go mod verify checks them against go.sum."
  - edges: [BC]
    title: "Lint and format"
    text: "gofmt -l must print nothing, then go vet, staticcheck and golangci-lint catch suspicious code."
  - edges: [CD]
    title: "Compile"
    text: "CGO_ENABLED=0 go build -trimpath produces a static binary, with the version stamped in through -ldflags."
  - edges: [DE]
    title: "Test and coverage"
    text: "go test -race -coverprofile=cover.out ./... runs the tests with the race detector; go tool cover summarises coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "gosec checks our code, govulncheck reports only vulnerabilities in code paths we actually call, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Formatting, vet, lint, tests and both scanners are required checks; any failure stops the release."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Cross-compile and package"
    text: "GoReleaser cross-compiles for each OS and architecture and builds archives and checksums from .goreleaser.yaml."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "GoReleaser produces SBOMs and signatures from the same config; cyclonedx-gomod is the standalone SBOM tool."
  - edges: [KL]
    when: pass
    title: "Store the release"
    text: "Binaries and archives are kept as release assets or in an artifact repository; the CI job stores them with actions/upload-artifact."
  - edges: [LM]
    when: pass
    title: "Container image"
    text: "ko builds a minimal container image for the Go binary without a Dockerfile, and the registry scans it again."
