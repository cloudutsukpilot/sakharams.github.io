# `when: <mode id>` limits a step to one run mode; the checkbox switches to the second mode.
steps:
  - lights: [A]
    title: Source + lockfile
    text: A commit triggers the build. The lockfile pins every dependency version so each run resolves the same graph.
  - edges: [AB]
    title: Restore dependencies
    text: Are dependencies pinned and reachable? The package manager restores them from the lockfile, ideally through a private registry proxy.
  - edges: [BC]
    title: Lint and format check
    text: Does the code follow the agreed style and avoid obvious bugs? Linters, formatters and type checkers fail fast and cheaply.
  - edges: [CD]
    title: Compile / bundle
    text: Does it build, reproducibly? The compiler, build tool or bundler produces the build output.
  - edges: [DE]
    title: Unit tests + coverage
    text: Does it behave correctly, and how much is covered? The test framework runs and a coverage report is produced.
  - edges: [EF, EG, EH]
    title: Security scans in parallel
    text: SAST checks our code for vulnerable patterns, SCA checks our dependencies for known CVEs and bad licences, and a secrets scanner looks for committed keys or tokens.
  - edges: [FI, GI, HI]
    title: Quality gate
    text: Test, coverage and scan results are evaluated against the agreed thresholds in one place.
  - edges: [IX]
    when: fail
    title: Fail the build
    text: The gate fails, so the pipeline stops here. Nothing is packaged, signed or published.
  - edges: [IJ]
    when: pass
    title: Package artifact
    text: The gate passes and the build output is packaged as an artifact (JAR, wheel, npm package, binary or image).
  - edges: [JK]
    when: pass
    title: SBOM + signing
    text: What exactly did we ship, and can we prove it? An SBOM is generated and the artifact is signed.
  - edges: [KL]
    when: pass
    title: Artifact repository
    text: The signed artifact and its SBOM are published to the artifact repository.
  - edges: [LM]
    when: pass
    title: Container image scan
    text: Images are scanned again in the registry, so CVEs disclosed after the build are still caught.
