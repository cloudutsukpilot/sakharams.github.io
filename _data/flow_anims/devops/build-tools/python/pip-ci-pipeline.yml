steps:
  - lights: [A]
    title: "Source + pyproject.toml"
    text: "A commit triggers CI. pyproject.toml declares the project and build backend, and requirements.txt (compiled by pip-tools) pins versions with hashes."
  - edges: [AB]
    title: "Install"
    text: "pip install -r requirements.txt --require-hashes in a fresh venv installs exactly the locked versions; CI caches ~/.cache/pip."
  - edges: [BC]
    title: "Lint and format"
    text: "ruff check . && ruff format --check . lint and check formatting; mypy or Pyright add type checking."
  - edges: [CD]
    title: "Install the project"
    text: "pip install -e \".[dev]\" installs the project and its dev tools, so tests run against the real package metadata."
  - edges: [DE]
    title: "Test and coverage"
    text: "pytest --cov=src --cov-fail-under=80 runs the tests and fails if line coverage drops below 80%."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "bandit -r src -ll checks our code, pip-audit checks the dependencies against known vulnerabilities, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Lint, tests with the 80% coverage gate and both scanners are required checks; one failure stops the pipeline."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Build the distributions"
    text: "python -m build creates the wheel (.whl) and sdist (.tar.gz) in dist/, and twine check validates their metadata."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "cyclonedx-py writes sbom.json from requirements.txt, and the distributions are signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "twine upload publishes dist/ to PyPI or a private index (Artifactory, Nexus, devpi)."
