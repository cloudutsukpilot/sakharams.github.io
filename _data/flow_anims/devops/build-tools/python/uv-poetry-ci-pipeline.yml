steps:
  - lights: [A]
    title: "Source + lockfile"
    text: "A commit triggers CI. pyproject.toml and a universal lockfile (uv.lock or poetry.lock) pin every dependency for every platform."
  - edges: [AB]
    title: "Sync the environment"
    text: "uv python install reads .python-version, then uv sync --locked (or poetry sync) makes .venv match the lock and fails if it is stale."
  - edges: [BC]
    title: "Lint and format"
    text: "uv run ruff check . and uv run ruff format --check . lint the code and check formatting."
  - edges: [CD]
    title: "Type check"
    text: "uv run mypy src checks type annotations before any test runs."
  - edges: [DE]
    title: "Test and coverage"
    text: "uv run pytest --cov=src --cov-fail-under=80 runs the tests and fails below 80% line coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "uv run bandit checks our code, uv export plus uvx pip-audit checks the locked dependencies (OSV-Scanner reads uv.lock directly), and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Lint, types, tests with the coverage gate and both scanners must pass before anything is built."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Build the distributions"
    text: "uv build (or poetry build) writes the wheel and sdist to dist/."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "uvx --from cyclonedx-bom cyclonedx-py environment .venv writes sbom.json, and the distributions are signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "uv publish (or poetry publish) uploads dist/ to PyPI or a private index."
