steps:
  - lights: [A]
    title: "Source + build scripts"
    text: "A commit triggers CI. settings.gradle.kts, the module build.gradle.kts files and libs.versions.toml define the app; gradlew pins Gradle."
  - edges: [AB]
    title: "Resolve dependencies"
    text: "Gradle and the Android Gradle Plugin resolve dependencies from Google Maven and Maven Central; setup-gradle caches them."
  - edges: [BC]
    title: "Lint and format"
    text: "./gradlew lint runs Android Lint (including security checks), and ktlintCheck and detekt cover Kotlin style and smells."
  - edges: [CD]
    title: "Compile"
    text: "./gradlew assembleDebug compiles Kotlin and Java, merges resources and builds a debug APK."
  - edges: [DE]
    title: "Test and coverage"
    text: "./gradlew testDebugUnitTest runs the JVM unit tests (including Robolectric), and koverXmlReport records coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "mobsfscan and the Android Lint security checks cover our code, ./gradlew dependencyCheckAnalyze checks dependencies, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Tests, coverage and every scanner are required checks, so a single failure stops the pipeline here."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Build the app bundle"
    text: "./gradlew bundleRelease builds the release .aab, shrunk by R8; keep mapping.txt to read crash reports."
  - edges: [JK]
    when: pass
    title: "Sign"
    text: "The bundle is signed with the upload keystore decoded from CI secrets; Play App Signing re-signs it with the app signing key."
  - edges: [KL]
    when: pass
    title: "Upload to Google Play"
    text: "The signed .aab is uploaded to Google Play, which signs and delivers optimised APKs to each device."
