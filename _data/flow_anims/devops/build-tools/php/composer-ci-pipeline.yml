steps:
  - lights: [A]
    title: "Source + composer.lock"
    text: "A commit triggers CI. composer.json declares dependencies, composer.lock pins them, and composer validate --strict checks the two agree."
  - edges: [AB]
    title: "Install"
    text: "composer install --no-interaction --prefer-dist installs exactly composer.lock from Packagist; CI caches Composer's download cache."
  - edges: [BC]
    title: "Lint and format"
    text: "vendor/bin/php-cs-fixer fix --dry-run --diff fails on formatting changes; PHP_CodeSniffer and Laravel Pint are alternatives."
  - edges: [CD]
    title: "Static analysis"
    text: "PHP has no compile step, so vendor/bin/phpstan analyse finds type errors and bugs before the tests run."
  - edges: [DE]
    title: "Test and coverage"
    text: "vendor/bin/phpunit --coverage-text runs the tests, with coverage from PCOV or Xdebug."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "vendor/bin/psalm --taint-analysis traces untrusted input to dangerous sinks, composer audit checks dependencies, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Tests, coverage and every scanner are required checks, so a single failure stops the pipeline here."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Production build"
    text: "composer install --no-dev --optimize-autoloader --classmap-authoritative builds the production vendor/ tree; Box can package a PHAR."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "Syft generates the SBOM, and Sigstore cosign signs the release."
  - edges: [KL]
    when: pass
    title: "Ship"
    text: "The app and its vendor/ directory ship as a container image to a registry; libraries are published through Packagist instead."
