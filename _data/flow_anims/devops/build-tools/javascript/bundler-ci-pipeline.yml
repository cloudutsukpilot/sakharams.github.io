steps:
  - lights: [A]
    title: "Source + configs"
    text: "A commit triggers CI. tsconfig.json and the bundler config (vite.config.ts, webpack.config.js) define how sources become dist/."
  - edges: [AB]
    title: "Install"
    text: "npm ci installs the exact dependency tree from the lockfile, including the bundler and compiler."
  - edges: [BC]
    title: "Lint and type check"
    text: "npx tsc --noEmit fails on type errors, and npx eslint . --max-warnings 0 fails on any lint warning."
  - edges: [CD]
    title: "Bundle"
    text: "npx vite build writes hashed JS/CSS chunks, source maps and assets to dist/. webpack, Rspack and esbuild are alternatives."
  - edges: [DE]
    title: "Test and coverage"
    text: "npx vitest run --coverage runs unit tests with V8 coverage; Playwright or Cypress test in the browser."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "semgrep scan --config p/typescript checks our code, npm audit (and Retire.js for vendored browser libraries) checks dependencies, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Type check, lint, tests and scans must all pass before dist/ is accepted as a release candidate."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Analyse the bundle"
    text: "size-limit or source-map-explorer checks what went into dist/, so bundle-size regressions are caught."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "An SBOM of the bundled dependencies is generated with cyclonedx-npm, and the dist/ artifact is signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Store the build"
    text: "The CI job uploads dist/ as a build artifact (actions/upload-artifact) for the deploy stage."
