steps:
  - lights: [A]
    title: "Source + lockfile"
    text: "A commit triggers CI. package.json and exactly one committed lockfile (package-lock.json, pnpm-lock.yaml or yarn.lock) define the dependency graph."
  - edges: [AB]
    title: "Install from the lockfile"
    text: "npm ci (pnpm install --frozen-lockfile, yarn install --immutable) installs exactly the lockfile and fails if it disagrees with package.json."
  - edges: [BC]
    title: "Lint and format"
    text: "npm run lint runs ESLint from a package.json script; Prettier or Biome check formatting."
  - edges: [CD]
    title: "Build"
    text: "npm run build runs the project's build script, for example tsc or a bundler."
  - edges: [DE]
    title: "Test and coverage"
    text: "npm test runs Jest, Vitest or node --test; add --coverage for Istanbul / c8 coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "semgrep scan --config p/nodejs checks our code, npm audit --audit-level=high --omit=dev checks production dependencies, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Lint, tests, coverage and the audit are required checks. One failure stops the pipeline before anything is packed."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Package"
    text: "npm pack builds the .tgz tarball exactly as the registry would receive it."
  - edges: [JK]
    when: pass
    title: "SBOM and provenance"
    text: "npx @cyclonedx/cyclonedx-npm writes sbom.json, and npm publish --provenance adds signed build provenance."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "npm publish --provenance --access public uploads to npmjs.com or a private registry; consumers verify with npm audit signatures."
