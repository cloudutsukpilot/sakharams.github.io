steps:
  - lights: [A]
    title: "Source + configure.ac"
    text: "A commit triggers CI. configure.ac and Makefile.am describe the build; autoreconf -fi generates configure and Makefile.in."
  - edges: [AB]
    title: "Dependencies"
    text: "System libraries come from the OS package manager (apt-get in CI) and are found by pkg-config during configure."
  - edges: [BC]
    title: "Configure"
    text: "./configure CFLAGS=\"-O2 -Wall -Wextra -Werror\" checks the toolchain and writes Makefile and config.h; warnings become errors."
  - edges: [CD]
    title: "Build"
    text: "make builds in parallel; bear -- make records compile_commands.json so clang-tidy can analyse the code."
  - edges: [DE]
    title: "Test and coverage"
    text: "make check runs the Automake test harness; a --coverage build plus gcovr --fail-under-line 80 enforces coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "scan-build --status-bugs and cppcheck check our code, Syft and Grype scan the resulting packages or image, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "make check and the analyzers must pass, and releases are gated on make distcheck."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Release tarball"
    text: "make distcheck builds the release tarball, unpacks it, then builds and tests it out of tree."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "Syft generates the SBOM for the tarball or packages, and Sigstore cosign signs them."
  - edges: [KL]
    when: pass
    title: "Store the tarball"
    text: "CI keeps the tarball with actions/upload-artifact; distributions repackage it as .deb or .rpm."
