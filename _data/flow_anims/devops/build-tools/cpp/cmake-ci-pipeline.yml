steps:
  - lights: [A]
    title: "Source + CMakeLists.txt"
    text: "A commit triggers CI. CMakeLists.txt and CMakePresets.json define the build; conanfile.txt or vcpkg.json declare the dependencies."
  - edges: [AB]
    title: "Dependencies"
    text: "conan install . --build=missing fetches or builds the dependencies (vcpkg manifest mode is the alternative); conan.lock pins versions."
  - edges: [BC]
    title: "Configure"
    text: "cmake --preset release generates the Ninja build files and compile_commands.json for the analyzers."
  - edges: [CD]
    title: "Build"
    text: "cmake --build --preset release compiles with Ninja; ccache or sccache avoid recompiling unchanged files."
  - edges: [DE]
    title: "Test and coverage"
    text: "ctest runs the GoogleTest or Catch2 tests; a coverage preset plus gcovr --fail-under-line 80 enforces coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "clang-tidy and cppcheck check our code, Trivy or Grype scan the Conan / vcpkg manifests (Black Duck adds snippet matching), and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "The build, tests, coverage gate, analyzers and a sanitizer build must pass before packaging."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Package"
    text: "cpack builds the release package (.tar.gz, .deb, .rpm or .zip) from the install rules."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "Syft generates the SBOM from the package, and Sigstore cosign signs it."
  - edges: [KL]
    when: pass
    title: "Store the package"
    text: "CI keeps the package with actions/upload-artifact; libraries can also be published to a Conan remote."
