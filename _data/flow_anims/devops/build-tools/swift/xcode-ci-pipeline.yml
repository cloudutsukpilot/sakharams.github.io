steps:
  - lights: [A]
    title: "Source + Package.swift"
    text: "A commit triggers CI. Package.swift and Package.resolved pin the Swift packages, and the Xcode project or workspace defines the app."
  - edges: [AB]
    title: "Resolve packages"
    text: "xcodebuild -resolvePackageDependencies fetches the exact versions in Package.resolved; CI caches SourcePackages and DerivedData."
  - edges: [BC]
    title: "Lint and format"
    text: "swiftlint --strict fails on any lint warning; SwiftFormat checks formatting."
  - edges: [CD]
    title: "Compile"
    text: "xcodebuild builds the app for the scheme; swift build -c release builds plain Swift packages."
  - edges: [DE]
    title: "Test and coverage"
    text: "xcodebuild test runs XCTest and Swift Testing on an iOS Simulator with code coverage on; xcrun xccov reports it."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "mobsfscan applies MobSF static rules to our code, OSV-Scanner checks Package.resolved, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Tests, coverage and every scanner are required checks, so a single failure stops the pipeline here."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Archive"
    text: "xcodebuild archive builds a Release .xcarchive."
  - edges: [JK]
    when: pass
    title: "Sign and export"
    text: "Signing needs a distribution certificate and provisioning profile (managed with fastlane match); -exportArchive then writes the .ipa."
  - edges: [KL]
    when: pass
    title: "Upload to TestFlight"
    text: "fastlane beta builds and uploads the .ipa to TestFlight through App Store Connect."
