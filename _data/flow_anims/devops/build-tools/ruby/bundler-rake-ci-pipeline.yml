steps:
  - lights: [A]
    title: "Source + Gemfile.lock"
    text: "A commit triggers CI. Gemfile and Gemfile.lock pin every gem, and .ruby-version pins Ruby."
  - edges: [AB]
    title: "Install"
    text: "With bundle config set deployment true, bundle install installs exactly Gemfile.lock and fails if it would change."
  - edges: [BC]
    title: "Lint and format"
    text: "bundle exec rubocop checks style and common bugs (with rubocop-rails and rubocop-rspec); Standard is a zero-config alternative."
  - edges: [CD]
    title: "Build assets"
    text: "For Rails apps, bin/rails assets:precompile builds the production assets; plain gems skip this stage."
  - edges: [DE]
    title: "Test and coverage"
    text: "bundle exec rspec runs the specs, with SimpleCov loaded in spec_helper to measure coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "Brakeman checks Rails code for vulnerabilities, bundle-audit check --update checks Gemfile.lock against known advisories, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "RuboCop, the specs and both scanners are required checks; one failure stops the pipeline."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Build the gem"
    text: "bundle exec rake build (Bundler's gem tasks) writes pkg/<name>-<version>.gem."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "Syft generates the SBOM, and Sigstore cosign signs the gem."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "gem push uploads the .gem to RubyGems.org or a private gem server."
