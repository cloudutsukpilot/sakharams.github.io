steps:
  - lights: [A]
    title: "Source + build scripts"
    text: "A commit triggers CI. settings.gradle.kts and build.gradle.kts define the build, and the committed wrapper (gradlew) pins the Gradle version."
  - edges: [AB]
    title: "Resolve dependencies"
    text: "Gradle resolves dependencies from Maven Central and the Plugin Portal; gradle/actions/setup-gradle caches ~/.gradle/caches and the wrapper."
  - edges: [BC]
    title: "Lint and format"
    text: "./gradlew spotlessCheck fails on unformatted code. Checkstyle and PMD, or ktlint and detekt for Kotlin, add lint rules."
  - edges: [CD]
    title: "Compile"
    text: "./gradlew build compiles, tests and runs every check task. Incremental builds and the build cache skip work whose inputs did not change."
  - edges: [DE]
    title: "Test and coverage"
    text: "The test task runs JUnit 5 or Kotest; ./gradlew test jacocoTestReport writes coverage, and Kover is the Kotlin alternative."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "./gradlew spotbugsMain (with FindSecBugs) checks our code, ./gradlew dependencyCheckAnalyze checks dependencies for CVEs, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "./gradlew build fails if any test, coverage rule or check task fails, and the dependency scan runs as its own required step."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Package"
    text: "assemble builds the outputs: a .jar or .war in build/libs, or a distribution zip."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "./gradlew cyclonedxBom (org.cyclonedx.bom plugin) writes the SBOM, and the artifact is signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "The maven-publish plugin's publish task uploads to Maven Central or a private Artifactory / Nexus."
  - edges: [LM]
    when: pass
    title: "Container image"
    text: "Jib builds the container image straight from Gradle, without a Dockerfile, and the registry scans it again."
