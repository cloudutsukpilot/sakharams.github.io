steps:
  - lights: [A]
    title: "Source + pom.xml"
    text: "A commit triggers CI. pom.xml declares dependencies and plugins, and the committed Maven Wrapper (mvnw) pins the Maven version."
  - edges: [AB]
    title: "Resolve dependencies"
    text: "Maven downloads dependencies and plugins from Maven Central or a private Nexus / Artifactory into ~/.m2/repository, which CI caches."
  - edges: [BC]
    title: "Lint and format"
    text: "./mvnw -B checkstyle:check fails on style violations. PMD, Spotless and Error Prone are common additions."
  - edges: [CD]
    title: "Compile"
    text: "maven-compiler-plugin:compile runs in the compile phase. Asking for a later phase, such as verify, runs every phase before it."
  - edges: [DE]
    title: "Test and coverage"
    text: "maven-surefire-plugin runs the JUnit 5 tests in the test phase, and JaCoCo records coverage (./mvnw -B test jacoco:report)."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "SpotBugs with FindSecBugs checks our code, OWASP Dependency-Check fails on CVSS 7 or higher, and Gitleaks looks for committed keys and tokens."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "./mvnw -B -ntp verify is the CI target: unit tests, integration tests (Failsafe) and every check bound to verify must pass."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failing test or check fails the verify phase, so nothing is packaged, signed or deployed."
  - edges: [IJ]
    when: pass
    title: "Package"
    text: "The package phase writes the .jar (or .war / .ear) to target/."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "The CycloneDX Maven plugin (makeAggregateBom) writes target/bom.json, and the artifact is signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Deploy to the repository"
    text: "./mvnw -B deploy uploads to the repository in <distributionManagement>. install is only for local multi-project builds, not CI."
  - edges: [LM]
    when: pass
    title: "Container image"
    text: "Jib or Cloud Native Buildpacks build the container image without a Dockerfile, and the registry scans it again."
