steps:
  - lights: [A]
    title: "Source + Cargo.toml"
    text: "A commit triggers CI. Cargo.toml declares dependencies, Cargo.lock pins them and rust-toolchain.toml pins the compiler."
  - edges: [AB]
    title: "Fetch crates"
    text: "Cargo downloads crates from crates.io or a private registry; --locked fails on a stale Cargo.lock, and rust-cache caches ~/.cargo and target/."
  - edges: [BC]
    title: "Lint and format"
    text: "cargo fmt --all --check fails on unformatted code, and cargo clippy -- -D warnings turns every lint into an error."
  - edges: [CD]
    title: "Compile"
    text: "cargo build --release --locked compiles an optimised native binary."
  - edges: [DE]
    title: "Test and coverage"
    text: "cargo nextest run (or cargo test) runs the tests, and cargo llvm-cov --fail-under-lines 80 enforces coverage."
  - edges: [EF, EG, EH]
    title: "Security scans in parallel"
    text: "Semgrep checks our code, cargo audit checks the RustSec database, cargo deny checks advisories and licences, and Gitleaks scans for secrets."
  - edges: [FI, GI, HI]
    title: "Quality gate"
    text: "Format, Clippy, tests, the coverage gate and the supply-chain checks must pass before release."
  - edges: [IX]
    when: fail
    title: "Fail the build"
    text: "A failed check stops the pipeline at the gate, so nothing is packaged, signed or published."
  - edges: [IJ]
    when: pass
    title: "Package the crate"
    text: "cargo publish --dry-run builds and validates the .crate package; the release binary is the other output."
  - edges: [JK]
    when: pass
    title: "SBOM and signing"
    text: "cargo cyclonedx --format json writes the SBOM, and the artifacts are signed with Sigstore cosign."
  - edges: [KL]
    when: pass
    title: "Publish"
    text: "cargo publish uploads the crate to crates.io or a private registry; binaries are kept as CI artifacts."
