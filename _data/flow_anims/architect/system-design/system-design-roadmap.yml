steps:
  - { lights: [A], title: "1. Core concepts", text: "Scalability, availability, latency, consistent hashing and CAP: the vocabulary every later decision is judged against." }
  - { edges: [AB], title: "2. Networking", text: "TCP vs UDP, HTTP versions, DNS and proxies. When something breaks, you need to know which layer is lying." }
  - { edges: [BC], title: "3. Load balancing", text: "L4 or L7, round robin or least connections, plus DNS and Anycast for spreading traffic across regions." }
  - { edges: [CD], title: "4. APIs", text: "REST, GraphQL or gRPC, gateways, rate limits and idempotency keys. The contract you can't refactor quietly." }
  - { edges: [DE], title: "5. Communication", text: "Polling, SSE, WebSockets, queues, pub/sub and CDC. How components talk decides how far a failure spreads." }
  - { edges: [EF], title: "6. Caching", text: "Cache-aside, write-through, eviction and stampede protection. Lookup is easy; invalidation is the real design." }
  - { edges: [FG], title: "7. Databases", text: "Pick by access pattern: relational, key-value, document, wide-column, graph, search or vector." }
  - { edges: [GH], title: "8. Database scaling", text: "Indexes first, then denormalise, cache, replicate and finally shard. Each step costs more complexity." }
  - { edges: [HI], title: "9. Storage", text: "Block, file and object storage, distributed file systems, and erasure coding for cheap durability." }
  - { edges: [IJ], title: "10. Architecture", text: "Monolith, microservices, serverless, event-driven, CQRS and event sourcing. Start simple; split for teams." }
  - { edges: [JK], title: "11. Microservices patterns", text: "Discovery, gateway, BFF, sidecar, circuit breaker, bulkhead and service mesh: standard answers to recurring problems." }
  - { edges: [KL], title: "12. Distributed systems", text: "Unreliable networks, consensus, clock drift, fencing tokens and CRDTs. Single-machine intuition stops here." }
  - { edges: [LM], title: "13. Distributed transactions", text: "2PC blocks; sagas with compensations plus the transactional outbox are the practical default." }
  - { edges: [MN], title: "14. Data structures", text: "Bloom filters, HyperLogLog, Count-Min Sketch, geohash and Merkle trees trade a little accuracy for scale." }
  - { edges: ["NO"], title: "15. Big data", text: "Batch vs stream, ETL vs ELT, lakes vs warehouses, and Kappa over Lambda when one code path is enough." }
  - { edges: [OP], title: "16. Deployment", text: "Rolling, blue-green, canary, feature flags and expand-migrate-contract schema changes." }
  - { edges: [PQ], title: "17. Observability", text: "Structured logs, RED/USE metrics, distributed traces, and SLOs with error budgets." }
  - { edges: [QR], title: "18. Security", text: "TLS and mTLS, envelope encryption, managed secrets, least-privilege RBAC and SSO federation." }
