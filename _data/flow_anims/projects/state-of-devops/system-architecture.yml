steps:
  - lights: [GH, JF, AZ, KV, USR]
    title: The outside world
    text: GitHub (four orgs plus the enterprise), JFrog, Azure Cost Management and Key Vault feed the system; readers reach it from a browser.
  - edges: [GHCOL]
    title: Collect once, centrally
    text: The central GitHub collector pulls repository data once a day, so every other job reuses it instead of calling the same APIs again.
  - edges: [COLFS, COLTM]
    title: Write and notify
    text: Collectors write dated JSON to the Azure File Share and post a summary to a Microsoft Teams webhook.
  - edges: [FSANA, GHANA, JFANA, AZANA]
    title: Analyzers read and enrich
    text: Each analyzer reads the shared cache, then fetches only the extra detail its domain needs from GitHub, JFrog or Azure.
  - edges: [ANAFS]
    title: One folder per domain
    text: Analyzers write structured JSON under /data/devops-state/<domain>/<org>/<date>/. No analyzer calls another one.
  - edges: [FSAGG]
    title: Aggregators read results
    text: The trends analyzer and summary generator read every domain's output for the day.
  - edges: [AGGFS]
    title: Pre-compute the Home page
    text: They write trend series and one home-overview.json, so the dashboard never aggregates on a request.
  - edges: [USRAPI]
    title: Someone opens the dashboard
    text: A stakeholder opens State of DevOps in the browser. One FastAPI service on port 8000 serves the React app and its read-mostly REST API.
  - edges: [FSAPI, APIRD]
    title: Read files, cache in Redis
    text: The API reads the share read-only and memoizes expensive aggregations in Redis. It never calls a job, so the UI stays up when jobs fail.
  - edges: [KVESO]
    title: Secrets from Key Vault
    text: Tokens and keys live in Azure Key Vault. The External Secrets Operator syncs them into the cluster.
  - edges: [ESOAGG, ESOAPI]
    title: Secrets in both namespaces
    text: Kubernetes secrets land in the cronjobs and state-of-devops namespaces, so no credential is baked into an image or a Helm value.
