steps:
  - title: Commit
    text: "Work starts on a laptop or the DGX, in one of the private platform repos."
    lights: [dev]
  - title: Pre-commit hooks
    text: "Gitleaks and Hadolint run before the commit is even created, so a leaked token never reaches GitHub."
    edges: [dev_hk]
  - title: Pull request
    text: "The push opens a pull request on GitHub. Only private repos use the self-hosted runners."
    edges: [hk_pr]
  - title: A runner picks it up
    text: "An ephemeral ARC runner pod on the DGX polls GitHub for the job (outbound only) and is destroyed after one job."
    edges: [pr_rn]
  - title: Tests first
    text: "Unit tests (pytest, Jest), integration tests with Testcontainers, and Schemathesis API tests generated from each OpenAPI spec."
    edges: [rn_ts]
  - title: Security scans
    text: "Semgrep and Bandit read the code, Trivy and Checkov check dependencies and IaC (plus Conftest with the OPA policies), and Gitleaks scans the history."
    edges: [EF, EG, EH]
  - title: Quality gate
    text: "Any secret, a critical or high finding with a fix available, a high IaC misconfiguration or an OPA deny fails the gate."
    edges: [FI, GI, HI]
  - title: Build
    when: pass
    text: "BuildKit builds the image rootless inside the cluster, with layer caching between runs."
    edges: [IJ]
  - title: PR blocked
    when: fail
    text: "The check goes red with the finding in a PR comment. Nothing is built, so nothing can be deployed."
    edges: [IX]
  - title: Scan the image
    when: pass
    text: "Trivy scans the image itself (OS packages and licences) and Syft writes a CycloneDX SBOM."
    edges: [JK]
  - title: Sign and push
    when: pass
    text: "Cosign signs the image with a key held in OpenBao, attaches the SBOM, and pushes to Zot in core with a key read from OpenBao via GitHub OIDC."
    edges: [KL]
  - title: Tag commit
    when: pass
    text: "The new image digest is committed to homelab-gitops on GitHub. CI never gets a kubeconfig; git is the only way to change what runs."
    edges: [LN]
  - title: Argo CD syncs
    when: pass
    text: "Argo CD polls GitHub (outbound, every 3 minutes), sees the commit and applies it to the target k3d cluster; nodes pull the image from Zot."
    edges: [N_O]
  - title: Admission check
    when: pass
    text: "Kyverno admits the pod only if the image is signed, comes from our Zot registry, runs as non-root and has resource limits."
    edges: [OP]
  - title: Smoke test
    when: pass
    text: "A PostSync hook calls health endpoints, one login redirect, one RAG question and one gateway call."
    edges: [PQ]
  - title: Healthy
    when: pass
    text: "The app turns Healthy. A failed smoke test marks it Degraded instead, and Argo CD rolls back to the last good revision."
    edges: [QR]
  - title: Every night
    when: pass
    text: "Scheduled workflows test what is actually deployed, not just what was built."
    edges: [Rclk]
  - title: The nightly suite
    when: pass
    text: "Playwright user journeys, the full Schemathesis profile, an OWASP ZAP scan and a Locust load run, all against the internal ingress."
    edges: [clk_suite]
  - title: Results on dashboards
    when: pass
    text: "Locust, ZAP and Trivy Operator results land in Grafana's Performance and Security folders; a regression opens an issue."
    edges: [suite_W]
