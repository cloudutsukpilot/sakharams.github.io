steps:
  - title: Commit
    text: "Work starts on a laptop or the DGX, in one of the private platform repos."
    lights: [dev]
  - title: Pre-commit hooks
    text: "pre-commit runs Gitleaks, Ruff and Hadolint before the commit is created, so a leaked token never reaches GitHub. CI runs every check again."
    edges: [dev_hk]
  - title: Pull request
    text: "The push opens a pull request on GitHub. Only the org's private repos may use the self-hosted runners."
    edges: [hk_pr]
  - title: A runner picks it up
    text: "An ephemeral ARC runner pod on the DGX takes the job (it polls GitHub, outbound only) and is deleted after it. Its image has every scanner baked in."
    edges: [pr_rn]
  - title: Tests first
    text: "Ruff and pytest from the locked workspace. The image job needs this one, so a failing test stops the run before anything is built."
    edges: [rn_ts]
  - title: Security scans
    text: "The reusable build workflow runs Semgrep and Bandit on the code, Trivy on dependencies and IaC, Checkov, Conftest and Hadolint on the Dockerfile, and Gitleaks on the whole history."
    edges: [EF, EG, EH]
  - title: Quality gate
    text: "Any secret, high SAST finding, high or critical vulnerability with a fix, high IaC misconfiguration, failed Checkov check, OPA deny or Hadolint warning fails the gate."
    edges: [FI, GI, HI]
  - title: Build
    when: pass
    text: "The shared rootless BuildKit in the platform cluster builds into an OCI layout on the runner, with its cache kept between runs."
    edges: [IJ]
  - title: PR blocked
    when: fail
    text: "The check goes red, with a gate table in the job summary and the full reports as an artifact. Nothing is built, so nothing can be deployed."
    edges: [IX]
  - title: Scan the image
    when: pass
    text: "Trivy scans that layout (OS packages; licences are reported) and Syft writes a CycloneDX SBOM. A pull request build stops here, with nothing pushed."
    edges: [JK]
  - title: Sign and push
    when: pass
    text: "On main only: crane pushes the scanned bytes to Zot and checks the digest, then Cosign signs them and attests the SBOM with a key that never leaves OpenBao."
    edges: [KL]
  - title: Tag commit
    when: pass
    text: "A GitHub App limited to homelab-gitops commits the new digest. CI never gets a kubeconfig; git is the only way to change what runs."
    edges: [LN]
  - title: Argo CD syncs
    when: pass
    text: "Argo CD polls GitHub (outbound, every 3 minutes), sees the commit and applies it to the target k3d cluster; nodes pull the image from Zot."
    edges: [N_O]
  - title: Admission check
    when: pass
    text: "Kyverno admits the pod only if the image is signed with an SBOM, pinned, from Zot or a registry it mirrors, and the pod is restricted, read-only and has limits."
    edges: [OP]
  - title: Smoke test
    when: pass
    text: "A PostSync hook Job calls the service: readiness, its main endpoint, and that it reports the commit it was built from."
    edges: [PQ]
  - title: Healthy
    when: pass
    text: "The sync succeeds and the app is Healthy. A failed smoke test fails the sync instead; a git revert rolls back, and the next retry picks it up."
    edges: [QR]
  - title: Every night
    when: pass
    text: "Planned for Phase 3a: scheduled workflows test what is actually deployed, not just what was built."
    edges: [Rclk]
  - title: The nightly suite
    when: pass
    text: "Phase 3a: Playwright user journeys, the full Schemathesis profile, an OWASP ZAP scan and a Locust load run, all against the internal ingress."
    edges: [clk_suite]
  - title: Results on dashboards
    when: pass
    text: "Phase 3a: Locust, ZAP and Trivy Operator results will land in Grafana's Performance and Security folders."
    edges: [suite_W]
