# Cloudutsuk Platform: system architecture (portal, labs, cost, RAG chat, alert agent).
# Belongs to the Technical Architecture post of the "Cloudutsuk Platform" project playbook
# (_posts/projects/cloudutsuk-platform/2026-10-10-05-technical-architecture.md). Made with the
# cloudutsuk-flow-anim skill. The whole AI stack (RAG API, Qdrant, Redis cache, gateway, vLLM) sits in its own
# `ai` k3d cluster (ADR 0022); the SRE agent stays in platform so it can still report when ai is down.
# Ports are the products' defaults (Backstage 7007, LiteLLM 4000, vLLM 8000, Qdrant 6333, Redis 6379,
# Postgres 5432, OTLP gRPC 4317, Kubernetes API 6443, OpenBao 8200, Keycloak 8443); the post's own services have no fixed port yet.
# Design review gate: approve this diagram before infrastructure or code work starts.
