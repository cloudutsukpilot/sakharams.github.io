steps:
  - title: You open the portal
    text: "portal.cloudutsuk.com is served from the DGX Spark. The core cluster boots first: Keycloak for identity, OpenBao for secrets, PowerDNS for internal names."
    lights: [user, blog, kc, core, dns, ci]
  - title: SSO at the edge
    text: "HTTPS on 443 reaches Cloudflare Access, which sends you to Keycloak; Keycloak brokers your Google or Entra ID login. The tunnel is outbound only."
    edges: [u_cf]
  - title: Backstage signs you in
    text: "The tunnel forwards to Backstage (7007), which signs you in again with Keycloak OIDC and maps your groups to roles, so one bad edge policy can't let anyone in."
    edges: [cf_bs, kc_bs]
  - title: One view of everything
    text: "The Inventory plugin reads what the collector stored. Collectors run every 6 hours, or on demand with Sync now."
    edges: [bs_inv]
  - title: Resources and cost
    text: "External Secrets fetches read-only cloud credentials from OpenBao (8200). Resources and cost land in Postgres (5432), grouped by lab and repo tags."
    edges: [inv_cl, inv_pg, core_inv]
  - title: One-click lab deploy
    text: "Deploy on a lab tile calls the lab runner, which checks the memory budget and takes a per-lab lock first."
    edges: [bs_run]
  - title: Cluster up, registered
    text: "The runner runs the lab's make up to create a k3d cluster, then registers that cluster with the central Argo CD."
    edges: [run_labs, run_argo]
  - title: Every lab is observed
    text: "Argo CD installs the OTel collector on the new cluster through its Kubernetes API (6443); it sends traces, metrics and logs to mon over OTLP gRPC (4317)."
    edges: [argo_labs, labs_mon]
  - title: Ask about your setup
    text: "The chat plugin sends your question to the RAG API, which runs with the rest of the AI stack in the ai cluster."
    edges: [bs_rag]
  - title: Cache, retrieve, generate
    text: "A Redis semantic cache hit (6379) answers instantly. On a miss, Qdrant (6333) finds the docs and the gateway (LiteLLM, default 4000) gets the prompt."
    edges: [rag_cache, rag_qd, rag_gw]
  - title: Every answer is traceable
    text: "The RAG API's spans (cache check, retrieved chunks and scores, prompt, tokens) go through the collector to Phoenix; each chat answer links to its trace."
    edges: [rag_px]
  - title: One gateway, many models
    text: "Every model call goes through one OpenAI-compatible gateway. It routes by model name to the chat or embedding vLLM (default port 8000) and counts tokens."
    edges: [gw_llm, gw_emb]
  - title: Room to grow
    text: "One GB10 can't scale out. When the queue stays long, a second machine or a hosted model is added behind the gateway, with no change to its callers."
    edges: [gw_more]
  - title: Knowledge stays fresh
    text: "rag-ingest re-embeds only changed files every 6 hours, or on Re-index now, and the cache invalidates with the index version."
    edges: [blog_qd]
  - title: Code to cluster
    text: "A push to a private repo wakes an ARC runner on the DGX (it polls GitHub, no inbound). Tests run, then Gitleaks, Semgrep, Trivy and Checkov must pass."
    edges: [ci_bk]
  - title: Signed, then synced
    text: "BuildKit builds the image, Trivy scans it, Syft adds an SBOM, Cosign signs it and it goes to Zot in core. The digest commit lets Argo CD sync; Kyverno only admits signed images."
    edges: [bk_argo]
  - title: An alert fires
    when: alert
    text: "Alertmanager in the mon cluster POSTs to the SRE agent's /alerts webhook with the cluster, namespace and pod labels."
    edges: [mon_sre]
  - title: The agent investigates
    when: alert
    text: "It reads the lab cluster read-only through the Kubernetes API, pulls runbooks from Qdrant (6333), and asks the local model, via the gateway, for a root cause."
    edges: [sre_labs, sre_qd, sre_gw]
  - title: You get the RCA
    when: alert
    text: "The root cause and a proposed fix are posted to Slack and the portal. Nothing changes without your approval."
    edges: [sre_slack]
  - title: Fix through GitOps
    when: alert
    text: "Approving opens a PR to homelab-gitops. Argo CD syncs the merged fix, so every change is reviewed and reversible."
    edges: [slack_argo]
