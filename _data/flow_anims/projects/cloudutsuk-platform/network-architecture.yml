edges:
  - {id: pl_rt, from: platform, to: router, points: [[300, 357], [300, 253]], proto: QUIC, port: 7844, kind: stream}
  - {id: rt_cf, from: router, to: cf, points: [[290, 197], [290, 103]], proto: QUIC, port: 7844, kind: stream}
  - {id: you_cf, from: you, to: cf, label: "TLS 1.3", proto: HTTPS, port: 443}
  - {id: cf_gh, from: cf, to: gh, dashed: true, kind: control}
  - {id: pl_tr, from: platform, to: traefik, points: [[300, 413], [300, 517]], label: "origin TLS", label_at: [345, 430], proto: HTTPS, port: 443, proto_at: [300, 495]}
  - {id: tr_pods, from: traefik, to: pods, proto: HTTP, port: 7007}
  - {id: pods_dns, from: pods, to: coredns, proto: DNS, port: 53}
  - {id: dns_core, from: coredns, to: core, points: [[770, 517], [770, 463], [80, 463], [80, 413]], label: "forward", proto: DNS, port: 53}
  - {id: pl_ai, from: platform, to: ai, label: "JWT", proto: HTTPS, port: 443}
  - {id: pl_core, from: platform, to: core, exit: left, enter: right, proto: HTTPS, port: 8200}
  - {id: pl_lab, from: platform, to: lab, points: [[345, 413], [345, 440], [920, 440], [920, 413]], label: "K8s API", label_at: [610, 430], proto: HTTPS, port: 6443}
  - {id: lab_mon, from: lab, to: mon, exit: left, enter: right, label: "OTLP", kind: telemetry}
  - {id: lab_reg, from: lab, to: reg, points: [[930, 357], [930, 253]], label: "pull", proto: HTTPS, port: 443}
  - {id: certm_le, from: certm, to: le, points: [[865, 545], [845, 545], [845, 103]], label: "ACME", proto: HTTPS, port: 443}
  - {id: rt_clouds, from: router, to: clouds, points: [[340, 197], [340, 170], [640, 170], [640, 103]], label: "egress", proto: HTTPS, port: 443}
  - {id: dgx_az, from: dgx, to: azvm, points: [[560, 197], [560, 145], [935, 145], [935, 103]], proto: WireGuard, port: 51820, kind: control}
steps:
  - title: Nothing listens at home
    text: "cloudflared (2 replicas) in the platform cluster dials out. The home router has no port forwards, and the DGX firewall only allows the Docker bridge."
    lights: [platform, you, dgx, certm]
  - title: Out through NAT
    text: "Each replica keeps outbound QUIC connections on UDP 7844 (falling back to HTTP/2 on TCP 7844) through the router's NAT."
    edges: [pl_rt]
  - title: Tunnel to the edge
    text: "The connections end at Cloudflare's edge, so the tunnel is ready before any request arrives."
    edges: [rt_cf]
  - title: You connect
    text: "portal.cloudutsuk.com is a proxied CNAME to the tunnel. TLS 1.3 ends at Cloudflare, and Access sends you to Keycloak first. The blog stays a DNS-only CNAME to GitHub Pages."
    edges: [you_cf, cf_gh]
  - title: Back down the tunnel
    text: "cloudflared forwards to Traefik over HTTPS and checks the origin certificate for portal.platform.home.cloudutsuk.com."
    edges: [pl_tr]
  - title: To the pod
    text: "Traefik routes through the Backstage Service (10.21.0.0/16) to its pod (10.20.0.0/16) on 7007. NetworkPolicies only allow ingress from Traefik."
    edges: [tr_pods]
  - title: Internal names
    text: "Pods look up *.home.cloudutsuk.com through their cluster's CoreDNS, like any other name."
    edges: [pods_dns]
  - title: One DNS for all clusters
    text: "CoreDNS forwards home.cloudutsuk.com to PowerDNS in core via the network gateway 172.30.0.1:53. The DGX does the same with systemd-resolved split DNS."
    edges: [dns_core]
  - title: Calls between clusters
    text: "Clusters reach each other only through their k3d load balancers on the homelab network: HTTPS 443 with a JWT to ai, and 8200/8443 to OpenBao and Keycloak in core."
    edges: [pl_ai, pl_core]
  - title: Cluster APIs
    text: "Argo CD and the SRE agent reach each cluster's Kubernetes API on 6443 with short-lived tokens. API ports are never published to the LAN."
    edges: [pl_lab]
  - title: Telemetry and images
    text: "Collectors send OTLP gRPC with TLS on 4317 to mon. Nodes pull from Zot in core over HTTPS (published on 172.30.0.1:443, a k3d host alias); public images come through its mirror."
    edges: [lab_mon, lab_reg]
  - title: Out to the internet
    text: "cert-manager gets Let's Encrypt certificates with DNS-01 (a TXT record in Cloudflare). Cloud APIs, GitHub and model downloads leave through NAT on 443."
    edges: [certm_le, rt_clouds]
  - title: A cloud lab joins
    when: cloudlab
    text: "A cloud lab such as the Azure private endpoint lab adds a WireGuard tunnel (UDP 51820) from the DGX to a VM in Azure, and split DNS sends only Azure's names there."
    edges: [dgx_az]
