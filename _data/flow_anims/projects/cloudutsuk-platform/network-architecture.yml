steps:
  - title: Nothing listens at home
    text: "The home router has no port forwards and nothing is published on the internet. tailscaled runs on the DGX host itself, outside every cluster."
    lights: [dgx, router, you, cf, platform, certm]
  - title: Out through NAT
    text: "tailscaled keeps an outbound WireGuard connection (UDP 41641) through the router's NAT, falling back to Tailscale's relays over 443 when a direct path isn't possible."
    edges: [dgx_rt, rt_ts]
  - title: You join the tailnet
    text: "Your phone or laptop joins the tailnet. The policy lets only your login reach 172.30.0.0/24, and split DNS sends home.cloudutsuk.com to PowerDNS. Cloudflare keeps only public DNS."
    edges: [you_ts, cf_gh]
  - title: Into the bridge
    text: "The DGX routes you onto the homelab bridge: portal.platform.home.cloudutsuk.com is 172.30.0.2, where platform's Traefik serves 443 with a Let's Encrypt certificate."
    edges: [dgx_pl, pl_tr]
  - title: To the pod
    text: "Traefik routes through the Backstage Service (10.21.0.0/16) to its pod (10.20.0.0/16) on 7007. NetworkPolicies only allow ingress from Traefik."
    edges: [tr_pods]
  - title: Internal names
    text: "Pods look up *.home.cloudutsuk.com through their cluster's CoreDNS, like any other name."
    edges: [pods_dns]
  - title: One DNS for all clusters
    text: "CoreDNS forwards home.cloudutsuk.com to PowerDNS in core, never via the gateway's port 53 (k3d keeps that for Docker's DNS). The DGX uses systemd-resolved split DNS."
    edges: [dns_core]
  - title: Calls between clusters
    text: "Clusters reach each other only through their k3d load balancers on the homelab network: HTTPS 443 with a JWT to ai, and HTTPS 443 to OpenBao and Keycloak in core."
    edges: [pl_ai, pl_core]
  - title: Cluster APIs
    text: "Argo CD and the SRE agent reach each cluster's Kubernetes API on 6443 with short-lived tokens. APIs listen only on the bridge gateway: reachable from the tailnet with a Keycloak login, never from the internet."
    edges: [pl_lab]
  - title: Telemetry and images
    text: "Collectors send OTLP gRPC with TLS on 4317 to mon. Nodes pull from Zot in core over HTTPS (published on 172.30.0.1:443, a k3d host alias); public images come through its mirror."
    edges: [lab_mon, lab_reg]
  - title: Out to the internet
    text: "cert-manager gets Let's Encrypt certificates with DNS-01 (a TXT record in Cloudflare). Cloud APIs, GitHub and model downloads leave through NAT on 443."
    edges: [certm_le, rt_clouds]
  - title: A cloud lab joins
    when: cloudlab
    text: "A cloud lab such as the Azure private endpoint lab adds a WireGuard tunnel (UDP 51820) from the DGX to a VM in Azure, and split DNS sends only Azure's names there."
    edges: [dgx_az]
