# Cloudutsuk Platform: network view (networks, subnets, ports, TLS, DNS).
# Belongs to the Technical Architecture post (_posts/projects/cloudutsuk-platform/2026-10-10-05-technical-architecture.md,
# "Hosting and deployment model"). Companion to system-architecture.yml. Made with the cloudutsuk-flow-anim skill.
# Subnets are the planned values (ADR 0030): homelab bridge 172.30.0.0/24; per-cluster pod/service CIDRs, e.g. platform
# 10.20.0.0/16 and 10.21.0.0/16. Ports are product defaults: Tailscale WireGuard 41641/udp, Backstage 7007, OpenBao 8200, Keycloak 8443,
# Kubernetes API 6443, OTLP gRPC 4317, Zot registry 443 (published on the gateway), WireGuard 51820.
