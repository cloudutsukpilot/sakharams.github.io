steps:
  - lights: [USER]
    title: Who uses it
    text: Engineers, SREs, operations, managers, auditors and leadership. Thirteen roles decide what each of them sees.
  - edges: [UF]
    title: Open the portal
    text: Everyone reaches the same internal URL. The React single-page app loads, and nothing works until you sign in.
  - edges: [FEEN]
    title: Single sign-on
    text: The React app signs users in with Entra ID. Their security groups become portal roles; a GitHub sign-in is added only when a GitHub action needs it.
  - edges: [FEBE]
    title: One backend
    text: Every page and form calls the Backstage backend with a portal token. About 45 custom plugins and modules run there next to the core ones.
  - edges: [BEPERM]
    title: Permission check
    text: A custom policy checks the caller's role, the target environment and hard blocks before any route or template step runs. Denied means 403, not a hidden button.
  - edges: [BEPG]
    title: Catalog and plugin data
    text: Catalog entities, search, role mappings, Copilot requests and other plugin data live in PostgreSQL 16. Azure, Graph and GitHub are ingested into the catalog on schedules.
  - edges: [BESCAF]
    title: A template runs
    text: Allowed requests run as scaffolder tasks built from about 50 custom actions, each validating before it acts.
  - edges: [SCAFAZ, SCAFGH]
    title: Act on Azure and GitHub
    text: Actions call Azure directly for role assignments or starting a VM, or call GitHub to create repos and dispatch the Terraform workflows that build infrastructure.
  - edges: [BEMW]
    title: Middleware for heavy data
    text: Audits, FinOps, file and SQL monitoring and terminations go to the .NET middleware. The portal backend logs in with client credentials and calls it with a cached JWT.
  - edges: [MWPG]
    title: Middleware schemas
    text: EF Core contexts own their own schemas (user audits, FinOps, file monitoring, Jira audit, termination) in PostgreSQL. SQL Server is read-only.
  - edges: [MWFUNC]
    title: Same code, on a timer
    text: Azure Functions share the middleware's services library and run on timers, independent of any user request.
  - edges: [FUNCPG, FUNCOT]
    title: Import, scan, notify
    text: Jobs import FOCUS cost exports daily, scan for 90-day inactivity and ingest State of DevOps data, using Jira, SQL Server, Blob Storage and SMTP.
