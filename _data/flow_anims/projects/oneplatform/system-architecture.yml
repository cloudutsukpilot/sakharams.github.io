# Animated flow diagram for _posts/projects/oneplatform/2026-10-05-05-technical-architecture.md
# (include id: projects/oneplatform/system-architecture). One request through OnePlatform: sign-in,
# permission check, a template run that calls Azure and GitHub, and the .NET middleware with its
# scheduled jobs. Source: the portal's C4 diagrams and architecture model, and the middleware's
# architecture doc. Coordinates are in viewBox units; node x/y is the centre.
