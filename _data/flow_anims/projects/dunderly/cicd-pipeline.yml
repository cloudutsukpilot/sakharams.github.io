# Animated flow diagram for _posts/projects/dunderly/2026-10-07-12-cicd-and-release-management.md
# (include id: projects/dunderly/cicd-pipeline). Pull request checks, build once on main, promote
# through dev and test, approve, migrate and deploy to the staging slot, smoke test, swap.
title: Dunderly CI/CD pipeline
accent: "#F472B6"
accent2: "#FACC15"
