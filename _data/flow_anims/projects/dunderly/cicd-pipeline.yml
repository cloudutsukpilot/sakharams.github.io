edges:
  - { id: PB, from: PR, to: BUILD }
  - { id: BS, from: BUILD, to: SCAN }
  - { id: SP, from: SCAN, to: PREV }
  - { id: PM, from: PREV, to: MERGE }
  - { id: MA, from: MERGE, to: ART, label: "merge to main", label_at: [600, 160], points: [[830, 134], [830, 168], [35, 168], [35, 270], [55, 270]] }
  - { id: AD, from: ART, to: DEV }
  - { id: DT, from: DEV, to: TEST }
  - { id: TG, from: TEST, to: GATE }
  - { id: GS, from: GATE, to: SLOT }
  - { id: SS, from: SLOT, to: SMOKE }
  - { id: SW, from: SMOKE, to: SWAP, label: "pass", tone: ok, points: [[820, 395], [715, 395]] }
  - { id: SX, from: SMOKE, to: STOP, label: "fail", tone: fail }

steps:
  - lights: [PR]
    title: Open a pull request
    text: Every change, whether code, Bicep or a migration, starts as a short-lived branch and a pull request against main.
  - edges: [PB]
    title: Build and test
    text: GitHub Actions builds the API, the Functions and the Blazor app and runs unit tests, plus integration tests against SQL Server in a container.
  - edges: [BS]
    title: Scan
    text: CodeQL, dependency review, secret scanning and Bicep linting run on every PR. A high-severity finding fails the check.
  - edges: [SP]
    title: Preview
    text: Static Web Apps creates a preview environment for the PR, so the HR product owner can click through a UI change before it merges.
  - edges: [PM]
    title: Review and merge
    text: Branch protection needs one approving review and green checks. Merging to main is the only way into the release path.
  - edges: [MA]
    title: Build once
    text: Main builds the release artifacts once (API and Functions zips, the Blazor bundle, an EF Core migration bundle), all stamped with one version.
  - edges: [AD]
    title: Deploy to dev
    text: The workflow signs in to Azure with OIDC, so there's no stored secret. Bicep applies first, then the artifacts deploy.
  - edges: [DT]
    title: Promote to test
    text: The same artifacts go to test, where Playwright end-to-end tests run and HR does acceptance testing on release candidates.
  - edges: [TG]
    title: Production approval
    text: The production environment needs a named reviewer. Payroll week is a change freeze unless the fix is for payroll itself.
  - edges: [GS]
    title: Migrate, then deploy to the slot
    text: The migration bundle applies backward-compatible schema changes, then the new build goes to the staging slot while production keeps serving.
  - edges: [SS]
    title: Smoke test the slot
    text: Health, sign-in, an employee read and a document download run against the warmed-up staging slot.
  - edges: [SW]
    when: pass
    title: Swap
    text: The slot swap is the release. Rolling back is swapping again, within minutes, because the previous build is still sitting in the slot.
  - edges: [SX]
    when: fail
    title: Don't swap
    text: Production never saw the bad build. The team fixes forward on main, and the expand-only migration is harmless to the version still running.
