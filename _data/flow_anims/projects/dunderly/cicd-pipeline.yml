  - { id: PR, label: "Pull request", x: 80, y: 90, w: 120, shape: terminal, icon: git, icon_pos: corner }
  - { id: BUILD, label: "Build + test", sub: "dotnet test", x: 250, y: 90, w: 140, icon: check, icon_pos: corner }
  - { id: SCAN, label: "Scans", sub: "CodeQL, deps", x: 430, y: 90, w: 140, icon: package, icon_pos: corner }
  - { id: PREV, label: "PR preview", sub: "SWA preview env", x: 610, y: 90, w: 140, icon: git, icon_pos: corner }
  - { id: MERGE, label: "Review\n+ merge", x: 830, y: 90, w: 130, h: 88, shape: diamond }

  - { id: ART, label: "Build once", sub: "zips + efbundle", x: 130, y: 270, w: 150, icon: gear, icon_pos: corner }
  - { id: DEV, label: "Deploy dev", sub: "Bicep + app", x: 320, y: 270, w: 140, icon: "devops/iac/azureresourcemanager-18.svg" }
  - { id: TEST, label: "Deploy test", sub: "E2E + UAT", x: 500, y: 270, w: 140, icon: check, icon_pos: corner }
  - { id: GATE, label: "Prod approval", sub: "env reviewer", x: 680, y: 270, w: 140, icon: check, icon_pos: corner }
  - { id: SLOT, label: "Staging slot", sub: "migrate + deploy", x: 880, y: 270, w: 150, icon: rocket, icon_pos: corner }
  - { id: SMOKE, label: "Smoke\ntests", x: 880, y: 395, w: 120, h: 84, shape: diamond }
  - { id: SWAP, label: "Swap to\nproduction", x: 640, y: 395, w: 150, tone: ok }
