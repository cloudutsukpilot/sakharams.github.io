steps:
  - lights: [USR]
    title: Who uses it
    text: About 250 employees, their managers and HR use one web app, with roughly 10 people active at once. Nobody installs anything.
  - edges: [USRSWA]
    title: Load the app
    text: Azure Static Web Apps serves the Blazor WebAssembly bundle from its edge. Nothing renders on a server, which is what the old View service did.
  - edges: [USRENTRA]
    title: Sign in
    text: Microsoft Entra ID signs the user in with MFA and Conditional Access and issues a token carrying app roles such as Manager or HRManager.
  - edges: [SWAAPI]
    title: Call the API
    text: The app in the browser calls one ASP.NET Core API on App Service with the Entra access token. The API checks the token, the role and the reporting line.
  - edges: [APISQL, APIBLOB]
    title: Store and fetch
    text: Employee, salary and vacation data live in one Azure SQL database; scanned documents go to Blob Storage. Both use private endpoints and managed identity.
  - edges: [APIAI]
    title: Observe
    text: The API and the Functions send traces, logs and metrics to Application Insights through OpenTelemetry. This replaces the custom logging service and its queue.
  - edges: [APIFUNC]
    title: Approve payroll
    text: When HR approves the month's payroll run, the API puts a message on a Storage queue. The Payroll Functions app reads the frozen run from SQL.
  - edges: [FUNCPAY]
    title: Write the file
    text: The Function writes the payroll file plus a manifest (record count, control total, SHA-256) to a locked-down outbound container.
  - edges: [PAYAGENT]
    title: Pull, don't push
    text: A scheduled agent in the server farm pulls the file over HTTPS 443 with an Azure Arc managed identity. No inbound port opens into the data center.
  - edges: [AGENTLEG]
    title: Hand off
    text: The agent verifies the checksum and drops the file into the payment system's input folder, the only interface the legacy C++ system has.
  - edges: [AGENTPAY]
    title: Close the loop
    text: The agent uploads a receipt. If none arrives by the deadline an alert fires, so a missed payroll is caught in hours, not on payday.
