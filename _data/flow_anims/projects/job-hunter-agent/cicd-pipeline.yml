# Animated flow diagram for _posts/projects/job-hunter-agent/2026-10-22-12-cicd-and-release-management.md
# (include id: projects/job-hunter-agent/cicd-pipeline). From a push to a running pod: three checks on
# GitHub-hosted runners, then (main only) homelab-gitops' reusable build-image workflow on the homelab
# runner, then GitOps. Source: job-hunter-agent .github/workflows/ci.yaml, homelab-gitops
# .github/workflows/build-image.yaml and apps/job-hunter.
