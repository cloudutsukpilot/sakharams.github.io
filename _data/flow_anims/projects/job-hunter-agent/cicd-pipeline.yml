steps:
  - lights: [PUSH]
    title: A push
    text: A commit lands on main, or a pull request is opened. Small changes go straight to main; schema changes go through a PR so the migration is applied first.
  - edges: [PT, PS, PD]
    title: Three checks in parallel
    text: Unit tests and ruff, the full flow against a fresh local Supabase with every migration applied, and a Docker build. A pull request stops after these.
  - edges: [TM, SM]
    title: Only main deploys
    text: The image job needs the unit and Supabase tests to pass, and runs only on main with the repo variable HOMELAB_DEPLOY set. The Docker build is a separate check.
  - edges: [MG]
    title: Seven security gates
    text: On the homelab runner, the platform's reusable workflow runs Gitleaks, Semgrep, Bandit, Trivy, Checkov, Conftest and Hadolint. Any finding above the bar fails the job.
  - edges: [GS]
    when: fail
    title: A gate fails
    text: No image is built and nothing deploys; the running version stays. The scanners' reports are uploaded to the run so the finding can be fixed or suppressed by fingerprint.
  - edges: [GB]
    when: pass
    title: Build, scan, SBOM
    text: The image is built from digest-pinned base images, scanned again by Trivy as an image, and described by a CycloneDX SBOM from Syft.
  - edges: [BZ]
    when: pass
    title: Push to Zot
    text: The image goes to the homelab's Zot registry as platform/job-hunter-agent, with registry credentials read from OpenBao for this run only.
  - edges: [ZS]
    when: pass
    title: Sign and attest
    text: cosign signs the digest and attests the SBOM with a key that never leaves OpenBao's transit engine. The run's OpenBao token is revoked afterwards.
  - edges: [SP]
    when: pass
    title: Promote by digest
    text: A GitHub App commits the new digest to apps/job-hunter/kustomization.yaml in homelab-gitops. Git is the release record.
  - edges: [PA]
    when: pass
    title: Argo CD syncs
    text: The workflow pings Argo CD's webhook so it refreshes at once instead of at its next poll, and the app syncs to the new digest.
  - edges: [AK]
    when: pass
    title: Admission
    text: Kyverno admits the pod only if the image is signed, pinned by digest and from the allowed registry, and the pod meets the restricted security profile.
  - edges: [KP]
    when: pass
    title: Recreate rollout
    text: The old pod stops before the new one starts, because only one browser may use the LinkedIn profile. The session survives on the volume.
