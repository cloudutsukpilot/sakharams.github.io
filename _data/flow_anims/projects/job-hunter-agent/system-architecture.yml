steps:
  - lights: [APP]
    title: A profile's time comes
    text: At 08:00 India time on a weekday the scheduler fires the Cloud Architect profile's job. The run is recorded as running; other profiles have their own times.
  - edges: [APPMCP]
    title: Ask the sidecar
    text: The app calls the LinkedIn MCP server on loopback port 8080 over streamable HTTP. Its client allows only read-only tools, so it can't apply or message anyone.
  - edges: [MCPLI]
    title: A signed-in browser
    text: Chromium, signed in as me, runs the search and opens up to 5 new postings per keyword. Jobs already stored are skipped before any page loads.
  - edges: [APPAG]
    title: Filter and hand over
    text: Duplicates, excluded companies and reposts are dropped; new postings are stored with the profile that found them and passed to the agents.
  - edges: [AGFACTS]
    title: Research the company
    text: The company's LinkedIn About page, then Wikidata for revenue and headcount by year and Google News for headlines. Cached for a week; figures only when published.
  - edges: [AGLLM]
    title: The local model writes
    text: Every agent call goes through LiteLLM to a local model with a JSON schema. It scores the fit, returns line edits to my resume, writes a letter and re-scores the result.
  - edges: [AGTC]
    title: Check the claims
    text: Numbers, tools and phrases the draft adds that my resume doesn't have are flagged. Any flag blocks approval until I've looked at it.
  - edges: [TCDB]
    title: Saved for review
    text: Drafts, scores, research and the run's counts go to Supabase over its HTTPS API. The application waits as pending review; nothing is sent.
  - edges: [APPSL]
    lights: [SL, ME]
    title: Tell me
    text: When the run finishes, the app posts a summary to a Slack incoming webhook. A failed post never fails the run.
  - edges: [MEKC]
    title: Sign in
    text: I open the app and Keycloak signs me in with OpenID Connect. Only members of platform-admins get in; the app checks the group too.
  - edges: [KCUI]
    title: The review queue
    text: A signed cookie holds the session for 8 hours. The review page leads with skills required vs. mine and the shortlist confidence; drafts are collapsed.
  - edges: [UIDB]
    title: My decision
    text: I approve or reject. After approving I apply on the employer's site myself and mark it applied. The agent never does that step.
