# Animated flow diagram for _posts/projects/job-hunter-agent/2026-10-22-05-technical-architecture.md
# (include id: projects/job-hunter-agent/system-architecture). One scheduled run for one search profile,
# from the cron firing to my approval. The app and its agents are one FastAPI process; the LinkedIn MCP
# server is a sidecar in the same pod. Source: the job-hunter-agent repo and homelab-gitops apps/job-hunter.
# Coordinates are in viewBox units; node x/y is the centre.
