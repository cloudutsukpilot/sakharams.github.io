steps:
  - lights: [GH, JR, U]
    title: Where the work happens
    text: People's work lives in GitHub and Jira; readers reach the summaries from a browser. Nobody types a status update.
  - edges: [GHCOL, JRCOL]
    title: Collect daily activity
    text: The GitHub, Jira and epic-data collectors pull each person's activity for the day.
  - edges: [COLFS]
    title: Raw activity as JSON
    text: Collectors write github.json, jira.json and epic metadata per person and date to the Azure File Share.
  - edges: [FSGEN]
    title: Generators read the share
    text: The user, team, epic and POD generators read the collected JSON. They never call each other; the schedule orders them.
  - edges: [GENAI]
    title: Prompt the model
    text: Prompts from each generator's prompts/ folder go to Azure OpenAI through one BaseAIClient class.
  - edges: [AIGEN]
    title: Summary comes back
    text: The model returns the summary. The same client can point at OpenAI or a local model in development.
  - edges: [GENFS]
    title: Summaries of summaries
    text: Each generator writes summary.md per user, team, epic, POD and period. The team generator waits for user summaries first.
  - edges: [UU]
    title: Someone opens the dashboard
    text: A manager opens the dashboard; FastAPI on port 9000 serves the React app and the read-mostly API.
  - edges: [FSUI, UIRD]
    title: Read files, cache in Redis
    text: The API reads summaries read-only from the share and memoizes reads and search results in Redis.
  - edges: [UIGEN]
    title: Refresh on demand
    text: The Refresh button makes the API create a one-shot Kubernetes Job that regenerates that summary.
  - edges: [GENFS]
    title: Fresh summary on the share
    text: The Job writes a new summary.md; the UI polls the refresh status and shows it.
