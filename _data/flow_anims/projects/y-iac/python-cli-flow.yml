steps:
  - lights: [CMD, SM, CV, RES, CFG, ENV]
    title: One command, five inputs
    text: "In infra-aws you run python entrypoint.py --cloud aws --environment dev --stack hello-world --terragrunt plan. Everything else the run needs is already on disk or in the environment."
  - edges: [CMDEP]
    title: The stub finds the platform
    text: The identical entrypoint stub finds the shared module (sibling folder locally, ./terragrunt_shared_module in CI), adds src/ to sys.path and calls cli/app.py.
  - edges: [EPBOOT, SMBOOT]
    title: Bootstrap sync
    text: A content hash decides whether the shared module changed. If so it is copied in, the stub is refreshed and root.hcl, the CI workflow, Taskfile and .gitignore are written.
  - edges: [BOOTPARSE]
    title: Parse arguments
    text: argparse reads cloud, environment, stack and action. Unknown tokens such as -reconfigure become Terraform passthrough flags, and a dispatch target is chosen.
  - edges: [PARSEVAL, CVVAL, RESVAL]
    title: Validate before anything runs
    text: The stack folder must exist, the provider and stack must fit, the target account comes from common_vars.yaml, and resources.yaml is linted for duplicates.
  - edges: [VALEXP, CFGEXP]
    title: Export environment variables
    text: CLOUD, ENVIRONMENT, TARGET_ACCOUNT and STACK are exported, plus gate settings (OPA, Trivy or Wiz, Infracost) and state-lock settings from config.yaml and common_vars.yaml.
  - edges: [EXPAUTH, CFGAUTH, ENVAUTH]
    title: Authenticate
    text: The backend entry is matched on the repo name, credentials are pre-flighted, and ARM_* (or AWS, GCP) plus BACKEND_* variables are set from .env, the CLI login or CI secrets.
  - edges: [AUTHGEN]
    title: Hand over to the Terragrunt handler
    text: The handler resolves environments/aws/dev/hello-world, clears the cache on -reconfigure, checks terragrunt is installed and starts the stack generator.
  - edges: [GENSTK]
    title: YAML becomes a stack file
    text: One unit block per resource type in resources.yaml (or the category files), with source = cloud/<cloud>/terragrunt/<type> and the declared instances as values.
  - edges: [STKTGG]
    title: Terragrunt expands the units
    text: terragrunt stack generate copies each unit template into .terragrunt-stack/<type>/ as terragrunt.hcl, next to a generated terragrunt.values.hcl.
  - edges: [TGGMRG]
    title: Merge common_vars
    text: Environment and stack common_vars.yaml are merged into .terragrunt-stack/common_vars.yaml. common_tags merge key by key, so a stack tag never drops a cost-centre tag.
  - edges: [MRGDAG]
    title: Dependency waves
    text: Dependency blocks in the generated units are sorted into execution waves and printed. Then terragrunt stack run plan starts, which is part 2.
