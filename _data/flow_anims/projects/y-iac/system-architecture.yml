steps:
  - lights: [ENG, SHARED]
    title: Two repositories, two jobs
    text: Y-IaC holds every module, the Python CLI and the reusable workflows. An infra-* consumer repo holds only YAML describing what it wants.
  - edges: [ENGCONS]
    title: Declare it in YAML
    text: An engineer adds an entry to resources.yaml in a consumer such as infra-aws and opens a pull request. No HCL is written.
  - edges: [CONSGHA]
    title: Consumer workflow calls Y-IaC
    text: The consumer's terragrunt-cicd.yaml calls the reusable workflows in Y-IaC at the ref set by iac_shared_module_ref in config.yaml.
  - edges: [GHACLI, SHAREDCLI]
    title: The runner runs the CLI
    text: The runner checks Y-IaC out into ./terragrunt_shared_module and runs entrypoint.py. On a laptop the same CLI runs from a sibling checkout.
  - edges: [CLITG]
    title: YAML becomes a Terragrunt stack
    text: The CLI validates, authenticates and writes terragrunt.stack.hcl with one unit per resource type. Parts 1 and 2 below zoom in on this.
  - edges: [TGTF]
    title: root.hcl generates the rest
    text: Each unit includes root.hcl, which generates provider.tf and backend.tf and points at the shared Terraform module.
  - edges: [TFSTATE, TFCLOUD]
    title: State and APIs
    text: Terraform reads each unit's own state file and refreshes against Azure, AWS, GCP, GitHub, JFrog, Grafana or whichever provider the stack uses.
  - edges: [TFGATES]
    title: Plan through the gates
    text: Plan JSON goes through OPA policies, Trivy or Wiz, and Infracost before anyone is asked to approve it.
  - edges: [GATESPRS]
    title: Evidence for the reviewer
    text: Per-unit add/change/destroy tables, gate results and plan files are saved as workflow artifacts and summarised for the pull request.
  - edges: [PRSGHA]
    title: Approve, then apply
    text: After merge, a GitHub environment approval releases the apply job. The CD workflow runs the same CLI with apply, then plans again to prove a clean state.
  - edges: [GHACLI]
    title: Same path for apply
    text: Apply goes through the identical CLI, root.hcl and modules. Only the action changes, so what was reviewed is what runs.
  - edges: [GHANOTIFY]
    title: Scheduled drift scan
    text: A scheduled plan looks for drift. Findings go to Microsoft Teams and to one Jira ticket per repository, updated rather than duplicated.
