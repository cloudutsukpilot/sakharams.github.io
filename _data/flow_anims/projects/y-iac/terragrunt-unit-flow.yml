steps:
  - lights: [UNIT, RES, CV, CFG, PY, ENV]
    title: One unit per resource type
    text: Part 1 left .terragrunt-stack/aws_vpc/terragrunt.hcl, a copy of the shared template cloud/aws/terragrunt/aws_vpc. The inputs above are what it can see.
  - edges: [RESUNIT]
    title: The unit reads the YAML
    text: Its locals find resources.yaml and the merged common_vars.yaml with find_in_parent_folders and map each aws_vpc entry to module inputs, with common_tags merged in.
  - edges: [UNITROOT]
    title: Include root.hcl
    text: include "root" pulls in environments/aws/root.hcl, which bootstrap wrote from the shared template. Every unit in every consumer gets the same root.
  - edges: [CVROOT, CFGROOT]
    title: Which providers, which backend
    text: root.hcl reads the providers list, subscriptions and override_versions from common_vars, and the backend entry whose repo matches the folder name from config.yaml.
  - edges: [PYROOT, ENVROOT]
    title: Versions and credentials
    text: providers.yaml pins versions (aws 6.55.0, azurerm 5.0.0). Credentials only arrive as env vars such as ARM_CLIENT_ID, <SUB>_ARM_SUBSCRIPTION_ID or GH_TOKEN, never from YAML.
  - edges: [ROOTPROV, ROOTBACK]
    title: Generate provider.tf and backend.tf
    text: Only the providers the stack listed, plus one aliased azurerm per subscription. The backend (local, azurerm, s3 or gcs) keys state by repo, cloud and unit path.
  - edges: [UNITMOD]
    title: Point at the shared module
    text: terraform.source resolves to terragrunt_shared_module/cloud/aws/terraform/aws_vpc. Consumers never hold their own copy of module code.
  - edges: [MODINIT, PROVINIT, BACKINIT]
    title: terraform init
    text: Terragrunt runs the tflint hook, downloads providers through a plugin cache and writes the generated files next to the module code.
  - edges: [INITSTATE, INITPLAN]
    title: State, then plan
    text: Init connects to this unit's own state file in the remote backend. Then terragrunt stack run plan runs the units in dependency waves.
  - edges: [PLANCLOUD, PLANJSON]
    title: Refresh and convert
    text: The plan refreshes against the cloud or SaaS APIs, retrying stale locks only when they are old enough. Each plan is converted to JSON with secrets redacted.
  - edges: [JSONGATE]
    title: Plan gates
    text: The plan JSON is evaluated by OPA policies, Trivy or Wiz, and Infracost. Each gate can be advisory or blocking.
  - edges: [GATEREP]
    when: pass
    title: Report
    text: Gates pass. The CLI prints a per-unit add/change/destroy summary and the final report, which CI posts to the pull request.
  - edges: [GATEBLK]
    when: fail
    title: Blocked
    text: A blocking policy fails, so the CLI exits non-zero and CI marks the plan red. OPA_OVERRIDE and similar flags exist for an approved exception.
