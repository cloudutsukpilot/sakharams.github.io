# Animated flow diagram for _posts/projects/sql-blocking-agent/2026-10-05-05-technical-architecture.md
# (include id: projects/sql-blocking-agent/system-architecture). One monitoring cycle, from the
# TargetServers config to audit, report and email. Only Analyzer, Determination and RCA call the LLM;
# those steps light the Azure AI Foundry node. Source: docs/ARCHITECTURE.md, docs/END_TO_END_PROCESS.md.
# Coordinates are in viewBox units; node x/y is the centre.
