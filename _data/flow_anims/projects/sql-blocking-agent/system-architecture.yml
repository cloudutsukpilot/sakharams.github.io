edges:
  - { id: CFGPOLL, from: CFG, to: POLL }
  - { id: POLLDET, from: POLL, to: DET }
  - { id: SQLDET, from: SQL, to: DET, points: [[630, 80], [575, 80]] }
  - { id: DETAN, from: DET, to: AN, points: [[500, 108], [500, 155], [160, 155], [160, 232]] }
  - { id: ANDETM, from: AN, to: DETM }
  - { id: DETMAN, from: DETM, to: AN, label: "retry once", points: [[330, 288], [330, 322], [190, 322], [190, 288]] }
  - { id: DETMAPR, from: DETM, to: APR, label: "KILL" }
  - { id: APRACT, from: APR, to: ACT, label: "approve", tone: ok }
  - { id: ACTRCA, from: ACT, to: RCA, points: [[800, 288], [800, 402]] }
  - { id: DETMRCA, from: DETM, to: RCA, label: "ALERT_ONLY / SKIP", points: [[400, 288], [400, 445], [765, 445]] }
