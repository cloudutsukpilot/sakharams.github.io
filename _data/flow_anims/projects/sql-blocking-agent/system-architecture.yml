steps:
  - lights: [CFG, SQL]
    title: What to watch
    text: AgentConfigDB.dbo.TargetServers lists the SQL Servers to monitor, with per-server thresholds, kill limits and the DBA email. It is re-read every minute.
  - edges: [CFGPOLL]
    title: One poller per server
    text: In loop mode an asyncio poller runs per server, every 15 seconds by default. If the previous cycle is still running, the next tick is skipped.
  - edges: [POLLDET, SQLDET]
    title: Deterministic detection
    text: DMV queries find blocking and walk session_id to blocking_session_id up to the head blocker. No LLM. With no blocking, the cycle just records and ends.
  - edges: [DETAN]
    lights: [AN, FDY]
    title: Analyzer agent (LLM)
    text: Read-only diagnostics run in code (log safety, plans, Query Store, locks, KB scenario), then one Pydantic AI call on Azure AI Foundry returns a validated analysis.
  - edges: [ANDETM]
    lights: [DETM, FDY]
    title: Determination
    text: Hard safety gates run in code first (R1, R2, R3, R6, R9 to R13). Only if none fires does the LLM choose KILL, ALERT_ONLY or SKIP under rules R4, R5, R7 and R8.
  - edges: [DETMAN]
    title: At most one retry
    text: If Determination asks for more analysis, the Analyzer runs once more. MAX_ANALYSIS_RETRIES is 1, so the loop can never run away.
  - edges: [ANDETM]
    title: Decide again
    text: The second decision is final. Whatever it is, a KILL can only happen through the deterministic action path, never as an LLM tool call.
  - edges: [DETMAPR]
    when: kill
    title: Human approval
    text: A KILL waits for a DBA to approve through the approval API or approve.py, with the evidence shown. Denied or timed out means ALERT_ONLY and no kill.
  - edges: [APRACT]
    when: kill
    title: KILL and validate
    text: On an autocommit connection with @@TRANCOUNT at zero, the KILL runs, then the validator checks the session is gone and the chain cleared. Production runs this in dry-run today.
  - edges: [ACTRCA]
    when: kill
    lights: [RCA, FDY]
    title: RCA agent (LLM)
    text: The third and last LLM call writes the root-cause report, business impact and prioritized P1 to P4 recommendations with T-SQL.
  - edges: [DETMRCA]
    when: alert
    lights: [RCA, FDY]
    title: ALERT_ONLY or SKIP
    text: A safety gate fired or the LLM chose not to kill, so nothing touches the session. The RCA agent still explains the incident for the DBA team.
  - edges: [RCANOT]
    title: Notification
    text: Notification is the last node on every path. It writes the blocking event first, then the rest of the audit and the reports.
  - edges: [NOTLOG, NOTBLOB, NOTMAIL]
    title: Audit, report, email
    text: Immutable audit rows go to AgentLogDB, the HTML RCA report is uploaded to Blob Storage, and the DBA team gets an email with the report link.
