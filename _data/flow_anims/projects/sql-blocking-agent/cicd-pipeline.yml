steps:
  - lights: [PR]
    title: A pull request
    text: A change under sql-blocking-agent/ opens a PR, linked to its ticket. CI builds a preview and runs SonarQube, which also runs the 240 unit tests.
  - edges: [E1]
    title: Preview in development
    text: CI can build a preview image and chart for the PR and deploy it to the development environment, so the change runs against real SQL before merge. Closing the PR tears it down.
  - edges: [E2]
    title: Merge to main
    text: After review, the change merges. Only paths under sql-blocking-agent/ trigger the build.
  - edges: [E3]
    title: Build, scan, push
    text: Shared reusable workflows build the Docker image, run SonarQube analysis with the unit tests and push the image to the JFrog registry.
  - edges: [E4]
    title: Package the chart
    text: Changed Helm charts are detected, packaged and pushed to the same registry, so image and chart travel together.
  - edges: [E5]
    title: Release
    text: The release workflow bumps the development version in versions.yaml, retags the tested image with that version, publishes the chart and creates a GitHub release.
  - edges: [WRAP]
    title: Promote to development
    text: The promote workflow validates the release and deploys it to development through Argo CD, asking before it replaces an active PR preview.
  - edges: [E7]
    title: Production approval
    text: Promoting to production runs in the protected production GitHub environment, so a reviewer has to approve it.
  - edges: [E8]
    title: A PR, not a push
    text: The workflow updates the production version in versions.yaml and opens a pull request. Production changes are reviewed as Git changes.
  - edges: [E9]
    title: GitOps sync
    text: Once that PR merges, Argo CD syncs the production release on AKS from Git. Nobody runs kubectl against production.
  - edges: [E10]
    title: Production, in dry-run
    text: Production runs one replica in loop mode. Today it detects, analyzes and reports, but no real KILL is executed.
