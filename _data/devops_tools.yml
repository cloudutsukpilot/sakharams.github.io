          - { name: Linux, what: The open-source kernel and OS family, url: /posts/operating systems/linux/linux, icon: /assets/img/icons/operatingsystems/linuxos-18.svg }
          - { name: Ubuntu, what: Debian-based Linux distribution, url: /posts/operating systems/ubuntu/ubuntu, icon: /assets/img/icons/operatingsystems/ubuntuos-18.svg }
          - { name: Debian, what: Community Linux distribution, url: /posts/operating systems/debian/debian, icon: /assets/img/icons/operatingsystems/debianos-18.svg }

