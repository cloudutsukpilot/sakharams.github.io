# DevOps tools shown on the DevOps tab (_tabs/devops.md via {% include topic-grid.html data="devops_tools" %}).
#
# groups: one section per group (id, title, fa, summary), with one card per category.
#   category fields: title, fa (Font Awesome icon for the card head and items without a logo),
#                    url or post (the category's overview), items.
#   item fields:     name, what (a few words, the tile subtitle), url or post (post = source path,
#                    resolved at build time), icon (logo under assets/img/icons/; leave it out to
#                    show the category's `fa` icon). No url or post = a topic with no article yet.

groups:
  - id: platforms
    title: Cloud and platforms
    fa: fas fa-cloud
    summary: Where the workloads run, from public clouds to hypervisors and operating systems.
    categories:
      - title: Cloud
        fa: fas fa-cloud
        url: /posts/cloud/cloud
        items:
          - { name: Microsoft Azure, what: Microsoft's public cloud, url: /posts/cloud/azure/microsoft-azure, icon: /assets/img/icons/cloud/azure/azure-18.svg }
          - { name: Amazon Web Services, what: Amazon's public cloud, url: /posts/cloud/aws/aws, icon: /assets/img/icons/cloud/aws/amazonwebservices-18.svg }
          - { name: Google Cloud, what: Google's public cloud, url: /posts/cloud/gcp/gcp, icon: /assets/img/icons/cloud/gcp/googlecloudplatform-18.svg }
      - title: Virtualization
        fa: fas fa-server
        url: /posts/virtualization/virtualization
        items:
          - { name: Hyper-V, what: Windows hypervisor, url: /posts/virtualization/hyperv/hyperv, icon: /assets/img/icons/virtualization/hyperv-18.svg }
          - { name: VMware, what: vSphere and ESXi, url: /posts/virtualization/vmware/vmware, icon: /assets/img/icons/virtualization/vmware-18.svg }
      - title: Operating Systems
