name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.summary.outputs.pages }}
      size: ${{ steps.summary.outputs.size }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      # - name: Install Bundler
      #   run: gem install bundler -v 2.5.21

      # - name: Install Gems
      #   run: |
      #     bundle _2.5.21_ install
      #     bundle _2.5.21_ lock

      - name: Installed Versions
        run: |
          ruby --version
          bundle --version

      - name: Build site
        id: build
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # Fast (~5s): run before the ~2 min link check so content mistakes fail early.
      - name: Test customizations
        id: test_custom
        run: bundle exec ruby -Itest -e 'Dir["test/*_test.rb"].each { |f| require File.expand_path(f) }'

      - name: Test site
        id: test_site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

      - name: Build summary
        id: summary
        if: always()
        env:
          SITE_DIR: "_site${{ steps.pages.outputs.base_path }}"
          BUILD: ${{ steps.build.outcome }}
          TEST_CUSTOM: ${{ steps.test_custom.outcome }}
          TEST_SITE: ${{ steps.test_site.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⚪";; skipped) echo "⏭️";; *) echo "❔";; esac; }
          pages=0; size="n/a"
          if [ -d "$SITE_DIR" ]; then
            pages=$(find "$SITE_DIR" -name '*.html' | wc -l)
            size=$(du -sh "$SITE_DIR" | cut -f1)
          fi
          jekyll=$(bundle exec jekyll -v 2>/dev/null | awk '{print $2}' || true)
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          {
            echo "## 🏗️ Build"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build site | $(icon "$BUILD") $BUILD |"
            echo "| Test customizations | $(icon "$TEST_CUSTOM") $TEST_CUSTOM |"
            echo "| Test site (htmlproofer) | $(icon "$TEST_SITE") $TEST_SITE |"
            echo "| Upload site artifact | $(icon "$UPLOAD") $UPLOAD |"
            echo
            echo "**HTML pages:** $pages · **Site size:** $size · **Ruby:** $(ruby -e 'print RUBY_VERSION' 2>/dev/null || echo n/a) · **Jekyll:** ${jekyll:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs alongside build so the scan never delays a deploy.
  sonarqube:
    runs-on: ubuntu-latest
    outputs:
      quality_gate: ${{ steps.summary.outputs.quality_gate }}
      dashboard: ${{ steps.summary.outputs.dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan only uploads the report; wait for SonarCloud to process it,
      # then read the quality gate and headline measures for the summary.
      - name: SonarQube summary
        id: summary
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SCAN: ${{ steps.scan.outcome }}
        run: |
          report=.scannerwork/report-task.txt
          key=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          server="https://sonarcloud.io"
          dashboard="$server/dashboard?id=$key"
          gate="NONE"; conditions=""; measures=""
          if [ -f "$report" ]; then
            server=$(sed -n 's/^serverUrl=//p' "$report")
            dashboard=$(sed -n 's/^dashboardUrl=//p' "$report")
            ce_url=$(sed -n 's/^ceTaskUrl=//p' "$report")
            task=""
            for _ in $(seq 1 36); do
              task=$(curl -fsS -u "$SONAR_TOKEN:" "$ce_url" || true)
              case "$(jq -r '.task.status // empty' <<<"$task")" in SUCCESS|FAILED|CANCELED) break;; esac
              sleep 5
            done
            analysis_id=$(jq -r '.task.analysisId // empty' <<<"$task" 2>/dev/null || true)
            if [ -n "$analysis_id" ]; then
              qg=$(curl -fsS -u "$SONAR_TOKEN:" "$server/api/qualitygates/project_status?analysisId=$analysis_id" || true)
              gate=$(jq -r '.projectStatus.status // "NONE"' <<<"$qg" 2>/dev/null || echo NONE)
              conditions=$(jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(if .status == "OK" then "✅" else "❌" end) \(.status) | \(.actualValue // "–") | \(.comparator) \(.errorThreshold) |"' <<<"$qg" 2>/dev/null || true)
            fi
            m=$(curl -fsS -u "$SONAR_TOKEN:" "$server/api/measures/component?component=$key&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,duplicated_lines_density,ncloc" || true)
            measures=$(jq -r '.component.measures[]? | "| \(.metric) | \(.value) |"' <<<"$m" 2>/dev/null || true)
          fi
          case "$gate" in OK) gate_icon="✅";; ERROR) gate_icon="❌";; WARN) gate_icon="⚠️";; *) gate_icon="❔";; esac
          echo "quality_gate=$gate" >> "$GITHUB_OUTPUT"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          {
            echo "## 🔍 SonarQube"
            echo
            echo "**Scan:** $SCAN · **Quality gate:** $gate_icon $gate · [Open dashboard]($dashboard)"
            if [ -n "$conditions" ]; then
              echo
              echo "| Condition | Status | Actual | Threshold |"
              echo "| --- | --- | --- | --- |"
              echo "$conditions"
            fi
            if [ -n "$measures" ]; then
              echo
              echo "| Metric | Value |"
              echo "| --- | --- |"
              echo "$measures"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy summary
        if: always()
        env:
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$OUTCOME" in success) icon="✅";; failure) icon="❌";; *) icon="⚪";; esac
          {
            echo "## 🚀 Deploy"
            echo
            echo "**GitHub Pages:** $icon $OUTCOME${PAGE_URL:+ · [$PAGE_URL]($PAGE_URL)}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Overview of all stages; runs even when an earlier job fails or is skipped.
  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [build, sonarqube, deploy]
    if: always()
    steps:
      - name: Write pipeline summary
        env:
          BUILD: ${{ needs.build.result }}
          SONAR: ${{ needs.sonarqube.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PAGES: ${{ needs.build.outputs.pages }}
          SIZE: ${{ needs.build.outputs.size }}
          GATE: ${{ needs.sonarqube.outputs.quality_gate }}
          DASHBOARD: ${{ needs.sonarqube.outputs.dashboard }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          icon() { case "$1" in success|OK) echo "✅";; failure|ERROR) echo "❌";; WARN) echo "⚠️";; cancelled) echo "⚪";; skipped) echo "⏭️";; *) echo "❔";; esac; }
          {
            echo "# 📋 Pipeline summary"
            echo
            echo "**Commit:** [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) ${COMMIT_MSG%%$'\n'*} · **Ref:** $GITHUB_REF_NAME · **By:** $GITHUB_ACTOR · **Trigger:** $GITHUB_EVENT_NAME"
            echo
            echo "| Stage | Result | Details |"
            echo "| --- | --- | --- |"
            echo "| 🏗️ Build | $(icon "$BUILD") $BUILD | ${PAGES:-0} HTML pages, ${SIZE:-n/a} |"
            echo "| 🔍 SonarQube | $(icon "$SONAR") $SONAR | Quality gate: $(icon "${GATE:-NONE}") ${GATE:-NONE}${DASHBOARD:+ · [dashboard]($DASHBOARD)} |"
            echo "| 🚀 Deploy | $(icon "$DEPLOY") $DEPLOY | ${PAGE_URL:+[$PAGE_URL]($PAGE_URL)} |"
          } >> "$GITHUB_STEP_SUMMARY"
